captured thing, with a fixed shape: which surface produced it, that surface's own id for the item, a URL or the raw content, a timestamp, what kind of thing it is, and whether it is public or personal.","output":"A permanent row in the amber ledger, plus zero or more destinations for the items that earn one: a note in the [[knowledge archive]], a work issue, a newsletter slot, a blog seed, or a new monitored source.","files":[{"path":"LIFEOS/PULSE/modules/synapse.ts","mode":"exec","note":"the dashboard module serving the live capture stream at the synapse tab"},{"path":"LIFEOS/MEMORY/KNOWLEDGE/_schema.md","mode":"read","note":"the schema a promoted ledger row must satisfy to become an idea note"},{"path":"LIFEOS/TOOLS/HarvestExecutor.ts","mode":"exec","note":"the local writer for the classify-and-route path"},{"path":"amber ledger (append-only cloud database)","mode":"read+write","virtual":true,"note":"not a file in this tree; runs on the maintainer's own cloud account"},{"path":"grading workers (cloud)","mode":"exec","virtual":true,"note":"summarize and classify workers hosted on Arbol; per-install private infrastructure"}],"how":"The order of the four stages is the whole design, and the load-bearing part is that preservation comes first. The raw record is written to the amber ledger the instant it is caught, unconditionally, before any grader can reject it and before any router can drop it. That is write-ahead-log behaviour: nothing entering Synapse is ever lost, even if every step after it crashes. The ledger is append-only, raw rows are immutable, and grading enriches them rather than rewriting them.\n\nGrading runs next, asynchronously, so a capture never waits on a model call. The graders answer a specific question, and the phrasing matters. Not \"is this good\" but \"is this good for what this person is actually trying to do\". The important one is the classifier that scores an item against [[TELOS]], because it is the only grader tied to your stated mission, goals, problems and strategies rather than to generic quality.\n\nRouting turns a score into a destination. There are ten routes, from knowledge and blog seed through to none, and an item opens a work issue when its score clears the threshold and its classification is action-shaped. The rule that makes the system trustworthy is the split between the two: routing is conditional on the score, preservation never is. A weak signal earns no destination and still lives in the ledger forever.\n\nThe fourth stage is the one most capture systems skip. Something journaled and never dug back out is a write-only archive, so resurfacing is part of the contract: search, the dashboard tab, and promotion of the best rows into curated notes. Deduplication keeps that usable, since the same article arriving from three surfaces normalises to one row.","sources":["LIFEOS/DOCUMENTATION/Synapse/SynapseSystem.md","LIFEOS/DOCUMENTATION/CoreComponents.md","LIFEOS/DOCUMENTATION/Memory/MemorySystem.md"],"alternatives":[{"name":"A read-later app plus browser bookmarks","tradeoff":"Wins immediately, with nothing to build and good mobile capture. Costs permanence and judgement: read-later queues delete old items, bookmarks have no notion of what you are working on, and both leave the triage to you at exactly the moment you have no time for it."},{"name":"Grade first, then store only what scores well","tradeoff":"Wins on a clean store with no clutter, and it is cheaper. Costs everything the grader got wrong, permanently. A half-formed thought that scores badly today is the one you want in two years, and once it is discarded there is no appeal."},{"name":"One purpose-built pipeline per source","tradeoff":"Wins on fitting each source exactly, with no shared contract to compromise on. Costs multiplication: adding a twelfth input means inventing a twelfth pipeline, and grading logic drifts apart across them until no two sources are comparable."}],"why":"Splitting preservation from routing is the choice that defines Synapse. Storage is cheap and judgement is unreliable, so the system refuses to let a grader decide what survives. It only lets it decide what gets your attention. Naming one router also means adding a new input is wiring, not a new project. The costs are real and worth stating plainly. The ledger grows forever and nothing prunes it. The grade is only as good as the [[TELOS]] behind it, so a stale TELOS quietly mis-sorts everything. And the honest limit for a reader of the public release is that most of this runs on the maintainer's own cloud account, so what ships is the contract and the architecture rather than something you can start today.","examples":[{"field":"distribution","text":"Everything a wholesaler catches goes into one intake: a supplier price list emailed to a rep, a photo of a competitor shelf, a customer complaint taken over the phone. It is logged the moment it arrives with who caught it and when. Only then does anything grade it. The price list opens a task because margins are a stated goal this quarter, the shelf photo just sits in the log, and in six months the shelf photo is the evidence that a competitor changed pack size before anyone noticed."},{"field":"hospital","text":"Triage is exactly this shape. Every arrival is registered first, with a timestamp, before anyone judges how sick they are. Then a score decides who is seen next. Nobody is turned away at the door for scoring low, and the register is what lets you answer months later how many people came in with a given symptom, including the ones nothing happened to."}],"related":["cortex","feed","conduit","telos","arbol"],"without":"Without this: each capture surface goes somewhere different, nothing is scored against your goals, and finding a thing you saved two years ago depends on remembering which app you saved it in.","failure":"You notice it is broken when you remember capturing something and cannot find it anywhere, or when the ledger keeps filling while nothing has been routed to a destination in weeks."},{"id":"telos","name":"TELOS","box":"context","status":"Templates shipped. The starter scaffolds under LIFEOS/USER_TEMPLATES/ and the Telos skill ship with the release. What goes inside your own TELOS files is yours to write, and the setup flow interviews you to draw it out.","summary":"A set of files where you write down who you are and what you are trying to do, so the AI judges its answers against your real life instead of a generic one.","purpose":"Give a model a vague ask and you get confident motion in a random direction. [[TELOS]] holds your mission, goals, problems and strategies in writing, so every task can be framed against what you actually want.","who":"lifeos","trigger":"[[CLAUDE.md]] carries a top-level [[@-import]] of `LIFEOS/USER/TELOS/PRINCIPAL_TELOS.md`. [[Claude Code]] reads that file into [[context]] at the start of every [[session]], with no command from you. Separately, the Telos [[skill]] fires when a [[prompt]] matches its trigger phrases, such as \"my goals\" or \"add to TELOS\".","input":"Your own answers about mission, goals, problems, strategies, beliefs and challenges, written into the files under `LIFEOS/USER/TELOS/`. The shipped templates give you the shape so you are not staring at a blank file.","output":"A short generated derivative, `PRINCIPAL_TELOS.md`, that is small enough to load on every session. Also `LIFEOS_STATE.json`, the per-dimension percentages that the [[Pulse]] dashboard rings and the [[statusline]] read.","files":[{"path":"LIFEOS/USER/TELOS/TELOS.md","mode":"read","note":"the source of truth you write, one H2 section per kind of thing"},{"path":"LIFEOS/TOOLS/GenerateTelosSummary.ts","mode":"exec","note":"reads the TELOS source files and writes the compressed summary"},{"path":"LIFEOS/USER/TELOS/PRINCIPAL_TELOS.md","mode":"read+write","note":"the generated ~60-line derivative; written by the tool, read by every session"},{"path":"LIFEOS/USER/TELOS/LIFEOS_STATE.json","mode":"read","note":"dimension percentages the dashboard rings and the statusline show"},{"path":"LIFEOS/USER_TEMPLATES/Goals.md","mode":"read","note":"a shipped starter scaffold you copy into your own tree and edit"}],"how":"You write the long version once. `LIFEOS/USER/TELOS/TELOS.md` holds mission, goals, problems, strategies, narratives, challenges and more, each as its own H2 section. The Telos skill at `skills/Telos/SKILL.md` is the safe way in: its Update workflow takes a timestamped backup before it edits and logs the change, so a bad edit never silently eats a year of thinking.\n\nThe long version is too big to load on every turn, so `LIFEOS/TOOLS/GenerateTelosSummary.ts` reads the source sections and writes a compressed summary of roughly sixty lines to `PRINCIPAL_TELOS.md`. That file header says generated, never hand-authored, and it carries a timestamp so staleness is detectable. Compression is structural: it keeps the causal chain from mission to goal to problem to strategy rather than just the first N characters.\n\nThe last step is the wiring. `CLAUDE.md` lists `PRINCIPAL_TELOS.md` as a top-level import, and `LIFEOS/DOCUMENTATION/Config/ConfigSystem.md` explains why it has to be top-level: the harness does not follow imports from inside an imported file. So every identity file gets its own line in the routing table or it never loads at all.","sources":["LIFEOS/DOCUMENTATION/CoreComponents.md","LIFEOS/DOCUMENTATION/LifeOs/LifeOsThesis.md","skills/Telos/SKILL.md","LIFEOS/USER_TEMPLATES/README.md","LIFEOS/TOOLS/GenerateTelosSummary.ts:L1-L40","LIFEOS/DOCUMENTATION/Config/ConfigSystem.md"],"alternatives":[{"name":"Restate your goals in every prompt","tradeoff":"Wins on freshness, because you say exactly what matters today. Costs you the same paragraph typed forever, and it decays: the version you type when tired is shorter than the version you type when sharp, so the system quietly gets less direction on your worst days."},{"name":"A long free-form notes file the model may read","tradeoff":"Wins on zero structure and zero tooling. Costs you loading: a file nobody imports is a file nobody reads, and a file too big to load every [[turn]] gets skipped exactly when the [[context window]] is tight. Nothing keeps a summary in step with the long version."},{"name":"Keep goals in a project tracker and query them over [[MCP]]","tradeoff":"Wins on being the tool your team already uses, with real permissions and history. Costs a network call and a live service on the [[current state]] path, and trackers hold tasks rather than mission, so the why never makes it across."}],"why":"LifeOS split the artifact in two because the two jobs pull in opposite directions. The thing you write wants to be long, argued and personal. The thing that loads on every session wants to be short enough that nobody is tempted to skip it. A generated derivative gets both, and generation is what keeps them honest, since a hand-maintained summary drifts from its source within weeks. The price is real: a generated file can go stale if the tool is not run, the compression drops nuance you might have wanted, and none of this works until you sit down and answer hard questions about your own life. LifeOS accepts that cost because the alternative is a system that gives everyone the same answer.","examples":[{"field":"distribution","text":"A drinks wholesaler writes down that the goal for this year is cutting days-sales-outstanding from 45 to 30 without losing a top-20 customer, and that the standing problem is reps quoting discounts nobody re-approves. From then on, a request for a debtor report is not answered generically. The system knows the report has to make the overdue-and-large customers findable, and that a discount column is load-bearing rather than decoration."},{"field":"hospital","text":"A ward writes down that the mission is discharging patients before noon and that the bottleneck is pharmacy turnaround, not bed cleaning. A request to \"improve the discharge board\" then gets judged against that. A pretty board that hides the pharmacy clock fails the stated goal even though it looks better than what was there before."}],"related":["context","isa","algorithm","conduit","cortex"],"without":"Without this: every answer is written for a generic person, and you re-type your own goals into the prompt each time you want them considered.","failure":"You notice it is broken when the system starts giving textbook advice that would suit anyone, or when it recommends something that contradicts a decision you made months ago and wrote down."},{"id":"tools","name":"Tools & integrations","box":"capability","status":"Code shipped. `LIFEOS/TOOLS/` holds 177 TypeScript programs on this install. The [[MCP]] side is configured in a `.mcp.json` file that this install does not currently have.","summary":"Anything the system has to do the same way every time is written as a small command you can run yourself, and the model just decides when to run it and with which options.","purpose":"A model asked to redo a mechanical job from scratch each time will produce a slightly different answer each time. Writing the mechanical part as a command makes it repeatable, testable and inspectable, and shrinks the model's job to choosing the flags.","who":"claude-code","trigger":"A LifeOS [[tool]] runs when the model issues a Bash [[tool call]] naming it, for example `bun ~/.claude/LIFEOS/TOOLS/GetTranscript.ts <url>`. An [[MCP server]] works differently: [[Claude Code]] connects to it at startup from a config file and exposes each of its remote tools as a callable named `mcp__<server>__<tool>`, which the model then calls like any other tool.","input":"Command-line arguments and flags, or standard input, or for an [[MCP]] tool a JSON argument object matching the server's published schema.","output":"Text or JSON on [[stdout]] plus an [[exit code]]. Diagnostics go to [[stderr]] so that [[stdout]] stays clean enough to pipe into the next command.","files":[{"path":"LIFEOS/TOOLS/Inference.ts","mode":"exec","note":"the one sanctioned way to make a model call from a script; four run levels, and it reports which model actually ran"},{"path":"LIFEOS/TOOLS/models.ts","mode":"read","note":"the single registry of current model IDs; consumers pass a tier [[alias]] so they never go stale"},{"path":"LIFEOS/TOOLS/GetTranscript.ts","mode":"exec","note":"a plain single-purpose utility: URL in, transcript out"},{"path":"LIFEOS/TOOLS/Doctor.ts","mode":"exec","note":"probes the outside tools the doctrine assumes but the install does not ship, and writes an advisory manifest"},{"path":"LIFEOS/DOCUMENTATION/Tools/Tools.md","mode":"read","note":"the catalogue; adding a tool means adding a section here"}],"how":"The rule in `LIFEOS/DOCUMENTATION/Tools/CliFirstArchitecture.md` is three steps in a fixed order: write down what must happen every time, build a [[deterministic]] command with explicit flags, test that command with no model involved at all, and only then wrap it in prompting. The load-bearing step is the third one. A tool that works perfectly without any model is a tool the model can be trusted to call.\n\nEach utility is a single flat file in `LIFEOS/TOOLS/` with a TitleCase name, documented in `Tools.md`. The dividing line against building a [[skill]] is sharp: one command with parameters is a tool, while multiple workflows or state or a decision about how to proceed is a skill. `Inference.ts` is the interesting case, because it is the tool through which every other script talks to a model. Scripts are forbidden from importing a vendor SDK directly; they call `Inference.ts`, which owns authentication, retries, timeouts and defaults, reads back from the response which model actually answered, and logs any downgrade.\n\nFor [[MCP]] the same document draws a boundary with one question: who calls it. If this harness is the caller, build a command, because the schemas stay out of [[context]] and the thing survives protocol revisions untouched. If somebody else's client is the caller, serve [[MCP]], because a command cannot serve a remote client and cannot do per-user authentication. Wrapping a third-party API for your own use is a command, every time.","sources":["LIFEOS/DOCUMENTATION/Tools/Tools.md","LIFEOS/DOCUMENTATION/Tools/CliFirstArchitecture.md","LIFEOS/DOCUMENTATION/Tools/Cli.md","LIFEOS/DOCUMENTATION/CoreComponents.md"],"alternatives":[{"name":"Ask the model to write the code fresh each time","tradeoff":"Wins zero setup and total flexibility. Costs reproducibility: run the same file twice and you can get two different answers, with no way to test the behaviour separately, because it lives in a [[prompt]] that drifts."},{"name":"Expose every capability as an [[MCP server]]","tradeoff":"Wins a typed contract and reuse by other clients. Costs a protocol layer to run, schemas occupying [[context]] whether used or not, and exposure to spec revisions that a plain command never notices."},{"name":"A shared library the model imports rather than a command","tradeoff":"Wins type safety and no process spawn. Costs the ability to run and test the thing by hand from a shell, which is exactly the property that makes a failure debuggable after the fact."}],"why":"The system is built on the claim that prompts orchestrate and code executes, so anything repeated gets a command. That buys three things at once: the same input gives the same output, you can inspect the exact command that produced a bad result, and you can test the behaviour with no model in the loop. The cost is friction. Every new capability is a file to write, a section to document and a name to keep flat, and the doc is explicit that this is the wrong trade for a genuine one-off, where a direct question is faster and building a tool is over-engineering. The `Doctor.ts` probe exists because of the other cost: commands that depend on outside binaries degrade silently, so something has to check they are still there.","examples":[{"field":"distribution","text":"A wholesaler receives supplier price lists as spreadsheets where the effective date is written five different ways. Instead of asking a model to tidy each file, they build one command that takes the file, the column and an explicit rule for ambiguous dates, and writes a clean file. Same file, same flags, same output, and the day-versus-month rule is a visible flag rather than a guess buried in a prompt. The model's remaining job is to read \"fix the dates, they are US format\" and pick the right flag."},{"field":"newsroom","text":"A newsroom does not let each reporter invent their own way to check a photo's metadata before publication. There is one script on the desk machine that reports the capture time, the camera and whether the file was edited. Everyone runs the same script, so two reporters checking the same photo get the same answer, and a wrong answer can be traced to the script rather than to whoever ran it."}],"related":["skills","arbol","doctor","hooks","agents"],"failure":"The same task yields a different answer on two runs, or nobody can reproduce a step from the shell, which means the work was improvised in a [[prompt]] instead of run as a command."},{"id":"voice","name":"Voice","box":"none","status":"Optional, needs setup. The hook, the handler, the [[voice server]] module, and the pronunciation stages all ship, but nothing is spoken until Pulse is running and you have supplied a voice provider key and a voice id. Push and chat channels each need their own configuration on top.","summary":"The assistant reads one line of its answer out loud, so you can walk away from the screen and still know when it finished.","purpose":"Long work means staring at a terminal waiting for it to stop. A spoken line closes the feedback edge: the system tells you it advanced, and you do not have to watch to find out.","who":"lifeos","trigger":"hooks/VoiceCompletion.hook.ts runs on Stop, at the end of every assistant [[turn]]. It reads the [[transcript]] and looks for the speaking-icon line in the response. A separate path fires mid-run: a [[skill]] or [[workflow]] posts to the notification endpoint itself when it starts significant work.","input":"The response text, plus the voice id and display name from configuration. For the routing layer: the event type and how long the task took.","output":"Spoken audio through the text-to-speech provider. One appended line in the voice event log. Optionally a phone push or a chat message, when the routing table says the event deserves one.","files":[{"path":"hooks/VoiceCompletion.hook.ts","mode":"exec","note":"extracts the spoken line from the response at Stop"},{"path":"hooks/handlers/VoiceNotification.ts","mode":"exec","note":"the handler the hook delegates to"},{"path":"LIFEOS/PULSE/VoiceServer/voice.ts","mode":"exec","note":"the module inside Pulse that calls the provider"},{"path":"LIFEOS/PULSE/lib/homographs.ts","mode":"read","note":"respells words the provider reads with the wrong sense"},{"path":"LIFEOS/USER/PRINCIPAL/PRONUNCIATIONS.json","mode":"read","note":"your own literal term-to-sound map"},{"path":"LIFEOS/MEMORY/VOICE/voice-events.jsonl","mode":"write","note":"every spoken event, one line each"},{"path":"hooks/lib/notifications.ts","mode":"exec","note":"the routing layer for push and chat channels"},{"path":"settings.json","mode":"read","note":"the voice id mirror and the notification routing table"}],"how":"The path is short. hooks/VoiceCompletion.hook.ts fires on Stop, parses the [[transcript]], and pulls out the one line the assistant marked as speakable. Its header notes a gate that matters: only a main terminal [[session]] speaks. A [[subagent]] never does, so ten agents finishing at once do not produce ten voices talking over each other. If the response carries no speakable line, the hook falls back to a summary line, then to the first sentence, and gives up rather than reading a wall of text.\n\nThe line then goes to the notification endpoint that Pulse serves, and Pulse hands it to the provider. Two transforms run first, and LIFEOS/DOCUMENTATION/Notifications/NotificationSystem.md explains why. One applies your own literal pronunciation map. The other fixes words the provider guesses wrong from context. The example given is \"live\", where \"the site is live\" would otherwise be read as the verb in \"where you live\", and the fix respells only the occurrences that match the broadcast sense rather than replacing the word everywhere.\n\nAbove that sits a routing table in settings.json that decides who hears about what. An ordinary completion is voice only. A task over five minutes, or a background agent finishing, adds a phone push. A security alert adds a chat channel too. Every dispatch is fire and forget with a short timeout, so a dead channel never blocks the run. One rule is worth remembering: scheduled jobs never speak, because a daemon that talks at three in the morning is a bug, not a feature.","sources":["LIFEOS/DOCUMENTATION/Notifications/NotificationSystem.md","hooks/VoiceCompletion.hook.ts:L1-L25","LIFEOS/DOCUMENTATION/Pulse/PulseSystem.md","LIFEOS/DOCUMENTATION/CoreComponents.md"],"alternatives":[{"name":"A terminal bell or a desktop notification","tradeoff":"Free, instant, and works with no service at all. Carries one bit of information: something happened. You still have to go and look to find out what, which is exactly the trip the spoken line saves."},{"name":"The operating system's built-in speech","tradeoff":"Wins by costing nothing per word and working offline. Costs quality badly enough that you stop listening, and gives you no choice of voice, which for a system meant to feel like yours is most of the point."},{"name":"Push notifications only","tradeoff":"Reaches you anywhere, and keeps a written record you can read later. Costs your attention in the wrong direction, because it puts you back on the phone, and a notification that arrives while you are already at the desk is noise."}],"why":"The design bet is that the useful signal is one sentence, not an alert. Because the [[model]] writes that sentence as part of its answer, the hook only has to find and forward it, so nothing has to summarise anything twice. The costs are honest ones. Every spoken line is a paid API call to an outside provider, which means the text of your completion lines leaves the machine, so the routing rules are deliberately narrow. And the whole thing rides on Pulse: when the daemon is down the system simply goes quiet, and silence is indistinguishable from having nothing to say.","examples":[{"field":"distribution","text":"The warehouse does not put a screen on the forklift. A pick that completes normally says one line over the headset and nothing else. A pick that fails, or a cold-chain door left open past its threshold, escalates to the supervisor's phone as well. The night shift is deliberately excluded from the spoken channel, because an automated voice in an empty building is only ever startling."},{"field":"school","text":"A school does not ring the bell for everything. The end of a lesson is one short announcement everyone hears in passing. A fire alarm is a different channel entirely and reaches the whole site. Routine internal messages never go over the speakers at all, because a public address system that talks constantly is one nobody listens to."}],"related":["pulse","observability","hooks","hermes"],"without":"Without this: you have to watch the terminal to know when a long run finished, and a background job that completed an hour ago tells you nothing until you look.","failure":"Long runs finish in silence when you expected to hear them, and the voice event log has no new lines even though the sessions clearly ended."}],"breakIt":["Pick any three components and, before reading their pages, write which box you think each belongs to and what would break without it. Then read. Count how many you placed wrong; that number is your homework list.","Find one component whose `status` says private or blueprint. Then look in `~/.claude/LIFEOS/DOCUMENTATION/` for its document and confirm the document exists while the runnable code does not. That is what \"blueprint\" means on disk.","Choose the component you think is least necessary. Read its `why` field and try to argue the author out of it. If you cannot, you have learned something; if you can, write it in FAILURES.md under `capability` and tell me."],"recall":["From memory, name at least three components per box. Then check the map in Part 0.","Which component sits in two boxes, and why is that not a mistake?","For any one component: its purpose, its trigger, one alternative, and what the alternative would have cost."],"transfer":["Take the 9T ERP as it exists today and place its features on the same five boxes: what is context (the account_role registry), capability (the reconciliation endpoints), control (the Flyway migration rule), memory (Postgres), verification (the Σ-parts-equals-total controls). Notice how much of box 5 you have already built.","For each of the 25 components, write one word: KEEP, ADAPT, or DROP for the 9T agent. Part 5 gives the answer key; do yours first."]},{"id":"p4","number":4,"title":"Build one","subtitle":"What any agent needs, what only a LifeOS-class agent adds, and the twelve files that get you from an empty folder to a system with teeth.","kind":"build","body":"\n## The one question this page answers\n\n*If I build my own, what do I need in any case, and what is LifeOS-specific?*\n\nThe honest answer is a table with two columns. The left column is what every agent has, whether it is LifeOS, a customer-service bot, or a coding assistant. The right column is what you add when you want LifeOS's specific guarantees: it knows you, it enforces, it remembers, it will not lie about being done. You can stop after the left column and have a working assistant. You cannot stop after the left column and have *this*.\n\n| Any agent needs | Only a LifeOS-class agent adds | Which box |\n|---|---|---|\n| A [[context]] file the [[harness]] loads before the first word | A split constitution: non-negotiables in the [[system prompt]], a routing table in [[CLAUDE.md]] | 1 Context |\n| An identity or purpose statement | [[TELOS]] as the scoring standard every suggestion is measured against, with dates | 1 Context |\n| At least one capability the model can reach for | [[skill]]s that self-trigger on plain sentences via a USE WHEN index | 2 Capability |\n| A way to run real code | Deterministic [[hook]]s that can rewrite or block a [[tool call]] before it runs | 3 Control |\n| A permission floor the model cannot talk past | The SYSTEM / USER [[zone]] boundary and an [[installer]] that never deletes | 3 Control |\n| A log of what happened | A [[memory]] tier with a hot layer, retrieval, curation and a health check | 4 Memory |\n| Some notion of \"done\" | An [[ISA]] with a [[falsifier]] per claim, and a Stop gate that refuses \"done\" without [[evidence]] | 5 Verification |\n| — | A dashboard, a voice, a doctor, a status line | Output only |\n\nRead the left column again. It is short. That is the encouraging part: a working agent is five things, and you built three of them in the first four chapters of the book.\n\n## The twelve-file minimum\n\nBelow is the smallest tree that has one file per row of the table above, mapped to the chapter in `CHAPTERS.md` that builds it. This is the same `build/myos` you are already building; the mapping is what the old Engine Room could not show you.\n\n```\nmyos/\n├─ CLAUDE.md                     routing table            Chapter 1, 4        box 1\n├─ SYSTEM_PROMPT.md              constitution             Chapter 4           box 1\n├─ USER/\n│  ├─ IDENTITY.md                who you are              Chapter 2           box 1\n│  ├─ TELOS.md                   what you want            Chapter 3           box 1\n│  └─ RULES.md                   your standing rules      Chapter 5           box 1\n├─ skills/\n│  └─ first/SKILL.md             one capability           Chapter 7, 8        box 2\n├─ hooks/\n│  ├─ banner.ts                  SessionStart, prints     Chapter 14          box 3\n│  ├─ inject.ts                  UserPromptSubmit, adds   Chapter 15          box 3\n│  └─ guard.ts                   PreToolUse, exit 2       Chapter 16          box 3\n├─ memory/\n│  ├─ write.ts                   Stop, appends            Chapter 22          box 4\n│  └─ recall.ts                  UserPromptSubmit, reads  Chapter 23          box 4\n├─ ISA.md                        what done means          Chapter 27          box 5\n└─ settings.json                 wires the hooks          Chapter 14          interface\n```\n\nTwelve authored files plus the settings file. Every one of them has a bigger sibling in Part 3: `CLAUDE.md` grows into Context & configuration; `hooks/guard.ts` grows into PreToolGuard with four checks; `memory/` grows into Cortex. The shape does not change as it grows. That is the whole reason the small version is worth building first.\n\n## Build order, and why\n\nThe chapter book's order is dependency order, not importance order, and Part 0 already told you the leverage ranking. Restated here because it decides what you build when you have only one hour:\n\n1. **Context first (chapters 1–6).** Nothing else can be tested without a session that knows something.\n2. **One skill (7–8).** Cheap, satisfying, and it proves the harness loads things on demand.\n3. **Enforcement (14–16).** The first hook that blocks is the moment the system stops being a suggestion. If you build nothing else from Part 3, build `guard.ts`.\n4. **Memory (22–23).** Only after enforcement, because memory without rules just remembers wrong things reliably.\n5. **Verification (27–29).** Highest leverage, built last, because you cannot verify what does not exist.\n\n## The five LifeOS ideas worth taking anywhere\n\nIf you build for someone else and can carry only five things from LifeOS, carry these. Each is a *shape*, not a file; each fits any harness and any domain.\n\n| Idea | The shape | Where it came from |\n|---|---|---|\n| **Evidence before \"done\"** | Every claim names the check that would prove it false; nothing closes without that check's output | ISA + VerificationGate |\n| **Hooks as guards, not advice** | The few things that must never happen are code with an exit code, not sentences in a prompt | PreToolGuard |\n| **Zone boundary** | Sort every file by who owns it; updates overwrite one side and never touch the other | SystemUserBoundary |\n| **Skill file format** | One markdown front page with USE WHEN phrases, optional workflows, optional real scripts | SkillSystem |\n| **Append-only event log** | Every action is one JSONL line; nobody reads it on a good day | EventLogger |\n\nEverything else in Part 3 is either personal (voice, tabs, TELOS), infrastructure (Pulse, Atlas, Ledger), or private (Arbol, Feed, Bunker). Useful, but not the part that transfers.\n\n## What you do not need to understand to build this\n\nYou asked, at the very start, whether you needed to read TypeScript to build with AI. The honest answer for this page: you need to *read* the twelve files well enough to know which box each one is in and what it would do if it broke. You do not need to write them. You direct; the model writes; you run the probe. Every chapter in the book is built that way, and so is this app.\n","breakIt":["Take your current `build/myos` and draw it as the twelve-file tree above. Mark each file that exists green and each that does not red. The red ones are your next chapters, in dependency order.","Delete (move aside) `hooks/guard.ts` from the tree in your head and ask: which of the five guarantees is gone? Then do the same for `memory/recall.ts`. If you cannot name the guarantee, re-read the two-column table.","Try to add a sixth \"idea worth taking anywhere\" from Part 3. Argue for it. Most candidates turn out to be personal or infrastructure, which is the lesson."],"recall":["Closed book: the left column of the table. Five rows, five boxes.","The twelve files, grouped by box, from memory.","The five ideas that transfer, and for each, one sentence on the shape."],"transfer":["Sketch the twelve-file tree for the 9T agent (Part 5 gives the answer). Which files keep their names, which get renamed (IDENTITY → COMPANY), which disappear?","For BachmannLogi: which two of the five transferable ideas would you sell them first? Write the one-paragraph pitch for each."]},{"id":"p5","number":5,"title":"The distribution agent","subtitle":"What an agent for 9T would be, where it overlaps a personal LifeOS, where it does not, and four ways to build it, scored.","kind":"distribution","body":"\n> **Assumption, stated once:** \"my distribution organisation\" is **9T**, the Georgian trading company behind 9T ERP: sellers, customers, debtors, products, a warehouse, delivery and vehicles. If you meant another business, the method on this page does not change; the rows do.\n\n## Who would use it, and for what\n\nA personal LifeOS has one user, one identity, one terminal. A company agent has none of those. Start from the people:\n\n| User | What they need from an agent | Data it touches |\n|---|---|---|\n| **Owner** | A morning brief: cash position, receivables due, exceptions overnight, which seller is behind; \"why is Friday revenue down\" answered with evidence | ERP Postgres (GL, sales, debtors, cash flow) |\n| **Sellers** (sales reps) | Customer notes before a visit; debtor follow-up scripts; order capture by voice or text; \"what did this shop buy last month\" | customers, sales lines, AR ledger |\n| **Warehouse** | Stock check; pick lists; \"which orders can ship today\"; discrepancy flags | products, stock, orders |\n| **Accountant** | Bank statement reconciliation; RS.ge waybill matching; month-end close checks; \"which invoices have no source document\" | bank feeds (TBC, BOG), RS.ge, GL |\n| **Drivers** | Route for today; proof-of-delivery capture; \"this customer's gate is closed\" | delivery, vehicles |\n\nFive kinds of user, on phones and desktops, at the same time, with different rights. That single sentence rules out copying LifeOS as it stands.\n\n## The overlap map, box by box\n\nEvery LifeOS idea, judged for 9T. **Same** means the mechanism transfers with a rename. **Different** means the shape must change. **Drop** means it is personal or infrastructure that a company agent does not want.\n\n| LifeOS idea | In a personal LifeOS | In the 9T agent | Verdict |\n|---|---|---|---|\n| Context file | who Boris is | what 9T is: products, regions, price rules, seasons, who may approve what | **Same mechanism, different file** (`COMPANY.md`, not `IDENTITY.md`) |\n| [[TELOS]] | life goals with dates | company KPIs with numbers: DSO under 12 days, gross margin, fill rate, seller targets | **Same idea, must be numeric and per-period** |\n| Split constitution | rules in the [[system prompt]], pointers in CLAUDE.md | the same split: money rules in the system prompt, data map in the routing table | **Same** |\n| [[skill]]s | 75 personal skills | about eight business skills: debtor call, stock check, route, daily brief, reconcile statement, waybill match, order capture, exception report | **Same format, far fewer** |\n| [[hook]]s as guards | 68, mostly about the assistant's own behaviour | about six, all about money and writes: no GL write without a matching source row; no price change without a valid-from date; no customer delete, ever | **Same mechanism, different targets** |\n| Advisory hooks | format contract, nudges, drift | one or two: \"this customer is on credit hold\", \"this statement was already imported\" | **Same mechanism, mostly dropped** |\n| [[memory]] | one person's facts in two markdown files | per-customer notes shared across five sellers, with who-wrote-what and when | **Different: multi-user, must be a database table, not a file** |\n| Verification / [[ISA]] | evidence before \"done\" | reconciliation controls: sum of parts equals declared total, two independent checks on every displayed number | **Identical, and you already build this in 9T ERP** |\n| Zone boundary | SYSTEM vs USER | product code vs tenant configuration (9T's rules are config, the engine is code) | **Same principle** |\n| Event log | tool-activity.jsonl | an audit trail: who asked what, what the agent read, what it wrote | **Same, and legally required for money** |\n| Pulse, voice, Kitty tabs, statusline, spinner | central to the daily feel | irrelevant; users are on phones | **Drop** |\n| Atlas, Ledger, Doctor | what Boris owns; versioning; health | a small health check is worth keeping; the rest is LifeOS maintaining itself | **Drop, keep a health probe** |\n| Arbol, Feed, Synapse, Conduit | cloud pipelines and capture | scheduled jobs (nightly reconciliation, morning brief) | **Different: a scheduler, not a personal capture pipeline** |\n| Single principal, terminal sessions | the whole design | many users, roles, auth, a chat or API surface, scheduled runs with no human present | **Different shape entirely** |\n\nCount the verdicts: seven **Same**, five **Different**, three **Drop**. The mechanisms transfer; the shell does not.\n\n## Where LifeOS is too large\n\nBe blunt about it, because a client will be:\n\n- **68 hooks** exist to govern one assistant's behaviour toward one person. A company agent needs six, and they are about money.\n- **The memory system** assumes one person whose facts fit in two files. Five sellers writing notes about the same customer need a table with an author column, not a markdown file with a cap.\n- **Pulse, voice, tabs, the status line, the banner, Atlas, the installer** are LifeOS looking after itself. They are most of the code.\n- **The single-principal assumption** is structural: identity files, TELOS, memory, permissions all assume one human whose word is authority. In a company, authority is a role, not a person.\n- **Terminal sessions** are the wrong surface. A seller in a shop needs a phone; the owner needs a message at 7 am without asking.\n\nSo: **do not fork LifeOS for 9T.** Take its ideas, not its tree.\n\n## Four ways to build it, scored\n\nCriteria, each 1–5: **Fit** (do the five users get what they need), **Cost** (5 = cheapest to first value), **Ideas kept** (how many of the five transferable ideas survive intact), **Risk** (5 = lowest operational and money risk), **Growth** (does it become the real thing without a rewrite).\n\n| # | Approach | What it is | Fit | Cost | Ideas kept | Risk | Growth | Total |\n|---|---|---|---|---|---|---|---|---|\n| 1 | **Thin harness inside `9T_erp`** | `CLAUDE.md` + eight skills + six guard hooks in the repo; the agent helps Boris *build and operate* the ERP from a terminal | 2 | 5 | 5 | 5 | 2 | **19** |\n| 2 | **Agent SDK service** | The same skills and guards, run as a service with a chat and API surface, roles, scheduled jobs, memory in Postgres | 5 | 3 | 5 | 4 | 5 | **22** |\n| 3 | **Workflow engine + model steps** | Deterministic pipelines (n8n, Temporal or a cron of scripts) with a model only where judgement is needed: nightly reconciliation, the morning brief, exception routing | 3 | 4 | 3 | 5 | 3 | **18** |\n| 4 | **Fork LifeOS** | Install LifeOS for 9T and strip what does not fit | 2 | 2 | 5 | 2 | 1 | **12** |\n\n**How to read it.** Option 1 is the cheapest and it is what you should do *this month*: it costs a day, it keeps every transferable idea, and it makes you faster at building 9T. But it is a tool for you, not a product for sellers. Option 2 is the shape that fits the users, and it scores highest because it grows; it costs weeks, not days. Option 3 wins for the scheduled half of the work (reconciliation, briefs) and loses for anything conversational. Option 4 scores lowest on the two criteria that matter most for a company, cost and risk, because the first month would be spent deleting.\n\n## The recommendation\n\nDo them in order, and let each one pay for the next:\n\n1. **Now: option 1.** A `CLAUDE.md` in `9T_erp`, the six money guards as PreToolUse hooks in that repo's `.claude/`, and the first three skills (reconcile statement, debtor list, daily brief). You will use it tomorrow. Every guard you write here is a guard the service in step 2 will reuse unchanged.\n2. **When a second user needs it: option 2.** Wrap the same skills and guards in a service with a chat surface for sellers and an API for the ERP. Memory moves from files to a `customer_notes` table with an author column. Roles come from the ERP's users.\n3. **For the nightly work: option 3, inside option 2.** Reconciliation and the morning brief are pipelines with one judgement step each; run them on a schedule and have the service surface the exceptions.\n\n**Carry exactly five things from LifeOS**, and carry them as shapes: evidence before \"done\" (your reconciliation controls already are this), hooks as guards (the six money rules), the zone boundary (engine code vs 9T configuration), the skill file format, and the append-only audit log. Leave everything else in `~/.claude` where it belongs.\n\n## What the twelve-file tree becomes\n\n```\n9T_erp/.claude/\n├─ CLAUDE.md                 data map: where GL, sales, AR, bank feeds live; the aliases sellers use\n├─ SYSTEM_PROMPT.md          money rules: never post without a source row; show discrepancies, never fix them\n├─ COMPANY.md                what 9T is (replaces IDENTITY.md)\n├─ KPIS.md                   numeric TELOS: DSO, margin, fill rate, per month (replaces TELOS.md)\n├─ RULES.md                  approval matrix, credit policy\n├─ skills/\n│  ├─ reconcile-statement/   bank statement vs GL, discrepancy list\n│  ├─ debtor-followup/       overdue list + call script per customer\n│  ├─ daily-brief/           cash, receivables, exceptions, one screen\n│  └─ waybill-match/         RS.ge waybills vs invoices\n├─ hooks/\n│  ├─ guard-gl-write.ts      PreToolUse: block a GL write with no source reference\n│  ├─ guard-price-change.ts  PreToolUse: block a price without valid-from\n│  └─ audit-log.ts           PostToolUse: every read and write, one JSONL line, with the user\n├─ ISA.md                    what \"the month is closed\" means, as claims with probes\n└─ settings.json\n```\n\nSame shape as Part 4. Different nouns. That is the test that you understood Part 4: you can rename every file and say why.\n","breakIt":["Argue the other side: write three sentences for why option 4 (fork LifeOS) is right for 9T. If you cannot make them convincing, you understand the \"too large\" section. If you can, tell me; the scores may be wrong.","Pick one row marked **Same** in the overlap map and try to break it: find a way the 9T version is actually different. Memory is the trap most people fall into first; the Same rows are harder.","Take the six money guards implied above and write the falsifier for each: what tool call would each one block, and what stderr text would the model see?"],"recall":["The five kinds of user and one need each, from memory.","Seven Same, five Different, three Drop: name two of each without looking.","The four options and their totals, and the one criterion where option 4 scores lowest.","Which five ideas transfer, and in what form (file, shape, table)?"],"transfer":["Do the same page for BachmannLogi: users (owner, dispatchers, payroll), the overlap map, the four options. Your scores will differ on Fit and Risk because payroll data is more sensitive than sales data.","Open `9T_erp` and create the `.claude/CLAUDE.md` from the tree above, twenty lines, today. That is option 1's first file and it is also Chapter 1's transfer exercise. Everything on this page becomes real the moment that file exists."]}],"glossary":[{"term":"model","aliases":["language model","LLM"],"meaning":"The program that turns text into text. It reasons and decides, and that is all: no memory between replies, no files, no hands.","analogy":"A dispatcher in a windowless room with a radio: decides everything, touches nothing."},{"term":"harness","meaning":"The program around the model that keeps the conversation, runs tools, reads files and loops until the job is done. Claude Code is a harness.","analogy":"The warehouse around the dispatcher: forklifts, scanners, the note on the desk."},{"term":"Claude Code","meaning":"Anthropic's terminal program that runs Claude in a loop with file and shell tools. LifeOS lives inside its folders and extension points.","analogy":"The kitchen: stoves, knives and the rule that every plate goes through the pass."},{"term":"LifeOS","meaning":"A set of markdown files, TypeScript scripts and one settings file that Claude Code finds and uses. It adds identity, rules, memory, enforcement and verification. It is not a program you run.","analogy":"The restaurant's own recipe book and the sign on the wall; the kitchen works without it, just not as this restaurant."},{"term":"context","meaning":"Everything the model can see when it writes its next reply: system prompt, files loaded at start, the conversation, hook output, tool results.","analogy":"The papers open on the desk right now."},{"term":"context window","meaning":"The maximum amount of text the model can see at once. Everything loaded costs part of it on every turn.","analogy":"The size of the desk. A bigger stack of papers means less room to work."},{"term":"token","aliases":["tokens"],"meaning":"The unit the model reads and writes in, roughly three-quarters of a word. Context is measured and billed in tokens.","analogy":"Postage: every line you load is paid for again on every reply."},{"term":"system prompt","meaning":"Instructions delivered above the conversation, as rules rather than as a message. LifeOS appends its constitution here with one launch flag.","analogy":"The laminated rules on the wall, not a note someone left on the desk."},{"term":"CLAUDE.md","meaning":"The context file Claude Code reads at start from the working folder. In LifeOS it is a routing table: mostly pointers, almost no rules.","analogy":"The one-page cover sheet that says where everything else is."},{"term":"@-import","aliases":["import","@import"],"meaning":"A line in CLAUDE.md starting with @ and a path. Claude Code loads that file too. It does not follow imports inside imported files.","analogy":"A \"see attached\" line on the cover sheet."},{"term":"hook","aliases":["hooks"],"meaning":"A program Claude Code runs automatically at a fixed moment: session start, before a tool, after a tool, when a reply ends. It gets JSON on stdin; its stdout becomes context; exit code 2 blocks.","analogy":"A door switch that runs when the door opens, whether or not anyone wanted it to."},{"term":"lifecycle event","aliases":["event","events"],"meaning":"A named moment in a session when hooks can fire: SessionStart, UserPromptSubmit, PreToolUse, PostToolUse, Stop, SessionEnd and a few more.","analogy":"The bells in a school day: first bell, lesson start, lesson end."},{"term":"matcher","meaning":"A filter on a hook registration saying which tools it applies to, for example \"Write|Edit\". An empty matcher means every tool.","analogy":"The sign on the door switch saying \"front door only\"."},{"term":"stdin","meaning":"The input stream of a program. Claude Code writes one JSON object here when it runs a hook.","analogy":"The in-tray."},{"term":"stdout","meaning":"The output stream of a program. What a hook prints here is added to the model's context (or, for the status line, shown on screen).","analogy":"The out-tray."},{"term":"stderr","meaning":"The error stream. Hooks write diagnostics here; the model never sees it, the terminal log does.","analogy":"The note to the supervisor, not to the customer."},{"term":"exit code","meaning":"The number a program returns when it ends. 0 means fine. For hooks, 2 means block.","analogy":"The thumbs up or thumbs down at the end of a task."},{"term":"exit code 2","aliases":["exit 2"],"meaning":"The one exit code that lets a PreToolUse hook stop a tool from running, or a Stop hook send a reply back for correction. The text on stderr goes to the model as the reason.","analogy":"The inspector's red stamp: the van does not leave."},{"term":"additionalContext","meaning":"The field in a hook's JSON output that carries text into the model's context. Most LifeOS advisory hooks use it.","analogy":"A sticky note added to the pile before the model reads it."},{"term":"system-reminder","meaning":"A tagged block of text a hook prints so the model treats it as system-level context rather than as something you said.","analogy":"A memo on official letterhead, not a hallway comment."},{"term":"async hook","aliases":["async"],"meaning":"A hook Claude Code starts and does not wait for. Its output cannot reach the current turn; it is for side effects like logging or naming the tab.","analogy":"Posting a letter: it goes, you do not stand at the box."},{"term":"timeout","meaning":"The seconds a hook may run before Claude Code gives up on it. Keeps one slow script from freezing every turn.","analogy":"The kitchen timer on a pot you cannot watch."},{"term":"settings.json","meaning":"Claude Code's one configuration file: model, hooks, permissions, status line, environment. LifeOS writes most of it; Claude Code reads it.","analogy":"The wiring diagram for the building."},{"term":"skill","aliases":["skills"],"meaning":"A folder with a SKILL.md and optional workflows and scripts that gives the assistant a capability on demand. Loaded when named or when its USE WHEN phrases match.","analogy":"A workshop manual plus the tools for one kind of job, on a labelled shelf."},{"term":"SKILL.md","meaning":"The front page of a skill: what it does, when to use it, which workflow to run.","analogy":"The label on the shelf."},{"term":"USE WHEN","meaning":"The phrase list in a skill's description that lets it be matched to a prompt without being named. LifeOS indexes these so a hook can nudge the model.","analogy":"The index tabs on the manual."},{"term":"workflow","meaning":"A markdown file inside a skill describing one procedure the skill can run.","analogy":"One chapter of the manual."},{"term":"tool","aliases":["tools"],"meaning":"Something the model can ask the harness to do for it: read a file, run a command, search, call a service. The model asks; the harness executes.","analogy":"The hands the dispatcher does not have."},{"term":"tool call","meaning":"The model's structured request to run a tool, with arguments. It is only a request until the harness and the hooks let it through.","analogy":"A work order, not the work."},{"term":"MCP","aliases":["Model Context Protocol"],"meaning":"A standard way to plug external tools into a harness. Claude Code loads MCP servers from a config file; LifeOS keeps profiles of them.","analogy":"The standard socket that lets any appliance plug into the wall."},{"term":"MCP server","meaning":"A program that offers tools over MCP, for example a browser, a database or a scraping service.","analogy":"One appliance on the socket."},{"term":"subagent","aliases":["agent","agents"],"meaning":"A separate model session started by the main one to do a piece of work with its own context. It returns a result; it does not share the parent's memory.","analogy":"Sending a colleague to another building with a brief and waiting for the report."},{"term":"dispatch","meaning":"Starting a subagent with a brief. LifeOS announces each one and logs which model it ran on.","analogy":"Handing over the brief."},{"term":"permission","aliases":["permissions"],"meaning":"Claude Code's own gate on tool calls: allow, deny or ask, from settings.json. LifeOS advice is not authority; this is.","analogy":"The security desk that checks the work order before the door opens."},{"term":"TELOS","meaning":"The file of purpose: mission, goals with dates, problems, strategies, challenges. The standard every suggestion is judged against.","analogy":"The destination and the reason for the trip, written on the dashboard."},{"term":"ISA","aliases":["Ideal State Artifact"],"meaning":"A markdown file that writes down what \"done\" means for one piece of work as claims, each with the probe that would prove it false. It is both the plan and the test suite.","analogy":"A delivery manifest where every line says how you would prove the box arrived."},{"term":"ISC","aliases":["Ideal State Criterion"],"meaning":"One checkable line inside an ISA.","analogy":"One line on the manifest."},{"term":"claim","aliases":["claims"],"meaning":"A statement in an ISA that something is true when the work is done. It closes only on tool evidence.","analogy":"\"Box 7 delivered to the Kutaisi shop\" with the signature attached."},{"term":"falsifier","meaning":"The specific check that would show a claim is false. Every ISA claim names one.","analogy":"The question \"what would prove me wrong?\" written next to each promise."},{"term":"probe","meaning":"Running the falsifier: the command, test, screenshot or query that produces evidence.","analogy":"Actually opening the box and counting."},{"term":"evidence","meaning":"Tool output that supports a claim: a test result, a diff, a screenshot, a query result. \"Should work\" is not evidence.","analogy":"The signed delivery note, not the driver saying it went fine."},{"term":"Algorithm","aliases":["the Algorithm"],"meaning":"LifeOS's written loop for substantial work: articulate done as an ISA, climb toward it, close claims on evidence, leave a trail. Instructions the model follows, not a program.","analogy":"The site foreman's method: agree what finished looks like before the first brick."},{"term":"hill climbing","meaning":"Moving from the current state toward the ideal state one checked step at a time, using evidence to tell whether the step helped.","analogy":"Walking uphill in fog: each step, check the altimeter."},{"term":"ideal state","meaning":"What the work should look like when it is done, written the prose.","analogy":"The label on the front of a folder."},{"term":"markdown","meaning":"Plain text with light formatting marks (# headings, - lists). Almost every LifeOS file is markdown so humans and models can both read it.","analogy":"A typed memo, not a Word document."},{"term":"symlink","aliases":["symbolic link"],"meaning":"A file that points at another path. LifeOS points its USER and MEMORY folders out of the update-overwritable tree this way.","analogy":"A signpost that says \"the real thing is over there\"."},{"term":"zone","aliases":["zones"],"meaning":"LifeOS sorts every file into SYSTEM, USER, INTERFACE or RUNTIME by who owns it and what an update may do to it.","analogy":"Which rooms of the building the landlord may repaint."},{"term":"SYSTEM zone","aliases":["SYSTEM"],"meaning":"Files LifeOS ships and overwrites on update. Never edit them; wrap or override them from USER.","analogy":"The landlord's fittings."},{"term":"USER zone","aliases":["USER"],"meaning":"Your files: identity, TELOS, rules, customisations. Updates never touch them.","analogy":"Your furniture."},{"term":"INTERFACE zone","aliases":["INTERFACE"],"meaning":"Files both sides write, like settings.json and CLAUDE.md, merged by a script rather than overwritten.","analogy":"The shared hallway."},{"term":"RUNTIME zone","aliases":["RUNTIME"],"meaning":"Files produced while running: memory state, logs, transcripts. Regenerable, never shipped.","analogy":"The bins and the mail on the mat."},{"term":"installer","meaning":"The script that places LifeOS files into ~/.claude. LifeOS's is dry-run by default and never deletes.","analogy":"The removal crew that shows you the plan before lifting a box."},{"term":"dry run","meaning":"Running a tool so it reports what it would change without changing anything. LifeOS tools default to this; --apply does it for real.","analogy":"The rehearsal."},{"term":"overlay","meaning":"Copying shipped files over an existing install while skipping USER files and sy       if (/^>\s?/.test(l)) { const buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, '')); out.push(`<blockquote>${md(buf.join('\n'))}</blockquote>`); continue; }
      if (/^\s*[-*]\s/.test(l)) { const buf = []; while (i < lines.length && /^\s*[-*]\s/.test(lines[i])) buf.push(lines[i++].replace(/^\s*[-*]\s/, '')); out.push(`<ul>${buf.map(x => `<li>${inline(x)}</li>`).join('')}</ul>`); continue; }
      if (/^\s*\d+\.\s/.test(l)) { const buf = []; while (i < lines.length && /^\s*\d+\.\s/.test(lines[i])) buf.push(lines[i++].replace(/^\s*\d+\.\s/, '')); out.push(`<ol>${buf.map(x => `<li>${inline(x)}</li>`).join('')}</ol>`); continue; }
      if (!l.trim()) { i++; continue; }
      const buf = []; while (i < lines.length && lines[i].trim() && !/^(```|##|\||>|\s*[-*]\s|\s*\d+\.\s)/.test(lines[i])) buf.push(lines[i++]);
      out.push(`<p>${inline(buf.join(' '))}</p>`);
    }
    return out.join('\n');
  }

  const section = () => SECTIONS.find(s => s.id === state.part) || SECTIONS[0];
  const flat = steps => { const r = []; (steps || []).forEach(s => { r.push(s); (s.substeps || []).forEach(x => r.push(x)); }); return r; };
  const currentStep = sec => { const all = flat(sec.steps); const id = state.step[sec.id]; return all.find(s => s.id === id) || all[0]; };
  const BOX_ORDER = ['context', 'capability', 'control', 'memory', 'verification', 'none'];
  const COMP_ORDER = ['telos','context','cortex','conduit','synapse','feed','skills','tools','agents','arbol','hermes','hooks','security','boundary','learning','atlas','ledger','algorithm','isa','bunker','doctor','pulse','observability','voice','spinner'];
  const rank = c => { const i = COMP_ORDER.indexOf(c.id); return i < 0 ? 99 : i; };
  const orderedComps = sec => BOX_ORDER.flatMap(b => (sec.components || []).filter(c => c.box === b).sort((a, b2) => rank(a) - rank(b2)));
  const currentComp = sec => { const id = state.step[sec.id]; const list = orderedComps(sec); return list.find(c => c.id === id) || list[0]; };

  // ---------- viz: the engine, live ----------
  const VIZ = DATA.viz || null;
  const anim = { timer: null, playing: false, raf: null, speed: 1 };
  const stationById = Object.fromEntries((VIZ ? VIZ.stations : []).map(s => [s.id, s]));
  const center = s => [s.x + s.w / 2, s.y + s.h / 2];
  function edgePoint(a, b) {
    const [ax, ay] = center(a), [bx, by] = center(b); const dx = bx - ax, dy = by - ay;
    if (!dx && !dy) return [ax, ay];
    const sx = Math.abs(dx) > 1e-6 ? (a.w / 2) / Math.abs(dx) : Infinity, sy = Math.abs(dy) > 1e-6 ? (a.h / 2) / Math.abs(dy) : Infinity;
    const t = Math.min(sx, sy); return [ax + dx * t, ay + dy * t];
  }
  function frameFor(sec, cur) {
    if (!VIZ) return null;
    if (sec.kind === 'components') return { lit: VIZ.componentStation[cur.id] || [], hops: [], car: '', title: cur.name, note: 'Lit = where this part lives on the engine.' };
    if (sec.kind !== 'flow') return { lit: [], hops: [], car: 'This is the whole machine. Parts 1 and 2 run it one move at a time: press ▶ there.', title: 'The engine' };
    let f = VIZ.frames[cur.id];
    if (!f) { const parent = (sec.steps || []).find(s => (s.substeps || []).some(x => x.id === cur.id)); f = parent && VIZ.frames[parent.id] ? { lit: VIZ.frames[parent.id].lit, hops: [], car: VIZ.frames[parent.id].car } : { lit: [], hops: [], car: '' }; }
    return { ...f, title: cur.title };
  }
  function renderViz(sec, cur) {
    if (!VIZ) return '';
    const f = frameFor(sec, cur); const lit = new Set(f.lit); const hopSet = new Set((f.hops || []).map(h => h.join('>')));
    const wiresSvg = VIZ.wires.map(w => { const a = stationById[w.from], b = stationById[w.to]; if (!a || !b) return ''; const p1 = edgePoint(a, b), p2 = edgePoint(b, a); const on = hopSet.has(w.from + '>' + w.to); return `<line class="wire ${on ? 'on' : ''}" x1="${p1[0].toFixed(1)}" y1="${p1[1].toFixed(1)}" x2="${p2[0].toFixed(1)}" y2="${p2[1].toFixed(1)}" marker-end="url(#${on ? 'arron' : 'arr'})"/>`; }).join('');
    const stSvg = VIZ.stations.map(st => { const stripped = state.strip && st.who === 'lifeos'; return `<g class="station who-${st.who} ${lit.has(st.id) ? 'lit' : ''} ${stripped ? 'stripped' : ''}" data-station="${st.id}" transform="translate(${st.x},${st.y})"><rect rx="10" width="${st.w}" height="${st.h}"/><text class="sl" x="${st.w / 2}" y="${st.sub ? 22 : st.h / 2 + 5}">${esc(st.label)}</text>${st.sub ? `<foreignObject x="5" y="28" width="${st.w - 10}" height="${st.h - 31}"><div xmlns="http://www.w3.org/1999/xhtml" class="ss">${esc(st.sub)}</div></foreignObject>` : ''}</g>`; }).join('');
    const isFlow = sec.kind === 'flow';
    const list = isFlow ? flat(sec.steps) : null; const idx = list ? list.findIndex(x => x.id === cur.id) : -1;
    const who = isFlow ? WHO[cur.who] : null;
    const ctl = isFlow ? `<div class="viz-ctl"><button class="btn" data-viz="first" title="First move">⏮</button><button class="btn" data-viz="prev" title="Previous move (←)">◀</button><button class="btn play" data-viz="play" title="Play or pause (space)">${anim.playing ? '⏸ Pause' : '▶ Play'}</button><button class="btn" data-viz="next" title="Next move (→)">▶</button><button class="btn" data-viz="last" title="Last move">⏭</button><select id="vizspeed" title="Speed">${[['0.5', '½×'], ['1', '1×'], ['2', '2×']].map(([v, l]) => `<option value="${v}" ${Number(v) === anim.speed ? 'selected' : ''}>${l}</option>`).join('')}</select><span class="viz-pos">${idx + 1} / ${list.length}</span></div>` : '';
    return `<section class="viz panel" aria-label="The engine, live">
      <div class="viz-head"><div class="viz-title">🔧 The engine, live${isFlow ? ` · <span class="mono">${esc(cur.id)}</span>` : ''}</div>${ctl}</div>
      <div class="viz-svg"><svg viewBox="0 0 ${VIZ.canvas.w} ${VIZ.canvas.h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LifeOS engine diagram: stations light up as each move happens">
        <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3b4a66"/></marker><marker id="arron" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#38bdf8"/></marker><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
        <text class="rowlab" x="20" y="16">BEFORE YOUR FIRST WORD</text><text class="rowlab" x="20" y="152">ONE TURN</text><text class="rowlab" x="20" y="316">AFTER THE TOOL · AFTER THE REPLY</text>
        ${wiresSvg}${stSvg}<circle id="token" class="token" r="7" cx="-20" cy="-20"/></svg></div>
      <div class="viz-cap">${who ? `<span class="badge who-${cur.who}">${who.label}</span>` : ''}<b>${inline(f.title || '')}</b>${f.car ? `<div class="car">🚗 ${esc(f.car)}</div>` : ''}${f.note ? `<div class="who-explain">${esc(f.note)}</div>` : ''}${isFlow ? `<div class="who-explain">Lit = involved in this move · bright wire = where the prompt or data travels · <span class="kbd">space</span> plays, <span class="kbd">←</span> <span class="kbd">→</span> step</div>` : ''}</div>
    </section>`;
  }
  function animateHops(hops) {
    if (anim.raf) cancelAnimationFrame(anim.raf); anim.raf = null;
    const tok = document.getElementById('token'); if (!tok) return;
    if (!hops || !hops.length) { tok.setAttribute('cx', -20); tok.setAttribute('cy', -20); return; }
    let i = 0; const dur = 700 / anim.speed;
    const run = () => {
      const a = stationById[hops[i][0]], b = stationById[hops[i][1]]; if (!a || !b) return;
      const p1 = edgePoint(a, b), p2 = edgePoint(b, a); const t0 = performance.now();
      const step = now => { const t = Math.min(1, (now - t0) / dur); const e = t < .5 ? 2 * t * t : -1 + (4 - 2 * t) * t; tok.setAttribute('cx', (p1[0] + (p2[0] - p1[0]) * e).toFixed(1)); tok.setAttribute('cy', (p1[1] + (p2[1] - p1[1]) * e).toFixed(1)); if (t < 1) anim.raf = requestAnimationFrame(step); else if (++i < hops.length) anim.raf = requestAnimationFrame(run); };
      anim.raf = requestAnimationFrame(step);
    };
    run();
  }
  const playable = sec => flat(sec.steps).filter(x => !(state.strip && x.who === 'lifeos'));
  function vizGo(sec, where) {
    const list = playable(sec); if (!list.length) return; const cur = currentStep(sec); let i = list.findIndex(x => x.id === cur.id); if (i < 0) i = 0;
    const n = where === 'first' ? 0 : where === 'last' ? list.length - 1 : Math.min(list.length - 1, Math.max(0, i + (where === 'next' ? 1 : -1)));
    state.step[sec.id] = list[n].id; save(); render();
  }
  function vizPlay(sec) { anim.playing = !anim.playing; clearTimeout(anim.timer); if (anim.playing) tick(); render(); }
  function stopPlay() { anim.playing = false; clearTimeout(anim.timer); anim.timer = null; }
  function tick() {
    clearTimeout(anim.timer);
    anim.timer = setTimeout(() => { const sec = section(); if (sec.kind !== 'flow' || !anim.playing) return; const list = playable(sec); const cur = currentStep(sec); const i = list.findIndex(x => x.id === cur.id); if (i >= list.length - 1) { stopPlay(); render(); return; } vizGo(sec, 'next'); if (anim.playing) tick(); }, 2800 / anim.speed);
  }

  const isDone = sec => { const key = sec.id; const c = state.checks[key] || {}; const n = (sec.breakIt.length + sec.recall.length + sec.transfer.length); return Object.values(c).filter(Boolean).length >= n; };

  // ---------- render ----------
  function render() {
    const sec = section();
    const app = document.getElementById('app');
    const curX = sec.kind === 'flow' ? currentStep(sec) : sec.kind === 'components' ? currentComp(sec) : null;
    const vizHtml = (sec.kind === 'flow' || sec.kind === 'components' || sec.id === 'p0') && (curX || sec.id === 'p0') ? renderViz(sec, curX) : '';
    const tabs = SECTIONS.map(s => `<button class="tab ${s.id === sec.id ? 'on' : ''} ${isDone(s) ? 'done' : ''}" data-part="${s.id}"><span class="n">${s.number}</span>${esc(s.title)}</button>`).join('');
    const toggle = sec.toggle ? `<div class="toggle ${state.strip ? 'on' : ''}" id="strip" title="Grey out every LifeOS step and see the bare Claude Code path"><span class="sw"></span><span>Strip LifeOS</span></div>` : '';
    let body = '';
    if (sec.kind === 'flow') body = renderFlow(sec);
    else if (sec.kind === 'components') body = renderComponents(sec);
    else body = `<div class="orient">${md(sec.body)}</div>`;
    app.innerHTML = `
      <div class="top">
        <div class="brand">⚙️ Engine Room <small>· how a LifeOS-class agent works</small></div>
        <div class="tabs">${tabs}</div>
        <div class="spacer"></div>
        ${toggle}
        <button class="btn" id="gloss">📖 Glossary (${GLOSS.length})</button>
      </div>
      <div class="wrap">
        <div class="hero">
          <h1>Part ${sec.number} · ${esc(sec.title)}</h1>
          <p class="sub">${inline(sec.subtitle)}</p>
          <div class="legend">${Object.entries(WHO).map(([k, v]) => `<span class="badge who-${k}">${v.label}</span>`).join('')}<span class="badge mode-read">read</span><span class="badge mode-write">write</span><span class="badge mode-exec">runs</span></div>
        </div>
        ${sec.kind === 'flow' || sec.kind === 'components' ? `<div class="orient">${md(sec.body)}</div>` : ''}
        ${vizHtml}
        ${body}
        ${renderClosing(sec)}
        <div class="foot">Generated from your install on ${esc(INV.generatedAt.slice(0, 16).replace('T', ' '))} · ${INV.redaction} · ${INV.counts.files} files, ${INV.counts.hooksOnDisk} hooks on disk, ${INV.counts.registeredHookEntries} registrations (${INV.counts.duplicateHookEntries} duplicates) · built ${esc(DATA.builtAt.slice(0, 16).replace('T', ' '))}</div>
      </div>
      <div class="drawer ${state.glossary ? 'open' : ''}" id="drawer">${renderGlossary()}</div>`;
    bind(sec);
    if (vizHtml) { const f = frameFor(sec, curX || { id: 'p0', title: '' }); animateHops(f ? f.hops : []); }
    location.hash = sec.id + (state.step[sec.id] ? '/' + state.step[sec.id] : '');
  }

  function renderFlow(sec) {
    const all = flat(sec.steps);
    const cur = currentStep(sec);
    state.seen[cur.id] = true; save();
    const rail = (sec.steps || []).map(s => railItem(s, cur, false) + (s.substeps || []).map(x => railItem(x, cur, true)).join('')).join('');
    return `<div class="grid">
      <aside class="panel rail" aria-label="Steps"><h4>${all.length} steps${state.strip ? ' · LifeOS stripped' : ''}</h4>${rail}</aside>
      <main class="panel detail">${renderStep(cur, all)}</main>
      <aside class="panel files" aria-label="Files touched">${renderFiles(cur)}</aside>
    </div>`;
  }
  function railItem(s, cur, sub) {
    const stripped = state.strip && s.who === 'lifeos';
    return `<div class="rs ${sub ? 'sub' : ''} ${s.id === cur.id ? 'on' : ''} ${stripped ? 'stripped' : ''} ${state.seen[s.id] ? 'seen' : ''}" data-step="${s.id}"><span class="dot who-${s.who}"></span><span class="id">${s.id}</span><span class="t">${inline(s.title)}${s.hook ? `<small>${esc(s.hook.event)}${s.hook.matcher ? ' · ' + esc(s.hook.matcher) : ''}${s.hook.async ? ' · async' : ''}</small>` : ''}</span></div>`;
  }

  function fld(n, label, html) { return `<div class="field"><div class="lbl"><span class="k">${n}</span>${label}</div>${html}</div>`; }

  function renderNine(x, opts) {
    const stripped = state.strip && x.who === 'lifeos';
    const who = WHO[x.who];
    return [
      fld(1, 'Purpose', `<p>${inline(x.purpose)}</p>`),
      fld(2, 'Who does it', `<p><span class="badge who-${x.who}">${who.label}</span> <span class="who-explain">${who.text}</span></p>${x.without ? `<div class="without ${stripped ? '' : 'dim'}">${stripped ? '⛔ Stripped. ' : ''}${inline(x.without)}</div>` : ''}`),
      fld(3, 'How it is triggered', `<p>${inline(x.trigger)}</p>${x.hook ? `<div class="hookchip">event ${esc(x.hook.event)}${x.hook.matcher !== undefined ? ` · matcher "${esc(x.hook.matcher)}"` : ''} · ${x.hook.async ? 'async' : 'sync'}${x.hook.timeoutSec ? ` · timeout ${x.hook.timeoutSec}s` : ''}</div><p class="who-explain">${inline(x.hook.exitSemantics)}</p>` : ''}`),
      fld(4, 'Input → output', `<div class="io"><div><b>in</b><p>${inline(x.input)}</p></div><div><b>out</b><p>${inline(x.output)}</p></div></div>${(x.payloads || []).map(p => `<p class="who-explain" style="margin:8px 0 2px">${inline(p.label)}</p><pre><code>${esc(p.text)}</code></pre>`).join('')}`),
      fld(5, 'Files touched', x.files.length ? `<ul class="filelist">${x.files.map(f => `<li><span class="badge mode-${f.mode}">${f.mode === 'exec' ? 'runs' : f.mode}</span><span><code>${esc(f.path)}</code>${f.note ? `<small>${inline(f.note)}</small>` : ''}</span></li>`).join('')}</ul>` : '<p class="who-explain">none</p>'),
      fld(6, 'How it is implemented', `${md(x.how)}<p class="src who-explain">Sources: ${x.sources.map(s => `<code>${esc(s)}</code>`).join(' · ')}</p>`),
      fld(7, 'Alternatives', `<div class="cards">${x.alternatives.map(a => `<div class="card"><b>${inline(a.name)}</b>${inline(a.tradeoff)}</div>`).join('')}</div>`),
      fld(8, 'Why this way and not another', `<p>${inline(x.why)}</p>`),
      fld(9, 'The same move in another field', `<div class="cards">${x.examples.map(e => `<div class="card ex-${esc(e.field)}"><b>${esc(e.field)}</b>${inline(e.text)}</div>`).join('')}</div>`),
    ].join('');
  }

  function renderStep(s, all) {
    const idx = all.findIndex(x => x.id === s.id);
    const prev = all[idx - 1], next = all[idx + 1];
    const stripped = state.strip && s.who === 'lifeos';
    return `<div class="head"><span class="id">${s.id}</span><span class="badge who-${s.who}">${WHO[s.who].label}</span>${stripped ? '<span class="badge warn">vanishes without LifeOS</span>' : ''}</div>
      <h2 class="title">${inline(s.title)}</h2>
      ${s.watch ? `<div class="watch"><b>Watch it:</b> ${inline(s.watch)}</div>` : ''}
      ${renderNine(s)}
      <div class="navbtns"><button class="btn" data-step="${prev ? prev.id : ''}" ${prev ? '' : 'disabled'}>← ${prev ? esc(prev.id) : ''}</button><span class="who-explain"><span class="kbd">←</span> <span class="kbd">→</span> to move</span><button class="btn" data-step="${next ? next.id : ''}" ${next ? '' : 'disabled'}>${next ? esc(next.id) : ''} →</button></div>`;
  }

  function renderFiles(x) {
    const lit = new Map(); for (const f of x.files) if (!f.virtual) lit.set(f.path.replace(/^~\/\.claude\//, ''), f.mode);
    const rows = [...lit.entries()].map(([p, mode]) => { const t = INV.touched[p] || {}; return `<div class="f lit mode-${mode}"><span class="m">${mode === 'read' ? '→' : mode === 'write' ? '←' : mode === 'exec' ? '▶' : '↔'}</span><span>${esc(p)}</span><span class="z">${t.symlink ? '⤳ ' : ''}${esc(t.zone || '')}</span></div>`; }).join('');
    let hooks = '';

    }
