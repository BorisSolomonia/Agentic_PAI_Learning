<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LifeOS Engine Room</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Crect%20width%3D%2216%22%20height%3D%2216%22%20rx%3D%223%22%20fill%3D%22%230f172a%22%2F%3E%3Ccircle%20cx%3D%228%22%20cy%3D%228%22%20r%3D%224%22%20fill%3D%22%2338bdf8%22%2F%3E%3C%2Fsvg%3E">
<style>:root{
  --bg:#0b1220;--bg2:#111a2e;--bg3:#172238;--line:#24304a;--fg:#e6edf7;--fg2:#a9b6cc;--fg3:#7c8aa5;
  --blue:#4f8ff7;--green:#34c98a;--yellow:#f2c14e;--grey:#9aa4b8;--orange:#f08c4a;--red:#ef5d6b;--cyan:#38bdf8;
  --cc:#4f8ff7;--lo:#34c98a;--md:#f2c14e;--you:#c7cfdc;
  --radius:10px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans)}
a{color:var(--cyan)}
code,pre,kbd{font-family:var(--mono);font-size:.92em}
code{background:var(--bg3);padding:.05em .35em;border-radius:5px;border:1px solid var(--line)}
pre{background:#070c17;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;overflow:auto;white-space:pre;line-height:1.45;max-width:100%}
pre code{background:none;border:0;padding:0}
h1,h2,h3,h4{line-height:1.25;margin:1.2em 0 .5em}
h2{font-size:1.35rem;border-bottom:1px solid var(--line);padding-bottom:.3em}
h3{font-size:1.1rem;color:var(--fg)}
p{margin:.6em 0}
table{border-collapse:collapse;width:100%;margin:.8em 0;font-size:.95em}
th,td{border:1px solid var(--line);padding:6px 9px;vertical-align:top;text-align:left}
th{background:var(--bg3)}
blockquote{margin:.8em 0;padding:.6em 1em;border-left:3px solid var(--cyan);background:var(--bg2);border-radius:0 8px 8px 0;color:var(--fg2)}
ul,ol{padding-left:1.4em}
li{margin:.25em 0}
.table-wrap{overflow-x:auto}

/* layout */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg),rgba(11,18,32,.96));border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.brand small{color:var(--fg3);font-weight:400}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--bg2);color:var(--fg2);padding:6px 10px;border-radius:999px;cursor:pointer;font-size:.9em}
.tab.on{background:var(--bg3);color:var(--fg);border-color:var(--cyan)}
.tab .n{display:inline-block;min-width:1.3em;text-align:center;background:var(--bg);border-radius:999px;margin-right:6px;color:var(--fg3);font-size:.85em}
.tab.done .n{background:var(--green);color:#03140c}
.spacer{flex:1}
.toggle{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:5px 10px;cursor:pointer;font-size:.9em;user-select:none}
.toggle .sw{width:34px;height:18px;border-radius:999px;background:#33405c;position:relative;transition:.15s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}
.toggle.on .sw{background:var(--red)}
.toggle.on .sw::after{left:18px}
.btn{border:1px solid var(--line);background:var(--bg2);color:var(--fg);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:.9em}
.btn:hover{border-color:var(--cyan)}
.wrap{max-width:1500px;margin:0 auto;padding:14px 16px 60px}
.hero{padding:6px 0 10px}
.hero h1{margin:.2em 0 .1em;font-size:1.6rem}
.hero .sub{color:var(--fg2);max-width:900px}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 4px;font-size:.85em;color:var(--fg2)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:.82em;border:1px solid var(--line);background:var(--bg2);white-space:nowrap}
.badge.who-claude-code{border-color:var(--cc);color:var(--cc)}
.badge.who-lifeos{border-color:var(--lo);color:var(--lo)}
.badge.who-model{border-color:var(--md);color:var(--md)}
.badge.who-you{border-color:var(--you);color:var(--you)}
.badge.mode-read{color:var(--blue);border-color:var(--blue)}
.badge.mode-write{color:var(--orange);border-color:var(--orange)}
.badge.mode-exec{color:var(--green);border-color:var(--green)}
.badge.mode-read\+write{color:var(--orange);border-color:var(--orange)}
.badge.zone{color:var(--fg3)}
.badge.warn{color:var(--yellow);border-color:var(--yellow)}

.grid{display:grid;grid-template-columns:290px minmax(0,1fr) 320px;gap:14px;align-items:start}
@media (max-width:1100px){.grid{grid-template-columns:260px minmax(0,1fr)}.files{grid-column:1/-1;position:static;max-height:none}}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}.rail{position:static;max-height:none}.top{position:static}}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);min-width:0;max-width:100%}
.rail{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto;padding:8px}
.rail h4{margin:6px 8px;color:var(--fg3);font-size:.8em;text-transform:uppercase;letter-spacing:.6px}
.rs{display:flex;gap:8px;align-items:flex-start;padding:8px 9px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.rs:hover{background:var(--bg3)}
.rs.on{background:var(--bg3);border-color:var(--cyan)}
.rs .id{font-family:var(--mono);font-size:.8em;color:var(--fg3);min-width:2.6em;padding-top:2px}
.rs .t{flex:1}
.rs .t small{display:block;color:var(--fg3);font-size:.8em}
.rs .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.dot.who-claude-code{background:var(--cc)}.dot.who-lifeos{background:var(--lo)}.dot.who-model{background:var(--md)}.dot.who-you{background:var(--you)}
.rs.sub{margin-left:18px;padding:5px 9px;font-size:.92em}
.rs.stripped{opacity:.42;filter:grayscale(.7)}
.rs.stripped .t::after{content:" · vanishes";color:var(--red);font-size:.8em;opacity:1}
.rs.seen .id::after{content:" ✓";color:var(--green)}

.detail{padding:16px 20px;min-width:0}
.detail .field{min-width:0}
.field p,.card,.io > div{overflow-wrap:anywhere}
.detail .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.detail .head .id{font-family:var(--mono);color:var(--fg3)}
.detail h2.title{border:0;margin:.1em 0 .3em;font-size:1.4rem;padding:0}
.watch{background:#071a2a;border:1px solid #17405c;color:#bfe3ff;border-radius:8px;padding:8px 12px;margin:8px 0 14px;font-size:.95em}
.watch b{color:var(--cyan)}
.field{margin:14px 0}
.field .lbl{display:flex;align-items:center;gap:8px;color:var(--fg3);font-size:.78em;text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px}
.field .lbl .k{display:inline-block;width:1.6em;height:1.6em;border-radius:50%;background:var(--bg3);color:var(--fg2);text-align:center;line-height:1.6em;font-size:.95em;text-transform:none;letter-spacing:0}
.io{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:820px){.io{grid-template-columns:minmax(0,1fr)}}
.io > div{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.io b{color:var(--fg3);font-size:.8em;text-transform:uppercase;letter-spacing:.5px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:10px}
.card{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.card b{display:block;margin-bottom:3px}
.card.ex-distribution{border-color:#3b5f8c}
.without{border:1px solid var(--red);background:#2a0f14;color:#ffd9dd;border-radius:8px;padding:9px 12px;margin:8px 0}
.without.dim{border-color:#5b2e35;background:transparent;color:var(--fg2)}
.who-explain{color:var(--fg2);font-size:.92em}
.filelist{list-style:none;padding:0;margin:0}
.filelist li{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px dashed var(--line)}
.filelist li:last-child{border:0}
.filelist code{word-break:break-all}
.filelist small{color:var(--fg3);display:block}
.src a,.src code{word-break:break-all}
.hookchip{max-width:100%;overflow-wrap:anywhere;font-family:var(--mono);font-size:.82em;color:var(--fg2);background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:4px 8px;display:inline-block}

.files{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto;padding:12px}
.files h4{margin:4px 0 8px;color:var(--fg3);font-size:.8em;text-transform:uppercase;letter-spacing:.6px}
.tree{font-family:var(--mono);font-size:.82em;line-height:1.5}
.tree .f{display:flex;gap:6px;align-items:baseline;padding:2px 4px;border-radius:5px;opacity:.45;flex-wrap:wrap;word-break:break-all}
.tree .f.lit{opacity:1;background:var(--bg3)}
.tree .f .m{width:1.4em;text-align:center;flex:none}
.tree .f.mode-read .m{color:var(--blue)}.tree .f.mode-write .m,.tree .f.mode-read\+write .m{color:var(--orange)}.tree .f.mode-exec .m{color:var(--green)}
.tree .f .z{margin-left:auto;color:var(--fg3);font-size:.85em}
.hooklist{font-family:var(--mono);font-size:.8em}
.hooklist div{padding:2px 4px;border-radius:5px}
.hooklist .dup{color:var(--yellow)}
.hooklist .async{color:var(--fg3)}
.dirs{font-family:var(--mono);font-size:.78em;color:var(--fg2);columns:2;column-gap:14px}
.dirs div{break-inside:avoid;display:flex;justify-content:space-between;gap:6px}
details.more{margin-top:10px}
details.more summary{cursor:pointer;color:var(--fg3);font-size:.85em}

.closing{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.closing .panel{padding:12px 14px}
.closing h3{margin:.2em 0 .5em;display:flex;align-items:center;gap:8px}
.closing label{display:flex;gap:8px;align-items:flex-start;margin:.4em 0;cursor:pointer}
.closing input{margin-top:5px;flex:none}
.closing label.done{color:var(--fg3);text-decoration:line-through}

.term{border-bottom:1px dotted var(--cyan);cursor:help;color:var(--fg)}
.tip{position:fixed;z-index:50;max-width:340px;background:#0a1424;border:1px solid var(--cyan);border-radius:8px;padding:9px 12px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:.9em}
.tip b{color:var(--cyan)}
.tip .an{color:var(--fg2);font-style:italic;margin-top:4px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--bg2);border-left:1px solid var(--line);z-index:40;padding:14px;overflow:auto;transform:translateX(100%);transition:.2s}
.drawer.open{transform:none}
.drawer input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);margin:8px 0}
.drawer .g{padding:8px 0;border-bottom:1px solid var(--line)}
.drawer .g b{color:var(--cyan)}
.drawer .g .an{color:var(--fg3);font-style:italic}
.orient{max-width:980px}
.comp-box{margin:4px 8px 2px;color:var(--fg3);font-size:.78em;text-transform:uppercase;letter-spacing:.6px}
.status{font-size:.85em;color:var(--fg2)}
.status.partial{color:var(--yellow)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--bg3);color:var(--fg);padding:3px 9px;border-radius:999px;cursor:pointer;font-size:.85em}
.navbtns{display:flex;gap:8px;justify-content:space-between;margin-top:18px}
.empty{color:var(--fg3);padding:30px;text-align:center}
.kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:.85em;color:var(--fg2)}
.foot{color:var(--fg3);font-size:.8em;margin-top:30px;border-top:1px solid var(--line);padding-top:10px}

/* the engine, live */
.viz{margin:12px 0 14px;padding:10px 12px}
.viz-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.viz-title{font-weight:600;color:var(--fg2)}
.viz-title .mono{font-family:var(--mono);color:var(--cyan)}
.viz-ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.viz-ctl .btn{padding:4px 9px}
.viz-ctl .btn.play{border-color:var(--cyan);color:var(--cyan);min-width:88px}
.viz-ctl select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.viz-pos{color:var(--fg3);font-family:var(--mono);font-size:.85em}
.viz-svg{overflow-x:auto;margin-top:8px;border-radius:8px;background:#0a1120;border:1px solid var(--line)}
.viz-svg svg{width:100%;min-width:760px;height:auto;display:block}
.rowlab{fill:#5c6b88;font-size:11px;letter-spacing:1.2px;font-family:var(--mono)}
.wire{stroke:#34435f;stroke-width:1.6;opacity:.75}
.wire.on{stroke:#38bdf8;stroke-width:3;opacity:1}
.station rect{fill:#141d33;stroke:#33405c;stroke-width:1.5;transition:fill .2s,stroke-width .2s}
.station.who-claude-code rect{stroke:var(--cc)}.station.who-lifeos rect{stroke:var(--lo)}.station.who-model rect{stroke:var(--md);fill:#1c180c}.station.who-you rect{stroke:var(--you)}
.station .sl{fill:#e6edf7;font-size:13px;font-weight:600;text-anchor:middle;font-family:var(--sans)}
.station .ss{color:#8593ad;font-size:10px;line-height:1.25;text-align:center;font-family:var(--sans);overflow:hidden}
.station.lit rect{filter:url(#glow);stroke-width:3}
.station.who-lifeos.lit rect{fill:#0f2f24}.station.who-claude-code.lit rect{fill:#10254a}.station.who-model.lit rect{fill:#3d3008}.station.who-you.lit rect{fill:#2a2f3a}
.station.lit .ss{color:#c7d2e6}
.station.stripped{opacity:.22}
.station.stripped rect{stroke-dasharray:4 4}
.token{fill:#38bdf8;filter:url(#glow)}
.viz-cap{margin-top:8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.viz-cap .car{width:100%;color:#ffd58a;background:#221a08;border:1px solid #4a3a12;border-radius:8px;padding:6px 10px}
</style>
</head>

<script id="data" type="application/json">{"sections":[{"id":"p0","number":0,"title":"The three layers","subtitle":"What a model is, what Claude Code adds, what LifeOS adds on top — and the colour code used on every page after this one.","kind":"orient","body":"\n## Start here: what a model actually is\n\nA [[model]] is a function. Text goes in, text comes out. That is the whole thing. It has:\n\n- **no memory** — when the reply is finished, it has forgotten the conversation\n- **no filesystem** — it cannot open, read or save a file\n- **no hands** — it cannot run a command, click a button or send a message\n- **no clock** — it does not know what day it is unless someone tells it\n\nEverything that *looks* like memory, action or awareness in an AI assistant is done by a program **around** the model. That program hands the model a pile of text, reads the text it produces, and acts on it. If you remember one sentence from this whole app, make it this one: **the model never does anything; the harness does everything, and the model only decides.**\n\n> **In a warehouse:** the model is the dispatcher sitting in a windowless office with a radio. The dispatcher decides what to do next but cannot see the shelves, cannot lift a box, and forgets yesterday's shifts unless someone leaves a note on the desk. The warehouse — forklifts, scanners, the note on the desk — is the harness.\n\n## The three layers\n\n| Layer | What it is | It **can** | It **cannot** |\n|---|---|---|---|\n| 🟨 **Model** | Claude, the language model | reason, plan, write text, decide which tool to ask for | remember, read a file, run anything, act without being asked |\n| 🟦 **Claude Code** | Anthropic's terminal program that runs the model in a loop | read and write files, run commands, call tools, load context files, fire [[hook]]s at fixed moments, ask you for permission | know who you are, know what you want, keep any rule you didn't write down, verify its own claims |\n| 🟩 **LifeOS** | Daniel Miessler's set of files and scripts placed *inside* Claude Code's folders | tell the model who you are and what you want, add capabilities, block dangerous actions, remember across sessions, refuse to call work \"done\" without evidence | run without Claude Code — it is a passenger, not a vehicle |\n\nThe important shape: **LifeOS is not a program you run.** It is a set of markdown files, TypeScript scripts and one JSON settings file that Claude Code *finds* in its own folders and *uses* according to its own rules. Delete every LifeOS file and Claude Code still works; it just knows nothing about you and stops you from nothing.\n\n> **In a kitchen:** the model is the head chef's brain. Claude Code is the kitchen — stoves, knives, the pass, the rule that every plate goes through the pass. LifeOS is the restaurant's *own* recipe book, allergy list, and the sign on the wall saying \"no dish leaves without the ticket checked\". The kitchen would work without the book; it just wouldn't be *this* restaurant.\n\n## The colour code\n\nEvery step on every page carries one of four tags. When a page asks \"is this a LifeOS step or not?\", this is the answer:\n\n- 🟦 **Claude Code** — happens with or without LifeOS. Remove every LifeOS file and this still runs.\n- 🟩 **LifeOS** — a LifeOS file or script did this. Remove LifeOS and it vanishes. On Parts 1 and 2 there is a switch, **Strip LifeOS**, that greys these out so you can see the bare path underneath.\n- 🟨 **Model** — the model's own reasoning. Nobody wrote code for this; it is what the model decided.\n- ⬜ **You** — a human did something.\n\n## The five boxes: how any agent loops\n\nStrip the names off and every AI agent — LifeOS, a customer-service bot, a coding assistant — is the same loop. Five boxes. Learn them once and you can place any product's features in ninety seconds.\n\n```\n  you type\n     │\n     ▼\n ┌───────────────────┐   1 · CONTEXT  — assembled before the model sees a single word\n │ context assembled │ ◄── context files (CLAUDE.md, @-imports)\n └────────┬──────────┘ ◄── memory recalled from earlier sessions\n          │            ◄── hooks that inject text at prompt time\n          ▼\n ┌───────────────────┐   2 · CAPABILITY — what it can reach for\n │  model decides    │ ◄── skills (instructions loaded on demand)\n └────────┬──────────┘ ◄── tools and MCP servers (things that actually run)\n          │\n          ▼\n ┌───────────────────┐   3 · CONTROL — fires whether or not the model wanted it\n │  tool executes    │ ◄── hooks (can BLOCK by exiting with code 2)\n └────────┬──────────┘\n          │\n          ▼\n ┌───────────────────┐   5 · VERIFICATION — is it actually done?\n │  observe result   │ ──► evidence gates, tests, probes\n └────────┬──────────┘\n          ├── not done ──► back to the top\n          ▼  turn ends\n ┌───────────────────┐   4 · MEMORY — what survives to next time\n │   write memory    │ ──► files that box 1 will read tomorrow\n └───────────────────┘\n```\n\n**Memory is a slow wire back into context.** Writing a memory is pointless unless something reads it at the top of the next loop. Half of all broken memory systems are broken on the *read* side.\n\n**Control is the only box with teeth.** Boxes 1, 2 and 4 are *suggestions* the model can weigh and lose. A hook is code; it runs whether the model likes it or not.\n\n**Verification decides when the loop stops.** Without it, the loop stops when the model *feels* finished — the single most expensive failure in this whole field.\n\n**Capability is where everyone starts and what matters least on its own.** A brilliant skill fed bad context produces confident nonsense.\n\n## The design space, box by box\n\nYou are not learning *the* way to build an agent. You are learning one defensible route through a space of choices. Here is the space:\n\n| Box | Ways people build it | What LifeOS chose | What that choice costs |\n|---|---|---|---|\n| 1 Context | (a) always-loaded files · (b) loaded on demand · (c) retrieved by search | (a) for identity, (b) for docs, (c) for memory | (a) costs tokens on every session forever, so it must stay small |\n| 2 Capability | (a) plain prompt · (b) markdown skill · (c) skill + real script · (d) MCP server · (e) subagent | (b) and (c) heavily, (d) sparingly, (e) for parallel work | markdown skills are trivial to write and impossible to unit-test |\n| 3 Control | (a) ask nicely · (b) system prompt · (c) hooks that inject · (d) hooks that block | all four, layered by how non-negotiable the rule is | 68 hooks run on every event; a slow hook makes every turn slow |\n| 4 Memory | (a) append-only log · (b) curated markdown · (c) vector database · (d) typed graph | (b) hot files + (d) a knowledge archive | curation costs a review pass at the end of sessions |\n| 5 Verification | (a) the model says \"done\" · (b) deterministic check · (c) second model reviews · (d) evidence required per claim | (d), enforced by (b) | slowest option, and the only honest one |\n\n## Where LifeOS's 25 parts sit\n\nPart 3 of this app walks through all 25 components. Here is the map you'll use to place them:\n\n| Box | LifeOS components |\n|---|---|\n| 1 Context | TELOS · Context & configuration · Cortex (the read side) · Conduit · Synapse |\n| 2 Capability | Skills · Tools & integrations · Subagents · Arbol · Hermes |\n| 3 Control | Hooks · Security · System/User boundary |\n| 4 Memory | Cortex (the write side) · Learning & memory review · Atlas · Ledger |\n| 5 Verification | The Algorithm · ISA · Bunker · Doctor |\n| none (output only) | Pulse · Observability · Voice · Spinner & tooltips |\n\nNotice that Cortex sits in two boxes. That is not sloppiness; it is the whole design. A memory system *is* a write box wired to a read box, and any product that only has one of the two is broken.\n\n## Why this architecture and not another\n\nTwo other shapes were possible, and both exist in the wild:\n\n- **A wrapper app.** Build your own program that calls the model's API directly, with your own loop, your own tools, your own UI. Full control, and you rebuild everything Claude Code already ships: permissions, file tools, the terminal, the transcript. LifeOS rejected this because Anthropic improves Claude Code weekly and a wrapper would fall behind every week.\n- **A single big prompt.** Put identity, rules, memory and instructions into one enormous system prompt. Simple, and it fails at exactly the three things LifeOS cares about most: nothing is enforced (it's all suggestion), nothing survives an update (one file, overwritten), and nothing is verifiable (the prompt can't check its own claims).\n\nLifeOS picked the third shape: **live inside the harness's own extension points and add teeth where the harness has none.** The cost is that it is a passenger — every LifeOS feature is bounded by what Claude Code allows a hook or a context file to do. The benefit is that it rides every harness upgrade for free.\n","breakIt":["In a scratch folder with no `CLAUDE.md`, run `claude -p \"who am I?\"`. Then run the same inside `~/.claude`. Write down, before you run either, which will know you and why.","Predict: if every LifeOS hook were deleted but the context files kept, what would still work? Then check Part 2 with the Strip-LifeOS switch off and count what survives.","Which box, removed, makes the other four useless? Decide, then argue with your answer using the kitchen example."],"recall":["Close this page. Redraw the five-box loop on paper with the arrows.","Say the three layers and one thing each *cannot* do.","What is the difference between a skill and a hook? If your answer is not \"a skill is offered, a hook just happens\", read the Control row again."],"transfer":["Take Optimo, your Wolt sync middleware. Write its five boxes: what it knows at start-up, what it can do, what fires on a schedule regardless, what it persists, how it decides a sync succeeded. This map is not about AI.","Take a delivery van driver at 9T. Same five boxes: the route sheet is context, the van is capability, the speed limiter is control, the signed delivery note is memory, the customer's signature is verification."]},{"id":"p1","number":1,"title":"Session start","subtitle":"The eight moves from typing `lifeos` to the prompt box, every file they touch, and the one fact they share: no model is involved.","kind":"flow","toggle":true,"body":"\nThis part answers your question exactly as you asked it: *LifeOS is loaded in the terminal; what parts are involved, what files are activated, how, and why?*\n\nEight moves. Each one has the same nine fields. The file tree on the right lights up the files each move reads (blue), writes (orange) or runs (green). Flip **Strip LifeOS** at the top to grey out the 🟩 moves and see what plain `claude` does on its own: five of the eight survive, and three vanish.\n\nEverything on this page was verified against **your** machine, not the public repository: the alias on line 132 of your `.bashrc`, the launcher, your `settings.json`, and the fire order in the hooks README. Where your machine differs from the shipped design, the page says so (see the duplicate registrations in S5).\n","steps":[{"id":"S1","title":"You type `lifeos`","who":"you","purpose":"Start a session that knows you, instead of a blank one. The word `lifeos` is a shortcut; what it expands to is the first LifeOS decision you meet.","trigger":"You press Enter in a terminal. Bash looks the word up in its [[alias]] table before it looks for a program.","input":"Five characters on a command line.","output":"Bash replaces them with the full command stored in the alias and runs that instead.","files":[{"path":"~/.bashrc","mode":"read","note":"line 132 holds the alias; bash reads this file once when the terminal opens"}],"how":"An alias is a one-line substitution. On this machine the line reads:\n\n`alias lifeos='bun ~/.claude/LIFEOS/TOOLS/lifeos.ts -s ~/.claude/LIFEOS/LIFEOS_SYSTEM_PROMPT.md'`\n\nSo typing `lifeos` is exactly the same as typing that whole command. Nothing about LifeOS has run yet; this is the shell doing text replacement. The `-s` flag hands the [[launcher]] the path of the file that will become the constitution in S2.","sources":["~/.bashrc","LIFEOS/TOOLS/lifeos.ts:L1-L22"],"alternatives":[{"name":"Type the full command every time","tradeoff":"Nothing to install, nothing to forget. You will mistype it by day three, and nobody else on the machine discovers it."},{"name":"A wrapper script on the PATH","tradeoff":"Works from any shell, survives a new terminal type, can be versioned. One more file to install, and the installer has to know where your PATH is."},{"name":"Replace `claude` itself","tradeoff":"Every session gets LifeOS whether you want it or not. Breaks the moment you need a plain session to debug LifeOS, which is exactly when you need one."}],"why":"LifeOS keeps plain `claude` and adds `lifeos` beside it. That is the cheapest possible install, it is one line to remove, and it leaves you a clean session for comparison. Part 2 of the chapter book uses that comparison as a test. The cost is that the alias lives in a dot-file the installer has to edit, and a new shell (zsh, fish) needs its own line.","examples":[{"field":"distribution","text":"A sales rep does not dial the warehouse's eleven-digit number; a speed-dial key labelled \"WH\" does it. The key is not the warehouse and it is not the call. It is the substitution that makes the right call the easy one."},{"field":"hospital","text":"A ward has a \"code blue\" button. Pressing it is one action that expands into a whole procedure: page the team, unlock the crash cart, start the clock. The button holds no medicine; it holds the expansion."}],"watch":"The shell swaps five letters for a sixty-character command. No LifeOS code has run."},{"id":"S2","title":"The launcher builds the real command","who":"lifeos","purpose":"Start Claude Code with the constitution attached, in the right folder, with the right billing, and tell the house that a session began. Claude Code has no flag that does all of this; the launcher is where LifeOS decides how a session is born.","trigger":"The alias from S1 runs `bun LIFEOS/TOOLS/lifeos.ts`. The script's `cmdLaunch()` function runs when no sub-command (`update`, `version`, `mcp`) was given.","input":"The `-s` path from the alias; optional flags (`-m` for an [[MCP]] profile, `--resume`, `--local`); the current environment variables.","output":"A child process: `claude --append-system-prompt-file ~/.claude/LIFEOS/LIFEOS_SYSTEM_PROMPT.md` running inside `~/.claude`, with `ANTHROPIC_API_KEY` removed from its environment and `CLAUDE_CODE_WORKFLOWS=1` added.","files":[{"path":"LIFEOS/TOOLS/lifeos.ts","mode":"exec","note":"the launcher itself; cmdLaunch() is the function that runs here"},{"path":"LIFEOS/TOOLS/Banner.ts","mode":"exec","note":"prints the neofetch-style banner before Claude starts"},{"path":"LIFEOS/VERSION","mode":"read","note":"the banner shows the LifeOS version from here"},{"path":"LIFEOS/LIFEOS_SYSTEM_PROMPT.md","mode":"read","note":"existence is checked here; Claude Code reads the contents in S3"}],"how":"`cmdLaunch()` in `LIFEOS/TOOLS/lifeos.ts` does seven small things in order:\n\n1. **Checks that `claude` exists** by running `claude --version`. No Claude Code, no session; it stops with a clear error.\n2. **Prints the banner** by running `LIFEOS/TOOLS/Banner.ts`, which reads `LIFEOS/VERSION` and picks a layout for your terminal width.\n3. **Builds the argument list.** It starts with `claude` and, if the system-prompt file exists, appends `--append-system-prompt-file <path>`. This one flag is the whole difference between `claude` and `lifeos`: it tells Claude Code to read that markdown file and add it to its own [[system prompt]].\n4. **Handles an MCP profile** if you passed `-m`: it points the `.mcp.json` [[symlink]] at the chosen profile so Claude Code loads those [[MCP server]]s. On this machine there is no `.mcp.json` right now, so no MCP servers load at start.\n5. **Changes directory to `~/.claude`** (unless `--local`). This matters more than it looks: Claude Code finds `CLAUDE.md` relative to where it starts, so this is what makes S4 find the right file.\n6. **Sends a voice line** to [[Pulse]] on port 31337 (`/notify/personality`) with the startup catchphrase. It is fire-and-forget: if Pulse is down, nothing waits and nothing breaks.\n7. **Strips `ANTHROPIC_API_KEY`** from the environment so the session bills to your subscription, not to an API key, then spawns `claude` with the built arguments and waits for it to exit.","sources":["LIFEOS/TOOLS/lifeos.ts:L490-L575","LIFEOS/TOOLS/Banner.ts:L1-L12"],"alternatives":[{"name":"Put the flag in the alias directly","tradeoff":"Simpler: `alias lifeos='claude --append-system-prompt-file …'`. You lose the banner, the MCP profiles, the billing guard and the voice line, and every extra behaviour becomes another alias."},{"name":"A Claude Code plugin or settings key","tradeoff":"Claude Code has no settings key that appends a system-prompt file; it is a launch flag only. So this alternative does not exist today, which is itself a lesson: the harness decides which extension points you get."},{"name":"A shell script instead of a TypeScript program","tradeoff":"Fewer dependencies (no [[bun]]). Harder to test, harder to grow; the MCP profile logic and the git-worktree guard would be painful in bash."}],"why":"LifeOS wants one command that produces a fully-formed session, and it wants to add behaviour to that command over time without touching the alias again. A small program is the only shape that gives both. The cost is a hard dependency on `bun` before Claude even starts, and a launcher that must track Claude Code's flags as they change.","examples":[{"field":"distribution","text":"Before a delivery van leaves, a dispatcher runs the pre-trip: check the driver has a licence, load the route sheet, set the fuel card to the company account not the driver's, and radio the depot that van 7 is out. None of that is driving. All of it decides what kind of trip it will be."},{"field":"airport","text":"A pilot does not just start the engines. The pre-flight checklist loads the flight plan into the computer, confirms the aircraft is airworthy, and tells the tower the flight exists. The launcher is that checklist, and the appended system prompt is the flight plan."}],"payloads":[{"label":"the process that gets spawned (argv)","text":"[\"claude\", \"--append-system-prompt-file\", \"/home/<you>/.claude/LIFEOS/LIFEOS_SYSTEM_PROMPT.md\"]\n// cwd: /home/<you>/.claude\n// env: ANTHROPIC_API_KEY removed · CLAUDE_CODE_WORKFLOWS=1 added"},{"label":"voice notification (POST to Pulse, ignored if Pulse is down)","text":"POST http://localhost:31337/notify/personality\n{\"message\": \"[🎯 focused] <startup catchphrase from settings.json>\"}"}],"without":"Without this: you would type `claude`. No banner, no appended constitution, no billing guard, no voice line; Claude Code starts with only its own defaults, in whatever folder you happen to be in.","watch":"Banner prints. A child `claude` process starts with one extra flag. Still no model involved."},{"id":"S3","title":"Claude Code reads its settings","who":"claude-code","purpose":"Claude Code needs to know which model to use, which programs to run at which moments, what to allow without asking, and what to show in the status bar. All of that lives in one JSON file it reads before anything else.","trigger":"Process start. Claude Code always reads `~/.claude/settings.json` (plus any project-level settings) as its first act; there is no way to skip it.","input":"`settings.json`: 33 top-level keys on this machine. The ones that matter for the next five moves are `model`, `hooks`, `statusLine`, `permissions` and `env`.","output":"An in-memory configuration: the model pin (`claude-fable-5-1[1m]`), 90 hook registrations across 11 events, the status-line command, the permission mode (`auto`), and six environment variables including `PAI_DIR`.","files":[{"path":"settings.json","mode":"read","note":"the INTERFACE-zone file: LifeOS writes it (S5 merges into it), Claude Code reads it"},{"path":"LIFEOS/LIFEOS_SYSTEM_PROMPT.md","mode":"read","note":"read now because of the --append-system-prompt-file flag from S2"}],"how":"This is a [[Claude Code]] move, and it would happen with an empty `settings.json` too. What makes it a LifeOS moment is *what is in the file*: LifeOS wrote almost all of it.\n\n- **`model`** pins the session to a model alias. LifeOS's rule is that the main session always runs on the top rung; a [[hook]] in S5 later checks the pin against reality.\n- **`hooks`** is a map from [[lifecycle event]] name to a list of commands. Claude Code will run these commands at those moments; it does not know or care that they are LifeOS scripts. This map is how every 🟩 step in Part 2 gets its chance to run.\n- **`statusLine.command`** names the script that draws the bottom bar (S7). On this machine it points into the USER zone, at a wrapper you wrote.\n- **`permissions`** holds allow / deny / ask lists and `defaultMode: auto`. Advice from LifeOS is not authority; this block is the authority.\n- **`env`** sets variables every hook will see, including `PAI_DIR=~/.claude`, which is why some hook commands are written as `${PAI_DIR}/hooks/…`.\n\nAt the same moment, because of the flag from S2, Claude Code reads `LIFEOS_SYSTEM_PROMPT.md` and appends its text to its own system prompt. That text is now above the conversation, at instruction level, before any file in S4 is read.","sources":["settings.json","LIFEOS/DOCUMENTATION/Config/ConfigSystem.md","hooks/README.md:L476-L526"],"alternatives":[{"name":"Configuration in environment variables only","tradeoff":"Nothing to parse and easy to override per shell. Impossible to express a list of hooks per event, and invisible to a newcomer who cannot run `env`."},{"name":"Configuration in code (a TypeScript file)","tradeoff":"Type-checked and can compute values. The harness would have to execute your code just to learn its own settings, which is a security hole and a chicken-and-egg problem."},{"name":"Many small files, one per concern","tradeoff":"Each piece is readable on its own. The harness has to glob and merge them, and \"which file wins\" becomes a support question."}],"why":"Claude Code chose one JSON file and LifeOS has no say in that. What LifeOS chose is to treat the file as an INTERFACE: shipped defaults in a system file, your overrides in a user file, merged into `settings.json` by a script at S5. That way an update can change the defaults without deleting your overrides. Two honest notes about this machine: neither input file (`settings.system.json`, `USER/CONFIG/settings.user.json`) exists here any more, so the merge at S5 runs and does nothing and `settings.json` is effectively hand-maintained; and the nine hooks registered twice are leftovers of the migration that produced this file, which a merge that only ever adds could never have cleaned up.","examples":[{"field":"distribution","text":"The warehouse management system loads its configuration at start: which printer prints pick lists, which scanner beeps on a short pick, which users may approve a credit note. The config is not the warehouse; it decides how the warehouse behaves today."},{"field":"orchestra","text":"Before the first note, every player reads the same seating plan and the same programme. The conductor did not write the hall's rules about where the brass sit, but the programme for tonight is his."}],"payloads":[{"label":"settings.json, the five keys that matter (abbreviated, values are real shapes)","text":"{\n  \"model\": \"claude-fable-5-1[1m]\",\n  \"permissions\": { \"defaultMode\": \"auto\", \"allow\": [ …16 rules… ], \"deny\": [], \"ask\": [ … ] },\n  \"env\": { \"PAI_DIR\": \"/home/<you>/.claude\", \"PROJECTS_DIR\": \"…\", \"BASH_DEFAULT_TIMEOUT_MS\": \"…\", … },\n  \"statusLine\": { \"type\": \"command\", \"command\": \"$HOME/.config/LIFEOS/USER/CUSTOMIZATIONS/statusline.sh\", \"refreshInterval\": 5 },\n  \"hooks\": {\n    \"SessionStart\":     [ { \"matcher\": \"\", \"hooks\": [ { \"type\": \"command\", \"command\": \"…/hooks/LoadContext.hook.ts\" }, … ] } ],\n    \"UserPromptSubmit\": [ … 10 entries … ],\n    \"PreToolUse\":       [ { \"matcher\": \"Bash|Write|Edit|MultiEdit\", \"hooks\": [ { \"command\": \"…/hooks/PreToolGuard.hook.ts\" } ] }, … ],\n    \"PostToolUse\":      [ … 32 entries … ],\n    \"Stop\":             [ … 11 entries … ],\n    \"SessionEnd\":       [ … 10 entries … ]\n  }\n}"}],"watch":"One JSON file becomes the session's wiring diagram. The constitution file is read and appended above everything."},{"id":"S4","title":"Claude Code reads `CLAUDE.md` and follows its six imports","who":"claude-code","purpose":"Give the model standing knowledge about this folder before you type. Claude Code provides the mechanism; LifeOS decides what the file says and which six files it pulls in.","trigger":"Claude Code looks for `CLAUDE.md` in the current directory (which S2 set to `~/.claude`) and in its parents, and for each line beginning with `@` it reads the named file too. This happens once, at start; edits to these files during a session are not seen until the next one.","input":"`CLAUDE.md` (a routing table, about a hundred lines) and the six files it names.","output":"Seven markdown files, concatenated, placed into the conversation as the first user-level message. The model has not seen them yet; they are staged.","files":[{"path":"CLAUDE.md","mode":"read","note":"the routing table; mostly pointers, almost no rules"},{"path":"LIFEOS/DOCUMENTATION/ARCHITECTURE_SUMMARY.md","mode":"read","note":"import 1: what the system is, one screen"},{"path":"LIFEOS/USER/TELOS/PRINCIPAL_TELOS.md","mode":"read","note":"import 2: your goals, auto-generated from TELOS.md"},{"path":"LIFEOS/USER/PRINCIPAL/PRINCIPAL_IDENTITY.md","mode":"read","note":"import 3: who you are"},{"path":"LIFEOS/USER/DIGITAL_ASSISTANT/DA_IDENTITY.md","mode":"read","note":"import 4: who the assistant is"},{"path":"LIFEOS/USER/PROJECTS.md","mode":"read","note":"import 5: your eight projects and the aliases you use for them"},{"path":"LIFEOS/USER/CONFIG/OPERATIONAL_RULES.md","mode":"read","note":"import 6: your standing rules"}],"how":"The [[@-import]] line is the entire mechanism: a line that starts with `@` followed by a path. Claude Code reads that file and adds it. It does **not** follow imports inside imported files, which is why all six are listed at the top level of `CLAUDE.md` and not chained.\n\nFour of the six imports live in `LIFEOS/USER/`. On this machine that folder is a [[symlink]] to `~/.config/LIFEOS/USER`, outside the tree that updates overwrite. So the files that make the system *yours* are physically somewhere an update cannot reach, while the file that names them (`CLAUDE.md`) is shipped and replaceable. That split is Part 4's whole subject.\n\nNotice the cost: every one of these files is loaded on **every** session, whether or not you use it. That is why `CLAUDE.md` is a table of pointers and the big documents are *named* here but not imported; the model loads those on demand.","sources":["CLAUDE.md","LIFEOS/DOCUMENTATION/Config/ConfigSystem.md","LIFEOS/DOCUMENTATION/SystemUserBoundary.md"],"alternatives":[{"name":"One big CLAUDE.md with everything inline","tradeoff":"No imports to break. One file that identity, projects and rules all fight over, overwritten as a whole by any update."},{"name":"Inject everything from a hook instead of imports","tradeoff":"Full control over what loads when. Slower, invisible to `/context`, and the file is no longer a thing you can open and read."},{"name":"Retrieve context by search each turn","tradeoff":"Scales to thousands of facts. Might not retrieve the one that mattered, and identity is precisely the fact you never want missed."}],"why":"Identity, projects and rules change on different clocks and are owned by different people (you, versus the LifeOS author). Six small files with one owner each, wired by a shipped table, is the shape that lets updates and your edits coexist. It costs tokens on every session, which is why LifeOS fights to keep these files short.","examples":[{"field":"distribution","text":"A new sales rep's first-day pack: one cover sheet that points at the price list, the customer list, the credit rules and the route map, each kept by the person who owns it. The cover sheet is reprinted every month; the price list is only reprinted when prices change."},{"field":"school","text":"A substitute teacher gets a one-page note on the desk: where the register is, which two pupils need the front row, what the class was doing yesterday. The note is short so it gets read; the full curriculum stays on the shelf."}],"payloads":[{"label":"the six lines that do the work (from CLAUDE.md)","text":"@LIFEOS/DOCUMENTATION/ARCHITECTURE_SUMMARY.md\n@LIFEOS/USER/TELOS/PRINCIPAL_TELOS.md\n@LIFEOS/USER/PRINCIPAL/PRINCIPAL_IDENTITY.md\n@LIFEOS/USER/DIGITAL_ASSISTANT/DA_IDENTITY.md\n@LIFEOS/USER/PROJECTS.md\n@LIFEOS/USER/CONFIG/OPERATIONAL_RULES.md"}],"watch":"Seven files are read and staged. Four of them come from outside the update-overwritable tree."},{"id":"S5","title":"The `SessionStart` event fires five LifeOS hooks","who":"lifeos","purpose":"Do the things a fresh session needs that no static file can do: repair hooks that lost their execute bit, remember the terminal so later hooks can control it, inject what happened in *previous* sessions, warm the status-bar cache, and merge the shipped settings with your overrides.","trigger":"Claude Code raises the `SessionStart` [[lifecycle event]] and runs every command registered under `hooks.SessionStart` in `settings.json`, in order. Each command gets one JSON object on [[stdin]]. Sync hooks run one after another and Claude Code waits; async hooks are started and forgotten.","input":"One JSON object per hook on stdin: `session_id`, `transcript_path`, `cwd`, `hook_event_name: \"SessionStart\"`, `source` (`startup`, `resume`, `clear` or `compact`).","output":"Whatever each hook prints on [[stdout]] is added to the conversation as context. `LoadContext` prints a `<system-reminder>` block; the others print a line or nothing. Side effects on disk: a heartbeat file, the freshness cache, a merged `settings.json`.","files":[{"path":"hooks/HookHealer.hook.ts","mode":"exec","note":"registered as \"bun <path>\" so it can never lose its own exec bit"},{"path":"hooks/KittyEnvPersist.hook.ts","mode":"exec","note":"saves KITTY_LISTEN_ON / KITTY_WINDOW_ID so Stop hooks can colour the tab later"},{"path":"hooks/LoadContext.hook.ts","mode":"exec","note":"the one that prints context: active work, advisory findings, learning readback"},{"path":"LIFEOS/MEMORY/","mode":"read","note":"LoadContext reads MEMORY/WORK (recent sessions) and MEMORY/STATE (progress, advisory findings)"},{"path":"LIFEOS/TOOLS/FreshnessCache.ts","mode":"exec","note":"async: precomputes the A–F freshness grade that the 🧠 MEMORY line in every reply reads (P2.4)"},{"path":"LIFEOS/USER/CACHE/freshness.json","mode":"write","note":"the cache FreshnessCache writes and MemoryDeltaSurface reads on every prompt"},{"path":"LIFEOS/TOOLS/SettingsBackport.ts","mode":"exec","note":"async: pulls hand-edits in settings.json back into the user layer"},{"path":"LIFEOS/TOOLS/MergeSettings.ts","mode":"exec","note":"async: system defaults + user overrides → settings.json; on this machine both inputs are absent, so it does nothing"},{"path":"settings.json","mode":"write","note":"the merge's output target; unchanged here because the inputs are missing"}],"hook":{"name":"SessionStart registrations","event":"SessionStart","matcher":"","async":false,"exitSemantics":"Exit 0 = fine, stdout becomes context. A SessionStart hook cannot block anything; there is nothing to block yet. A non-zero exit is logged and the session continues."},"how":"The intended order (from `hooks/README.md`) is:\n\n1. **HookHealer** — scans every command in `settings.json`, checks the script exists and is executable, and runs `chmod +x` on any that lost the bit. Why: the Write tool creates files as 0644, and a hook that is not executable fails silently forever. Prints a 🩹 line only if it fixed something.\n2. **KittyEnvPersist** — copies two environment variables to disk. Why: hooks that fire later (at Stop, at SessionEnd) run without a terminal and could not otherwise find the tab to colour.\n3. **LoadContext** — the important one. Reads `MEMORY/WORK/` for sessions in the last 48 hours, `MEMORY/STATE/progress/` for tracked projects, the advisory findings from the last session's integrity checks, and the learning readback. Prints all of it inside a `<system-reminder>` block on stdout. Skipped for [[subagent]]s.\n4. **FreshnessCache** (async) — computes the A–F freshness grade and the stalest file, writes `USER/CACHE/freshness.json` so the per-prompt memory hook (P2.4), which prints the 🧠 MEMORY line in every reply, reads a number instead of computing one.\n5. **SettingsBackport + MergeSettings** (async) — the settings pipeline. Backport copies any hand edit you made to `settings.json` into the user layer; Merge rebuilds `settings.json` from the shipped defaults plus your layer. That is the design. On this machine neither `settings.system.json` nor `USER/CONFIG/settings.user.json` exists, so both steps run and change nothing; your `settings.json` is the only copy.\n\n**On this machine the list is longer than five.** `settings.json` registers KittyEnvPersist and LoadContext twice: once as `${PAI_DIR}/hooks/…` (a leftover from the PAI-era install) and once as `$HOME/.claude/hooks/…`. Both paths resolve to the same file, so LoadContext runs twice per start and prints its context twice. They date from the migration that built this file; a merge that only ever adds could not have removed them, and today the merge does not even have inputs to run on. The file tree on the right marks every duplicate with ⚠. This is not a LifeOS bug; it is what \"an update never deletes your entries\" costs.","sources":["hooks/README.md:L163-L192","hooks/LoadContext.hook.ts:L1-L40","hooks/HookHealer.hook.ts:L1-L30","settings.json"],"alternatives":[{"name":"Put previous-session context in a file and import it","tradeoff":"Simpler and visible in `/context`. The file would have to be rewritten at every session end, and it could not react to *this* start (resume vs fresh)."},{"name":"One hook that does everything","tradeoff":"One process instead of five. One crash takes all five down, and you cannot make one of them async."},{"name":"No session-start hooks; let the model ask","tradeoff":"Zero start-up cost. The model does not know there is anything to ask about; unfinished work from yesterday is simply gone."}],"why":"A static file cannot know what happened yesterday or whether this is a resume. A hook can. Splitting into five keeps each one small enough to reason about and lets the slow ones (freshness, merge) run async so the prompt box appears fast. The cost is that hook order and hook duplication are invisible unless you read `settings.json`, which is exactly what this page makes you do.","examples":[{"field":"distribution","text":"The morning depot routine before the first van leaves: check every scanner is charged (HookHealer), note which bay each van is in (KittyEnvPersist), read yesterday's exceptions log aloud to the crew (LoadContext), print the day's stock summary once so nobody recounts it (FreshnessCache), and apply last night's price-list update to the handhelds (MergeSettings)."},{"field":"hospital","text":"Shift handover on a ward. The incoming nurse does not read the whole patient file; she gets a handover sheet of what changed overnight and what is still open. That sheet is LoadContext. The bed-board update is the async cache."}],"payloads":[{"label":"stdin — what every SessionStart hook receives","text":"{\n  \"session_id\": \"0f3c2a…\",\n  \"transcript_path\": \"/home/<you>/.claude/projects/-home-<you>--claude/0f3c2a….jsonl\",\n  \"cwd\": \"/home/<you>/.claude\",\n  \"hook_event_name\": \"SessionStart\",\n  \"source\": \"startup\"\n}"},{"label":"stdout of LoadContext — becomes context (real shape, contents abbreviated)","text":"✅ LifeOS session ready...\n\n<system-reminder>\nLifeOS Dynamic Context (Auto-loaded at Session Start)\n\n## Advisory Findings\n**Advisory findings from the last session (12):**\n  [memory-dirs] a MEMORY subfolder is listed as active but does not exist on disk …\n  …and 9 more — see MEMORY/STATE/events.jsonl\n\n## Active work (last 48h)\n  - <slug> · phase: climbing · 3/12 claims\n<\/system-reminder>"},{"label":"stdout of HookHealer — only when something needed fixing","text":"🩹 HookHealer: chmod +x hooks/SomeNew.hook.ts (was 0644)"}],"without":"Without this: nothing from previous sessions reaches the model at start, no active-work summary, no advisory findings, and a hook that lost its execute bit stays broken until a human notices.","watch":"Five programs run in sequence (two of them twice on this machine). One of them prints a block of text that will sit in the conversation before your first word."},{"id":"S6","title":"Claude Code assembles the context","who":"claude-code","purpose":"Turn everything gathered so far into the one thing a model can read: a single ordered pile of text. Nothing new is created here; the order is the decision.","trigger":"Automatic, after the SessionStart hooks return. Claude Code builds the message list it will send on the first turn.","input":"Its own base system prompt; the appended `LIFEOS_SYSTEM_PROMPT.md` (S3); `CLAUDE.md` plus six imports (S4); every SessionStart hook's stdout (S5); the tool definitions it will offer the model.","output":"One assembled [[context]], in memory, ordered from most to least authoritative. Not yet sent anywhere.","files":[{"path":"process memory","mode":"read","note":"nothing on disk; the assembled context lives only inside the running claude process","virtual":true}],"how":"Order is authority. From the top:\n\n1. **Claude Code's own system prompt** — Anthropic's instructions about tools, safety and format. You never see it and cannot change it.\n2. **`LIFEOS_SYSTEM_PROMPT.md`, appended** — the LifeOS constitution, at the same level as Anthropic's text. This is where \"never assert without verification\" and the output format live. Being *here* rather than in `CLAUDE.md` is why the model treats them as rules rather than suggestions.\n3. **`CLAUDE.md` and its six imports** — delivered as a user-level message, below the system prompt. Weighed, not obeyed.\n4. **Hook output** — every `<system-reminder>` from S5, also at message level.\n5. **Tool definitions** — the list of things the model may ask for: Read, Write, Bash, the skills, any MCP tools.\n\nThe point that matters for a rookie: **all of this costs [[token]]s on every turn, forever**. The [[context window]] is finite. Every line in an imported file is a line the model reads before it reads your question. That single fact explains most of LifeOS's design choices: short identity files, on-demand documentation, hooks that print one line instead of a page.","sources":["LIFEOS/DOCUMENTATION/Config/ConfigSystem.md","hooks/LoadContext.hook.ts:L1-L40","LIFEOS/LIFEOS_SYSTEM_PROMPT.md:L1-L40"],"alternatives":[{"name":"Send only the system prompt and let the model fetch the rest","tradeoff":"Small first turn. The model must decide to fetch, and might not; identity becomes optional."},{"name":"Compress everything into a summary first","tradeoff":"Fewer tokens. A summary of your rules is not your rules; the one clause that mattered is the one the summariser dropped."},{"name":"Put rules and identity all in the system prompt","tradeoff":"Maximum authority for everything. Maximum rigidity too, and Claude Code offers only one file-append flag, so it would all be one file again."}],"why":"LifeOS accepts the token cost in exchange for certainty: identity and rules are present on every turn, no fetch required. It pays that cost down by keeping the always-loaded set small and pushing everything else behind pointers. The choice of *which* level each thing goes to (constitution above, routing table below) is the most important design decision in Part 1, and it is invisible unless you know this step exists.","examples":[{"field":"distribution","text":"The driver's clipboard before pulling out: the company rules on top (signed, cannot be changed on the road), then today's route sheet, then yesterday's notes about which customer's gate sticks. Same information every day, in the same order, and the order tells the driver what wins when two sheets disagree."},{"field":"newsroom","text":"A reporter's brief: the paper's legal rules first (unchangeable), then the editor's notes for this story, then the clippings from last time. Every page in that folder is a page the reporter reads before writing a word, so the folder is kept thin."}],"payloads":[{"label":"the assembled order (what the model will receive, top to bottom)","text":"[system]  Claude Code base prompt (Anthropic)\n[system]  + LIFEOS_SYSTEM_PROMPT.md            ← --append-system-prompt-file\n[user]    CLAUDE.md\n[user]    + ARCHITECTURE_SUMMARY.md, PRINCIPAL_TELOS.md, PRINCIPAL_IDENTITY.md,\n          DA_IDENTITY.md, PROJECTS.md, OPERATIONAL_RULES.md    ← @-imports\n[user]    <system-reminder> … LoadContext stdout … <\/system-reminder>\n[tools]   Read, Write, Edit, Bash, Grep, Agent, Skill, … (+ MCP tools if any)"}],"watch":"Nothing runs. Text is stacked in a fixed order. The order is what gives the constitution authority over the routing table."},{"id":"S7","title":"The status line draws for the first time","who":"lifeos","purpose":"Show, without asking, the things you would otherwise have to ask for: usage limits, the memory grade, TELOS progress, the model in use. The bar is the one always-visible surface of the whole system.","trigger":"Claude Code runs the `statusLine.command` from `settings.json` now and then every 5 seconds (`refreshInterval`), piping a JSON object about the session into it, and prints whatever comes back on stdout at the bottom of the terminal.","input":"JSON on stdin from Claude Code (model, working directory, cost so far), plus the cache files the script actually reads most of its numbers from: usage limits, the memory review state and how full the two hot-memory files are, the TELOS percentages.","output":"Nine lines of text. The shipped script produces 23; the wrapper in your USER zone filters and reorders them so the usage line is second and can never be the one clipped off the bottom.","files":[{"path":"~/.config/LIFEOS/USER/CUSTOMIZATIONS/statusline.sh","mode":"exec","note":"your wrapper, in the USER zone: runs the shipped script and filters 23 lines to 9"},{"path":"LIFEOS/LIFEOS_StatusLine.sh","mode":"exec","note":"the shipped script; updates still flow through it"},{"path":"LIFEOS/MEMORY/","mode":"read","note":"review-state.json: when memory was last reviewed and whether one is due"},{"path":"LIFEOS/USER/PRINCIPAL/PRINCIPAL_MEMORY.md","mode":"read","note":"measured for the \"% FULL\" figure on the 🧠 line, never displayed"},{"path":"LIFEOS/USER/TELOS/LIFEOS_STATE.json","mode":"read","note":"the TELOS dimension percentages the rings show"}],"how":"Claude Code owns the mechanism: run a command, show its stdout. LifeOS owns the script. And on this machine there is a third layer: `settings.json` points not at the shipped `LIFEOS/LIFEOS_StatusLine.sh` but at `~/.config/LIFEOS/USER/CUSTOMIZATIONS/statusline.sh`, a wrapper you wrote. The wrapper calls the shipped script, then drops the version line, the model list, the quote and the decorative rules, squashes the four-line startup breakdown into one, and moves the usage row to line 2.\n\nWhy a wrapper and not an edit? Because the shipped script is in the SYSTEM [[zone]]: the next update overwrites it and your edit dies. The wrapper is in the USER zone, so it survives, and upstream improvements to the real script still flow through it. That is the System/User boundary doing its job on a nine-line shell script.","sources":["~/.config/LIFEOS/USER/CUSTOMIZATIONS/statusline.sh","LIFEOS/LIFEOS_StatusLine.sh","settings.json"],"alternatives":[{"name":"Edit the shipped script directly","tradeoff":"Fastest. Gone at the next update, and you will not notice until the bar looks wrong."},{"name":"Copy the shipped script into USER and point at the copy","tradeoff":"Survives updates. Now you maintain a fork and never receive upstream fixes."},{"name":"No status line","tradeoff":"Nothing to maintain. You ask \"how much of my weekly limit is left?\" and spend a turn every time."}],"why":"A wrapper that filters the shipped output is the only shape that survives updates *and* keeps receiving them. It costs a small fragility: if the upstream script changes its line layout, the wrapper's patterns stop matching and the bar shows too much again. That is a known, visible failure, which beats a silent one.","examples":[{"field":"distribution","text":"The depot's wall screen shows vans out, orders picked, and cash collected today. Head office ships the screen software; the depot manager configured which three numbers are big and which twenty are small. When head office updates the software, the manager's layout survives because it is stored on the depot side."},{"field":"airport","text":"The departures board runs on the airport's software, but each airline chooses which of its flights are highlighted and how. The board is upgraded by the airport; the highlights belong to the airline."}],"payloads":[{"label":"stdin — what Claude Code pipes to the status-line command (abbreviated shape)","text":"{\n  \"session_id\": \"0f3c2a…\",\n  \"model\": { \"id\": \"claude-…\", \"display_name\": \"…\" },\n  \"workspace\": { \"current_dir\": \"/home/<you>/.claude\" },\n  \"cost\": { \"total_cost_usd\": 0.0, \"total_duration_ms\": 1200 },\n  \"context_window\": { … }\n}"},{"label":"stdout — the nine lines (values illustrative)","text":"LifeOS  ·  <model>  ·  ~/.claude\n📊  5HR 8% ↻ 20:59  │  WK 10% ↻ SAT 13:59  │  FB 0%  │  SUB CR:$0/$50·OFF\n🧠  OK · REVIEWED 2H AGO · NEXT IN 5 TURNS · 33% FULL\n… (six more lines: TELOS rings, active work, session name)"}],"without":"Without this: Claude Code shows its own default bar (model and folder). No usage percentages, no memory grade, no TELOS rings, and you spend a turn asking for each.","watch":"A script runs every five seconds and prints nine lines. Your wrapper sits between Claude Code and the shipped script."},{"id":"S8","title":"The prompt box appears. No model has been called.","who":"claude-code","purpose":"Wait for you. This step exists on the page to make one fact impossible to miss: everything in Part 1 happened without a language model.","trigger":"Claude Code finishes start-up and shows its input prompt.","input":"Nothing.","output":"A blinking cursor, a status bar, and a session that is fully prepared but has not spent a single [[token]].","files":[{"path":"nothing on disk","mode":"read","note":"no file is touched; the session is idle","virtual":true}],"how":"Look back at S1–S7: a shell substitution, a small program, a JSON read, seven markdown reads, five scripts, a text assembly, a status script. Every one of those is ordinary code doing ordinary things with files. The [[model]] has not been involved once.\n\nThis is the fact that turns \"AI system\" from magic into engineering. The intelligence has not started; the *preparation* has. And preparation is the part you can read, test, break and rebuild. When Part 2 begins with you pressing Enter, the first thing that happens is still not the model: nine more hooks run first.","sources":["LIFEOS/DOCUMENTATION/CoreComponents.md","hooks/README.md:L120-L135"],"alternatives":[{"name":"Call the model at start to say hello","tradeoff":"Friendlier. Spends tokens on every session for nothing, and the greeting becomes the thing that goes stale."},{"name":"Pre-warm the model with the context so the first reply is faster","tradeoff":"Saves a second on the first turn. Costs a full context send even if you close the terminal without typing."}],"why":"LifeOS spends nothing until you ask for something. That is the same instinct as the rest of the system: dynamic range, from trivial to heavy, discovered from the work rather than assumed at the door. The cost is a plain cursor instead of a greeting, which is the right trade.","examples":[{"field":"distribution","text":"The van is loaded, the route sheet is on the dash, the fuel card is set, the depot knows van 7 is out. The engine is off. Nothing has been delivered and no fuel has burned. Everything that decides how the day goes has already happened."},{"field":"kitchen","text":"Mise en place is done: every ingredient chopped, every pan on its hook, the ticket rail empty. No dish has been cooked. The first order is the first time the stove matters."}],"watch":"Idle. Prepared. Zero tokens spent. Press Enter to start Part 2."}],"breakIt":["Predict first, then run `claude` (not `lifeos`) from `~/.claude` and ask \"quote the first rule in your system prompt\". Then run `lifeos` and ask the same. Write the two answers side by side. Which move (S2 or S3) made the difference?","Predict what `/context` will list, then run it inside a `lifeos` session. Count the memory files. Does it show seven (CLAUDE.md + six imports) or something else? If something else, which move is wrong on this page?","Comment out one `@`-import line in `CLAUDE.md` (put `#` in front), start a fresh session, and ask a question that file would answer. Notice there is no error anywhere. Put the line back. Log the gap in `build/notes/FAILURES.md` under `context`.","Open `settings.json` and find the two `LoadContext` registrations under SessionStart. Predict what happens if you delete the `${PAI_DIR}` one: does anything break? Do not delete it yet; write the prediction down and ask me."],"recall":["Close this page. List the eight moves in order from memory, with the colour of each.","Which single flag turns `claude` into `lifeos`? Which move adds it?","Name the four files that come from outside the update-overwritable tree, and say why they live there.","At the end of S8, how many times has a model been called? Why does that matter?"],"transfer":["Write the eight-move start-up of 9T ERP's backend as the same table: the `.bat` you run, what it reads (`application.yml`), what it wires (Flyway migrations), what it prints (the startup banner), and the moment it is \"ready but idle\" (listening on :8081 with no request yet).","For the 9T agent in Part 5: which of these eight moves would exist unchanged, which change, and which disappear? (Hint: S1, S2 and S7 are terminal things; a service has none of them.)"]},{"id":"p2","number":2,"title":"One prompt, end to end","subtitle":"From Enter to the answer: every hook that fires, what it receives, what it prints, and which of the fourteen moves would still happen without LifeOS.","kind":"flow","toggle":true,"body":"\nFourteen moves. Six of them are 🟦 Claude Code raising an event or doing its own job; three are 🟨 the model deciding; the rest are 🟩 LifeOS programs reacting. The hook-heavy moves (P2, P6, P7, P9, P11) open into substeps, one per hook, each with its own nine fields and a real-shaped sample of what arrives on [[stdin]] and what leaves on [[stdout]].\n\nFlip **Strip LifeOS** and count what survives: you press Enter, Claude Code sends the packet, the model decides, tools run, the permission gate holds, the reply prints. That is a working assistant. It knows nothing about you, enforces nothing, remembers nothing, and calls anything \"done\" that it likes. Every greyed step is one of those four gaps being closed.\n\nThe hook lists on the right are read from **your** `settings.json`. Where a script is registered twice, it is marked ⚠ and it really does run twice.\n","steps":[{"id":"P1","title":"You press Enter","who":"you","purpose":"Hand the system a request. Everything after this is a reaction to the exact characters you typed.","trigger":"Enter in the prompt box.","input":"Your text.","output":"Claude Code takes the text and raises the `UserPromptSubmit` [[lifecycle event]]. It has not sent anything to a model yet.","files":[{"path":"nothing on disk","mode":"read","virtual":true}],"how":"Nothing to implement; this is the boundary between you and the machine. It is on the page so the next step has a clear starting line: the prompt is text, and text is data.","sources":["hooks/README.md:L120-L135"],"alternatives":[{"name":"Voice or a phone message","tradeoff":"Same event underneath; LifeOS has remote channels that feed the same pipeline, and they are where the harness is not a terminal."},{"name":"A scheduled job with no human","tradeoff":"The prompt comes from a timer. Works, but nobody is there to answer a question, so the run has to be fully specified."}],"why":"A terminal prompt is the simplest possible front door: no auth, no UI, no server. LifeOS starts there and adds other doors (Pulse, iMessage, Hermes) later, all feeding the same pipeline.","examples":[{"field":"distribution","text":"A customer texts an order to the sales rep. Nothing has been picked, priced or promised; a message has arrived."},{"field":"hospital","text":"A patient presses the call button. No nurse has moved yet; a signal exists."}],"watch":"Text leaves your keyboard. Zero tokens spent."},{"id":"P2","title":"Claude Code raises `UserPromptSubmit` and runs ten LifeOS hooks","who":"claude-code","purpose":"Give code a chance to react to your prompt before the model sees it: annotate it, add context, record it, name the tab. The mechanism is Claude Code's; all ten programs are LifeOS's.","trigger":"The `UserPromptSubmit` [[lifecycle event]]. Claude Code reads `hooks.UserPromptSubmit` from `settings.json` and runs each command in order, passing one JSON object on stdin. Sync hooks run one after another and their stdout is added to the context; async hooks are started and not waited for.","input":"Your prompt, session id, transcript path.","output":"The original prompt plus every sync hook's additional context. On this machine: the memory blocks (P2.4), the format contract (P2.7), and any nudge (P2.8). The seven async hooks contribute side effects only.","files":[{"path":"settings.json","mode":"read","note":"the hooks.UserPromptSubmit list"}],"how":"Ten registrations on this machine, in this order: PromptProcessing (async) → SatisfactionCapture (async) → ReminderRouter (async) → MemoryTurnStart (**sync**) → DesignDirectives (async) → VersionDrift (async) → DriftReminder (**sync**) → AlgorithmNudge (**sync**) → TimeContext (async) → ModelRungGuard (async).\n\nOnly the three sync hooks can change what the model sees this turn. The other seven do useful things (name the tab, log a rating, file a reminder, nag about versions, stamp the clock, check the rung) but their output cannot reach this turn, by the definition of async. That split is the design: everything on the hot path must be fast, so anything that can afford to be late is made async.\n\nOpen each substep on the left for its own nine fields.","sources":["settings.json","hooks/README.md:L179-L192"],"alternatives":[{"name":"No prompt hooks; put everything in the system prompt","tradeoff":"Nothing to run per turn. The system prompt cannot know what changed since the last turn, what the last reply broke, or what memory is relevant to *this* prompt."},{"name":"One hook that does all ten jobs","tradeoff":"One process instead of ten. One crash kills all ten, and you lose the sync/async choice per job. LifeOS did consolidate three memory hooks into one (P2.4) where they shared inputs."}],"why":"Per-prompt hooks are the only place code can see the prompt before the model does. LifeOS uses that moment for the things that must be true every turn (memory, format, nudges) and pushes everything else async. The price is ten processes per keystroke; measured in tens of milliseconds for the sync ones.","examples":[{"field":"distribution","text":"When an order text arrives, the system stamps it with the time, checks the customer's credit, attaches the last three notes, and files the message, before any human reads it."},{"field":"hospital","text":"A call button lights the board, logs the time, pulls up the patient card, and pages the assigned nurse. The nurse then decides."}],"hook":{"name":"UserPromptSubmit registrations","event":"UserPromptSubmit","matcher":"","async":false,"exitSemantics":"Exit 0 = continue; stdout of sync hooks becomes context. Exit 2 from a UserPromptSubmit hook would block the prompt with the stderr text shown to you; none of LifeOS's prompt hooks ever do this."},"payloads":[{"label":"stdin — identical for all ten","text":"{ \"session_id\": \"…\", \"transcript_path\": \"…\", \"cwd\": \"…\", \"hook_event_name\": \"UserPromptSubmit\", \"prompt\": \"<your text>\" }"}],"substeps":[{"id":"P2.1","title":"PromptProcessing — name the tab and the session","who":"lifeos","purpose":"Give the terminal tab and the session a human name so you can find them later.","trigger":"`UserPromptSubmit`, async, timeout 30 s. Registered first.","input":"The prompt text on [[stdin]].","output":"Nothing to the model (async). Side effects: the Kitty tab title, a session name stored on disk, a voice line.","files":[{"path":"hooks/PromptProcessing.hook.ts","mode":"exec"},{"path":"LIFEOS/MEMORY/","mode":"read+write","note":"state and observability files live under here"}],"how":"Skips very short or system text. Sets a deterministic tab title immediately, then makes one small-model [[inference]] call for a better title and a session name (first prompt only), stores the name and speaks it. Async, so the 1–1.5 s inference never delays your turn.","sources":["hooks/PromptProcessing.hook.ts:L1-L30"],"alternatives":[{"name":"Put the rule in the system prompt instead","tradeoff":"No process to run, no timeout. The rule is static: it cannot say what changed *this* turn or what the last reply actually broke."},{"name":"Ask the model to check itself","tradeoff":"Zero code. Measured in this system's own logs: a self-computed status line failed compliance repeatedly; a hook that computes the fact and hands it over did not."}],"why":"Naming needs judgement (what is this session about?), so an inference call is justified; making it async keeps that cost off the hot path. The cost is one small-model call per session and a dependency on the voice server being optional.","examples":[{"field":"distribution","text":"The dispatcher writes \"Kutaisi run, 14 stops\" on the whiteboard next to van 7 as it leaves. Nobody waits for the marker to dry."},{"field":"newsroom","text":"The desk editor gives each story a working slug the moment it is pitched, so it can be found in the queue."}],"hook":{"name":"PromptProcessing.hook.ts","event":"UserPromptSubmit","matcher":"","async":true,"timeoutSec":30,"exitSemantics":"Always exit 0. Async: stdout is discarded; only side effects matter."},"payloads":[{"label":"stdin — what every UserPromptSubmit hook receives","text":"{\n  \"session_id\": \"0f3c2a…\",\n  \"transcript_path\": \"/home/<you>/.claude/projects/…/0f3c2a….jsonl\",\n  \"cwd\": \"/home/<you>/.claude\",\n  \"hook_event_name\": \"UserPromptSubmit\",\n  \"prompt\": \"<your text, verbatim>\"\n}"}],"without":"Without this: tabs are all called \"claude\" and sessions have UUIDs instead of names."},{"id":"P2.2","title":"SatisfactionCapture — read your reaction to the last reply","who":"lifeos","purpose":"Turn a bare \"8\", a \"great job\" or a \"no, that's wrong\" into a recorded rating or a failure incident, so the system can learn from your reactions without you filling in a form.","trigger":"`UserPromptSubmit`, async, timeout 20 s. Reads the previous reply from a file the Stop hook `LastResponseCache` wrote (P11.1).","input":"Your prompt, plus `MEMORY/STATE/last-response.txt`.","output":"Nothing to the model. Side effects: a row in `ratings.jsonl`, or a FAILURES incident whose summary is your complaint verbatim, or an upgrade record for \"from now on…\" directives.","files":[{"path":"hooks/SatisfactionCapture.hook.ts","mode":"exec"},{"path":"LIFEOS/MEMORY/","mode":"read+write","note":"state and observability files live under here"}],"how":"Precision-first phrase matching, no inference. A bare number is a rating. Praise fast-paths to 8. An explicit correction (\"no, that's wrong\", \"you did X wrong\") writes an incident with your words as the summary. A standing directive (\"from now on\", \"always/never\", \"rule:\") writes an upgrade record. Neutral text is skipped.","sources":["hooks/SatisfactionCapture.hook.ts:L1-L30","hooks/README.md:L346-L372"],"alternatives":[{"name":"Ask for a rating after every reply","tradeoff":"Explicit and clean. You would stop answering by day two."},{"name":"Infer sentiment with a model on every turn","tradeoff":"Catches subtle reactions. Noisy, costly, and removed in 7.0.0 for exactly that reason; the deterministic leg was restored because complaint capture collapsed 97% without it."}],"why":"Your reactions are the cheapest training signal the system has, and they arrive as ordinary text. Reading them deterministically keeps the cost at one regex per turn. The price: soft hints are missed on purpose, because a false positive (a normal question logged as a complaint) is worse than a miss.","examples":[{"field":"distribution","text":"A customer who says \"wrong beer again\" on the phone is logged as a complaint by the rep, in the customer's own words, without a survey."},{"field":"kitchen","text":"A plate that comes back untouched is noted by the pass; nobody hands the guest a questionnaire."}],"hook":{"name":"SatisfactionCapture.hook.ts","event":"UserPromptSubmit","matcher":"","async":true,"timeoutSec":20,"exitSemantics":"Always exit 0. Async."},"payloads":[{"label":"what it writes (one line of ratings.jsonl, redacted)","text":"{\"ts\":\"2026-09-11T10:02:11Z\",\"session_id\":\"0f3c2a…\",\"rating\":8,\"source\":\"praise-fastpath\",\"prompt_hash\":\"…\"}"}],"without":"Without this: your \"no, that's wrong\" is just a message; nothing records it, and the nightly improvement pass has nothing to read."},{"id":"P2.3","title":"ReminderRouter — \"remind me to X\" becomes an issue","who":"lifeos","purpose":"Catch a reminder or a \"research this later\" the moment you say it, and file it where it will not be lost.","trigger":"`UserPromptSubmit`, async, timeout 5 s. One regex test on the prompt; non-matching prompts exit immediately.","input":"Your prompt.","output":"Nothing to the model. Side effect: a labelled GitHub issue in the configured work repo, opened by the `gh` CLI, with your prompt verbatim in the body.","files":[{"path":"hooks/ReminderRouter.hook.ts","mode":"exec"}],"how":"Precision over recall: only clear phrasings (\"remind me to…\", \"queue this for later\") match. Idempotent within a session (same text hashed, routed once). Skips silently if no work repo is configured. Never blocks.","sources":["hooks/ReminderRouter.hook.ts:L1-L25"],"alternatives":[{"name":"Let the model decide it is a reminder and call a tool","tradeoff":"Handles any phrasing. Costs a model decision every time, and the model sometimes forgets; a regex never does."},{"name":"A separate /remind command","tradeoff":"Explicit. You have to remember the command, which is the thing reminders exist to fix."}],"why":"A deterministic catch for a narrow phrase is cheaper and more reliable than judgement, and the cost of a miss is low (you can say it again). The cost of a false positive (a coding question turned into an issue) is high, hence the narrow patterns.","examples":[{"field":"distribution","text":"A rep says \"note: the Batumi shop wants delivery before 9\". The dispatcher writes it on the board immediately rather than trusting memory."},{"field":"airport","text":"A pilot's \"remind me to log the bird strike\" goes straight onto the tech-log clipboard."}],"hook":{"name":"ReminderRouter.hook.ts","event":"UserPromptSubmit","matcher":"","async":true,"timeoutSec":5,"exitSemantics":"Always exit 0. Async."},"payloads":[{"label":"the side effect (command it spawns, simplified)","text":"gh issue create --repo <owner>/<work-repo> --label reminder --title \"Remind: …\" --body \"<prompt verbatim>\\nDue: <parsed date if any>\""}],"without":"Without this: the reminder lives in the transcript and nowhere else."},{"id":"P2.4","title":"MemoryTurnStart — the one memory hook: inject, surface, retrieve","who":"lifeos","purpose":"Put the right memory in front of the model for this prompt, and show you in one line that the memory loop is alive.","trigger":"`UserPromptSubmit`, sync, timeout 8 s. Not async, because its output must reach this turn.","input":"Your prompt; the two hot-layer files; the memory state files; the knowledge corpus.","output":"Up to four blocks on [[stdout]], all injected: `<lifeos-memory>` (hot layer), `<lifeos-memory-health>` (only when unhealthy), `<lifeos-memory-delta>` (the 🧠 MEMORY line the reply must echo verbatim), `<lifeos-ground>` (prompt-relevant notes found by [[BM25]]).","files":[{"path":"hooks/MemoryTurnStart.hook.ts","mode":"exec"},{"path":"hooks/LoadMemory.hook.ts","mode":"exec"},{"path":"hooks/MemoryDeltaSurface.hook.ts","mode":"exec"},{"path":"LIFEOS/USER/PRINCIPAL/PRINCIPAL_MEMORY.md","mode":"read","note":"hot layer, capped at 48 entries"},{"path":"LIFEOS/USER/DIGITAL_ASSISTANT/DA_MEMORY.md","mode":"read","note":"hot layer, the assistant's own notes"},{"path":"LIFEOS/MEMORY/","mode":"read+write","note":"state and observability files live under here"}],"how":"One process, four jobs in order, each owned by its own file:\n\n1. **Review cadence tick** — counts this turn toward the next memory review (no output).\n2. **LoadMemory.run()** — reads the two hot-layer files and prints them inside `<lifeos-memory>`.
