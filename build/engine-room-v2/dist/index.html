it (Ctrl-D, /exit, closing the terminal). Claude Code raises `SessionEnd` and runs `hooks.SessionEnd` in order.","input":"Session id, transcript path, reason.","output":"Nothing to the model (there is no more model). Files: a learning note under `MEMORY/LEARNING`, `work.json` rows marked complete, settings counts, health and integrity records, possibly a regenerated architecture summary.","files":[{"path":"hooks/WorkCompletionLearning.hook.ts","mode":"exec"},{"path":"hooks/SessionCleanup.hook.ts","mode":"exec"},{"path":"hooks/UpdateCounts.hook.ts","mode":"exec"},{"path":"hooks/MemoryHealthGate.hook.ts","mode":"exec"},{"path":"hooks/DocIntegrity.hook.ts","mode":"exec"},{"path":"hooks/IntegrityCheck.hook.ts","mode":"exec"},{"path":"LIFEOS/MEMORY/","mode":"read+write","note":"state and observability files live under here"}],"how":"Ten registrations on this machine, six distinct hooks (four are PAI-era duplicates, see S5):\n\n1. **WorkCompletionLearning** — if significant work completed (files changed, or an ISA exists), write a learning file capturing what was built and what it taught. Must run before cleanup.\n2. **SessionCleanup** — mark this session's work rows complete, reset the tab, clear the session-name entry.\n3. **UpdateCounts** — refresh the counts in settings.json (skills, hooks, ratings) and the usage cache so the next banner is fresh.\n4. **MemoryHealthGate** — run the autonomic memory health check; the 🩺 line you may see next session comes from here.\n5. **DocIntegrity** — if system docs or hooks changed this session, check cross-references and regenerate the architecture summary. Returns instantly otherwise.\n6. **IntegrityCheck** — detect LifeOS system file changes and spawn background maintenance.\n\nNone can block anything; the session is over. They are the write side of \"the run leaves its trail\".","sources":["settings.json","hooks/README.md:L273-L284","hooks/WorkCompletionLearning.hook.ts:L1-L45"],"alternatives":[{"name":"Do all of this at Stop instead","tradeoff":"Learnings would be fresher. Stop fires on every turn; these are once-per-session jobs and would slow every reply."},{"name":"A nightly job over all transcripts","tradeoff":"No hook. Sessions that end mid-crash still get processed. Slower feedback, and the job must reconstruct session boundaries."}],"why":"Session end is the natural once-per-session moment, and the jobs here are exactly the once-per-session kind. The cost is that a crashed terminal skips them, which the nightly maintenance partly covers.","examples":[{"field":"distribution","text":"End of day at the depot: file the day's exceptions as lessons, close the routes, update the counters on the wall board, run the stock-health check, and flag any process document that today's changes made stale."},{"field":"orchestra","text":"After the concert: the librarian files the marked parts, the manager logs attendance, and the conductor notes what to rehearse next time."}],"hook":{"name":"SessionEnd registrations","event":"SessionEnd","matcher":"","async":false,"exitSemantics":"Exit 0 always. There is nothing left to block."},"payloads":[{"label":"stdin","text":"{ \"hook_event_name\": \"SessionEnd\", \"session_id\": \"…\", \"transcript_path\": \"…\", \"reason\": \"exit\" }"},{"label":"what WorkCompletionLearning writes (path shape)","text":"MEMORY/LEARNING/SYSTEM/2026-09/20260911-1310_work_engine-room-v2-teaching-app.md"}],"watch":"Six programs close the books. The session is over."}],"breakIt":["Predict what `/hooks` will show for UserPromptSubmit, then run it in a session. Count the entries. Does it match the ten on this page?","Ask me to write into `LIFEOS/LIFEOS_StatusLine.sh` (a SYSTEM-zone file). Predict which substep blocks it and what text you will see. Then watch. Log the gap in FAILURES.md under `control`.","Send a prompt that says \"go heavy\" with nothing else. Predict whether P2.8 fires and what the nudge says. Check the reply for the nudge's effect.","Type a bare \"8\" as your whole next prompt. Nothing visible should happen. Then find the new line in `MEMORY/LEARNING/SIGNALS/ratings.jsonl` (ask me for the path if it differs). That is P2.2 leaving a trace.","In a scratch project with no LifeOS, ask plain `claude` to \"deploy this and confirm it is live\" on something it cannot probe. Watch it claim. Then do the same under `lifeos` and watch P11.4 either bounce it or force an honest downgrade. Write down which happened."],"recall":["Close the page. List the fourteen moves in order and mark each 🟦 🟩 🟨 ⬜.","Which single substep in the whole path can veto a tool call, and with what exit code? Which single substep can veto a reply?","Name the three sync UserPromptSubmit hooks and say why the other seven are async.","Which lines of a reply are computed by hooks and only echoed by the model? Why was it designed that way?","Where is the Stop → UserPromptSubmit bridge, and what file carries it?"],"transfer":["Write the same fourteen-move table for a 9T sales order: the message arrives, pre-checks (credit, stock), authority (credit limit), execution (pick, load), observation (proof of delivery), the \"done\" gate (signed note), and the end-of-day learning. Mark which moves are software, which are people, and which are policy.","For the 9T agent in Part 5: which hooks here become *business* guards (no GL write without a source row), which become *observability* (every action logged), and which disappear (tab colours, voice, Kitty)?"]},{"id":"p3","number":3,"title":"The 25 parts","kind":"components","subtitle":"Every LifeOS component, placed on the five-box map, with its alternatives and its price.","body":"\nTwenty-five components, each on the five-box map from Part 0, each with the same nine fields as every step in Parts 1 and 2. Pick a box on the left to see what lives in it; pick a component to read it.\n\nTwo things to hold onto while you read:\n\n- **The box tells you what kind of thing it is.** A context component puts text in front of the model. A control component fires whether the model likes it or not. A verification component decides whether \"done\" is allowed. If you cannot say which box a part belongs to, you do not understand it yet.\n- **The status line tells you what you can actually run.** \"Code shipped\" means it is on your disk and wired. \"Blueprint only\" means the public release ships the idea and a document, and the running version is private. The old Engine Room was honest about this and so is this one.\n\nThe **Alternatives** and **Why this way** fields are the ones the old app lacked entirely. Read them as a design review: for each part, someone chose this over two or three other real options, and the choice has a price. Knowing the price is what lets you advise a client.\n","components":[{"id":"agents","name":"Subagents","box":"capability","status":"Code shipped. The [[dispatch]] mechanism belongs to [[Claude Code]]; this install adds 18 agent definition files under `agents/` and a routing doctrine on top.","summary":"A subagent is a second copy of the assistant, started with its own fresh context and its own instructions, that goes off and does one piece of the work and reports back.","purpose":"Some work is wide rather than deep: five files to survey, three angles to argue, one audit that should not be done by whoever built the thing. One [[context window]] doing all of it in sequence is slow and fills up with material the final answer never needs.","who":"claude-code","trigger":"The model calls the `Agent` tool with a `subagent_type` and a [[prompt]]. Types are the harness built-ins plus every file in `agents/`. Two [[hook]]s fire around the call: a [[Pulse]] HTTP route at `localhost:31337/hooks/agent-guard` before it, and `hooks/AgentInvocation.hook.ts` both before and after.","input":"A prompt describing the job and, optionally, a `model` [[alias]] naming which [[rung]] to run on. Omitting `model` means the subagent inherits the session's model, which the doctrine treats as the correct default.","output":"One report back to the caller. Only that report enters the caller's [[context]]; everything the subagent read along the way stays in its own window and is discarded.","files":[{"path":"agents/Max.md","mode":"read","note":"a file-backed agent: [[frontmatter]] pins a model tier, a persona and a permission list that denies Edit and Write"},{"path":"agents/Forge.md","mode":"read","note":"the cross-vendor counterpart, run through a different vendor's command-line coding model"},{"path":"hooks/AgentInvocation.hook.ts","mode":"exec","note":"records which subagent ran, for how long, and which model it actually carried; observes only, never rewrites the call"},{"path":"LIFEOS/TOOLS/models.ts","mode":"read","note":"where the tier aliases resolve, so no dispatch pins a dated model ID"}],"how":"`LIFEOS/DOCUMENTATION/Agents/AgentSystem.md` separates three things people routinely confuse. Built-in subagent types like `Explore` and `general-purpose` are internal machinery with no personality. File-backed agents in `agents/` are persistent identities: `agents/Max.md` carries a persona, a voice, a pinned model tier and a permission block that denies Edit, Write and NotebookEdit outright, so it can read and attack an artifact but never modify it. Custom agents are neither; they are written as an inline brief in the prompt itself and launched with `general-purpose`.\n\nThe rule that catches people is that asking for \"specialized agents\" and reaching for a bare built-in type produces several identical generic workers. What makes an agent custom is the distinct brief, the role and the angle it argues from, written straight into the prompt text. There is no composition tool and no trait registry; the doc gives a vocabulary of expertise, personality and approach words to draw on when writing prose.\n\nModel selection went the same way. The old rule was to name a model on every dispatch, and it was retired because a named model is the thing that goes stale. The default now is inheritance. When a different [[rung]] genuinely is warranted, you pass a tier [[alias]] rather than a pinned ID, because the harness resolves an alias to the newest model in that tier. `hooks/AgentInvocation.hook.ts` records which model each dispatch actually carried, and its header is explicit that it observes and never injects, because an injector that silently flattens every dispatch to one rung fails quietly rather than loudly.","sources":["LIFEOS/DOCUMENTATION/Agents/AgentSystem.md","agents/Max.md:L1-L30","agents/Forge.md:L1-L25","hooks/AgentInvocation.hook.ts:L1-L45","LIFEOS/DOCUMENTATION/CoreComponents.md"],"alternatives":[{"name":"Do all of it in one [[context]], one step at a time","tradeoff":"Wins shared state and zero coordination cost, since every step sees everything the earlier ones saw. Costs wall-clock time and a context window that fills with material the final answer never needs."},{"name":"A fixed roster of specialist types, one per job title","tradeoff":"Wins predictability and a short menu. Costs staleness and false precision: LifeOS shipped `Architect`, `Designer` and `Engineer` types and retired all three, because a brief written for the actual task beats a title chosen from a list."},{"name":"Hosted agents that run unattended in the cloud","tradeoff":"Wins durability, since the session survives a disconnect and can run for hours in a sandbox. Costs coordination overhead that exceeds the benefit under about thirty minutes, and those agents do not load this system's [[CLAUDE.md]] or its skills."}],"why":"The choice here is deliberately thin. Subagents are a harness mechanism, and the canonical component map says outright that things a good harness already provides are not counted as LifeOS features. So LifeOS adds only what the mechanism lacks: a routing rule for which of the three systems a request belongs to, a handful of file-backed agents where the difference is real rather than cosmetic, and a hook that records what actually ran. The two file-backed agents worth knowing are the ones that buy a genuinely different opinion, one pinned to the top Anthropic rung and read-only, one run through a different vendor's model so that it does not share the blind spots of the model that wrote the code. The cost is that every dispatch is a fresh context that knows only what its brief says, so a badly written brief produces confident work on the wrong problem, and you find out only when the report comes back.","examples":[{"field":"distribution","text":"A wholesaler wants last quarter reviewed across nine sales territories. One subagent per territory pulls that territory's invoices, returns and credit notes and reports three numbers, so nine reviews run at once and only twenty-seven numbers come back to the manager rather than nine full ledgers. The margin policy question, whether the rep discounting scheme is defensible at all, does not fan out. That is one hard judgment, so it goes to the read-only deep-analysis agent instead."},{"field":"hospital","text":"A hospital ward does not send the same doctor to read a scan they ordered and interpreted. The scan goes to a radiologist who was not in the room and does not know what everyone expects to find. The point is not extra hands; it is a second reader whose assumptions are not the first reader's assumptions, which is exactly why the cross-vendor audit agent is never allowed to audit work it wrote itself."}],"related":["skills","algorithm","hooks","arbol","observability"],"failure":"You ask for specialized agents and get several copies of one generic worker, because the dispatch reached for a bare built-in type instead of writing a distinct brief per agent. The other tell is a subagent returning confident work on the wrong problem, which means the brief, not the model, was wrong."},{"id":"algorithm","name":"The Algorithm","box":"verification","status":"Specification shipped. The doctrine file at LIFEOS/ALGORITHM/ ships as a contract the model reads and follows, and the hooks that enforce parts of it mechanically ship as code and are registered in this install.","summary":"The rulebook for how a piece of work gets done: write down what finished means, then refuse to call anything finished until a tool has proved it.","purpose":"A capable [[model]] will happily announce that something works without having checked. The [[Algorithm]] is the contract that closes that gap: it states what has to be true when a run is complete, and it makes a completion claim without proof mechanically expensive rather than merely frowned upon.","who":"lifeos","trigger":"Substantial work triggers it, meaning anything where done needs articulating, building or verifying. The constitutional rules tell the model its first action for such work is to read `LIFEOS/ALGORITHM/LATEST` for the version string, then read the matching version file. Trivial turns skip the whole thing. Separately, `hooks/AlgorithmNudge.hook.ts` runs on every [[prompt]] and on every failed [[tool call]], and `hooks/StopGates.hook.ts` runs at the [[Stop gate]] when the model tries to finish its [[turn]].","input":"Your request, plus whatever the run discovers: failed probes, corrections you make mid-run, constraints found in the code. The doctrine file itself is the standing input.","output":"A completed piece of work whose claims each closed on real [[evidence]], an [[ISA]] that is different at the end than it was at the start, and a reflection record appended to a [[JSONL]] corpus for later auditing.","files":[{"path":"LIFEOS/ALGORITHM/LATEST","mode":"read","note":"one line holding the current version string; the single source of truth for which file to read"},{"path":"LIFEOS/ALGORITHM/v8.20.2.md","mode":"read","note":"the doctrine file: sixteen claims about what a complete run must satisfy"},{"path":"hooks/AlgorithmNudge.hook.ts","mode":"exec","note":"registered on UserPromptSubmit and PostToolUseFailure; fires bounded questions at the moment they are answerable"},{"path":"hooks/StopGates.hook.ts","mode":"exec","note":"registered on Stop; the gate chain that blocks a completion claim that has not earned it"},{"path":"LIFEOS/TOOLS/ascent.ts","mode":"exec","note":"the one derivation of run state that every display surface reads"},{"path":"LIFEOS/TOOLS/Reflect.ts","mode":"exec","note":"writes the post-run self-critique record"}],"how":"The loop is one sentence: move a thing from its [[current state]] to its [[ideal state]] by climbing a hill you define as you climb it. That is [[hill climbing]], and the [[ISA]] is both the hill and the measuring instrument. Each [[claim]] in the ISA names the [[probe]] that would prove it false, so the specification is also the test suite. The doctrine file states the rule bluntly: without tool evidence there is no up or down, only motion.\n\nThe doctrine is written as an outcome contract, not a procedure. `LIFEOS/ALGORITHM/v8.20.2.md` lists sixteen things that must be true when a run is complete, and explicitly leaves how to get there to the model. Every claim is tagged with how it is enforced. HOOK means a [[deterministic]] gate blocks it. CHECK means the run executes a check and records the result. SELF means honest self-attestation, labelled as such because the system knows self-attestation decays. That labelling came from auditing its own history: rules that lived only as prose measured 11 to 22 percent real compliance while self-scored audits reported near-perfect numbers.\n\nThe live layer is `hooks/AlgorithmNudge.hook.ts`. Rather than standing prose telling the model what to do whenever X happens, it asks a bounded question at the moment the question is answerable. The rows are constrained by construction: a row may only ask about an outcome already stated in the doctrine file, and only about state the model cannot see from its own [[context]], such as an ISA that has gone stale or the [[blast radius]] of a destructive operation. A row that maps a phrase to a mandated procedure is banned.\n\nOne design decision is worth naming because it is unusual. There is no effort tier, no complexity rubric and no classifier anywhere. Spend is discovered from the work rather than predicted before it. The mechanism is the claims themselves: you cannot close what you did not verify, so hard work with deep verification pulls in agents, audits and stronger models on its own, and a two-claim task cannot justify ceremony. Earlier versions did predict effort, with tiers and a model-routing rubric, and all of it was retired in mid-2026 because prediction before work failed in both directions.","sources":["LIFEOS/ALGORITHM/v8.20.2.md","LIFEOS/DOCUMENTATION/Algorithm/AlgorithmSystem.md","LIFEOS/DOCUMENTATION/CoreComponents.md","LIFEOS/LIFEOS_SYSTEM_PROMPT.md:L1-L60"],"alternatives":[{"name":"Trust the model and read the output yourself","tradeoff":"Wins on zero overhead and zero ceremony, which is right for most small asks. Costs you the review: you become the [[verification gate]], you catch what you happen to look at, and the failures that survive are the ones nobody thought to check."},{"name":"A fixed phase checklist the model must walk","tradeoff":"Wins on predictability, since every run looks the same and is easy to audit. Costs capability, because scripted steps cap a strong model below its ability and rot as models improve. LifeOS ran this and retired it: measured compliance for prose-only steps was low while the self-scores stayed high."},{"name":"Route work by a complexity rubric before starting","tradeoff":"Wins on budget control, because you know the spend before you commit. Costs accuracy in both directions, since difficulty is a property of the work and shows up in the [[evidence]] gates, not in the wording of the request. LifeOS shipped tiers and deleted them for exactly this."}],"why":"The Algorithm keeps only four kinds of thing, and the admission test for anything new is whether it is context, an artifact, a tooth or an instrument. If it is a step, a floor, a ritual or a self-score, it does not ship. That is why the doctrine reads as an outcome contract rather than a recipe. The teeth exist because the same audit that produced the doctrine also produced the empirical law behind it: declarative rules without mechanical enforcement decay. The cost is that a real run is slower and noisier than a confident guess. You get nudges mid-run, gates at the close, and a refusal to say done when there is no proof. On a five-minute task that overhead would be absurd, which is exactly why trivial turns are exempt.","examples":[{"field":"distribution","text":"A rep reports that the customer statement shows the wrong balance. The Algorithm shape is: reproduce the wrong balance on that customer before opening any code, write done as a claim that the statement total equals the sum of its open invoices for that account, then close the claim only on a query result you actually ran. The class sweep is the part people skip: if one account was wrong because of how credit notes were signed, every account with a credit note has to be enumerated and checked, not just the one that got reported."},{"field":"kitchen","text":"A head chef does not sign off a new dish because it looked right leaving the pass. Done is written down first as things anyone can check: the sauce holds for twelve minutes under a lamp, the plate leaves at 63 degrees, two cooks who did not design it can make it from the card. Each of those has an obvious way to prove it false, and tasting it once yourself is the example that passes while the dish is still broken on a busy Friday."}],"related":["isa","hooks","telos","cortex","observability"],"without":"Without this: done means whatever the model says it means, and you find out which claims were guesses when something breaks in front of a customer.","failure":"You notice it is broken when the phrase \"should work\" survives into a final answer, or when a run ends with claims closed that no tool output in the transcript actually supports."},{"id":"arbol","name":"Arbol","box":"capability","status":"Blueprint only, private implementation. The concept document ships in the public release; no worker, action or flow code ships with it, and the local runner tree `LIFEOS/ARBOL/` does not exist on this install.","summary":"Arbol is the part of the system that keeps working while your laptop is shut, running small jobs on a schedule out on someone else's servers.","purpose":"A session-bound assistant only knows what was true the last time you sat down. Watching a source, transforming a signal or scanning a deployed site has to happen on a clock, not on your attention.","who":"lifeos","trigger":"A Cloudflare [[cron]] trigger fires a Flow worker's scheduled handler at its configured interval. Every flow also exposes a public `/health` endpoint and an authenticated `/trigger` endpoint for a manual run. The same actions run locally from a command with no schedule at all.","input":"Whatever the flow's configured source produces: an RSS feed, an API response, a webhook payload. Inside a pipeline, each action receives the accumulated JSON output of every action before it.","output":"A result written to the flow's configured destination, which may be an email, a database or an API, plus a JSON envelope per action carrying `success`, the action name, a duration and the output object.","files":[{"path":"LIFEOS/DOCUMENTATION/Arbol/ArbolSystem.md","mode":"read","note":"the concept document, which is the whole of what ships publicly"},{"path":"LIFEOS/DOCUMENTATION/Tools/Cli.md","mode":"read","note":"the local runner and its pipe model, also marked as excluded from the public payload"},{"path":"LIFEOS/USER/CUSTOMIZATIONS/ARBOL","mode":"read+write","note":"where an install keeps its own actions and workers; named by the docs, private by zone, not opened here"},{"path":"Cloudflare Workers at the edge","mode":"exec","virtual":true,"note":"not a file in this tree; the deployed runtime where flows actually execute"}],"how":"Everything in Arbol is built from three things that stack. An Action is one unit of work, prefixed `A_`, that turns JSON into JSON and knows nothing about anything else. A Pipeline, prefixed `P_`, is an ordered list of actions where the output of one becomes the input of the next. A Flow, prefixed `F_`, is the only layer that owns a clock: it names a source, a pipeline, a destination and a schedule.\n\nThe chain works because of the passthrough pattern. Each action destructures the field it needs and spreads everything else forward, so the last action in a chain can still see a title the first action produced three hops ago. Context accumulates rather than evaporating at each step, which is what lets an action stay ignorant of the pipeline it sits in.\n\nTwo details matter for judgment. Workers come in two grades, and the selection rule is to default to the lightweight one and upgrade only when the action genuinely needs network calls, secrets or bindings. And cost is a design input, not an afterthought: the doc works the arithmetic out loud, noting that a five-minute interval over thirty items is about 8,640 model calls a day, and that the fixes are longer intervals, deduplication and filtering rather than a bigger budget. Arbol is also where the hourly outside-in security scan of the deployed estate runs, which is the same system as the [[Bunker]] security plane under a different name.","sources":["LIFEOS/DOCUMENTATION/Arbol/ArbolSystem.md","LIFEOS/DOCUMENTATION/CoreComponents.md","LIFEOS/DOCUMENTATION/Tools/Cli.md","LIFEOS/DOCUMENTATION/Security/README.md"],"alternatives":[{"name":"A scheduled job on your own machine","tradeoff":"Wins simplicity, zero cloud cost and no deployment step. Costs availability: the job runs only when the machine is awake and connected, which is exactly the condition the component exists to remove."},{"name":"One long-running server process you own","tradeoff":"Wins the ability to hold state between runs and to react instantly. Costs operations: a machine to patch, a process to keep alive, and a cold start that is yours to solve rather than the platform's."},{"name":"One monolithic script per scheduled job","tradeoff":"Wins directness, since the whole job reads top to bottom in one file. Costs reuse and testing: the summarize step cannot be run or fixed on its own, and the tenth job re-implements what the first nine already did."}],"why":"Splitting into three primitives buys one property that a monolithic scheduled script cannot: each layer refuses to know something. Actions do not know about schedules, pipelines do not know about sources, and only flows watch the clock, so an action can be tested by hand with one JSON object and reused in any chain. The composition is deliberately Unix-shaped, output piping into input, so the same units run locally for development and at the edge for production with no code change. The cost is honest and large. This is private infrastructure. The public release ships the design and nothing else, so a reader who wants this has to build it against someone else's cloud account, and the running bill scales with how often the flows fire.","examples":[{"field":"distribution","text":"A wholesaler wants an exceptions email at 6am rather than a dashboard nobody opens. One action pulls last night's warehouse stock file, a second compares it against open orders, a third writes the shortfall lines in plain language. A flow wires the source, the schedule and the sales manager's inbox. Nothing runs on anyone's laptop, and the rating action can be tested on its own with one order line before it is ever put in the chain."},{"field":"farm","text":"An irrigation controller does not wait for the farmer to decide it is time. A moisture sensor is one unit, the decision rule is another, the valve is a third, and a timer wires them into a cycle that runs at dawn whether or not anybody is awake. Replace the sensor and the decision rule does not change, which is the same reason an action never knows which pipeline it sits in."}],"related":["tools","bunker","security","synapse","feed"],"without":"Without this: nothing in the system runs while the laptop is closed, so its picture of the current state is only ever as fresh as your last session.","failure":"A digest, alert or scan that is supposed to arrive on a schedule simply does not, and no session log shows anything wrong, because the run happens entirely outside every session."},{"id":"atlas","name":"Atlas","box":"memory","status":"Code shipped. The command-line tool, the store, all eight collectors, the installer, and the hint hook ship in the public release. The background service is opt-in, the database is per-machine and lives outside every git repository, and the maintainer's own state-of-record file for Atlas is not in the public payload.","summary":"A map of everything you own online, kept as a graph so you can ask what a single deletion would break.","purpose":"You cannot climb from [[current state]] to [[ideal state]] without an honest picture of the current state. Domains, servers, repositories, services, devices, and credentials otherwise live in a dozen dashboards, and nobody can answer what depends on what.","who":"lifeos","trigger":"Two paths, and they are not equal. The slow one is reconciliation: a background service ticks every fifteen minutes and runs a full sync when the last one is over an hour old. The fast one is a hint: hooks/AtlasEventCapture.hook.ts fires on PostToolUse for Bash, Write, Edit, and MultiEdit, and when the command looks like a deploy or a DNS change it appends a hint line. You can also run any command by hand.","input":"The sources of authority themselves, never a cached copy: a cloud provider API, the GitHub command-line tool listing repositories, the project registry file, the service definitions on this machine, and the credential registry.","output":"Rows in a local [[SQLite]] database, each carrying which [[collector]] saw it and when it was first and last seen. A redacted snapshot file for the dashboard. Answers on [[stdout]] for questions like what does this own, what relies on this, and what is nobody watching.","files":[{"path":"LIFEOS/ATLAS/Atlas.ts","mode":"exec","note":"the command-line entry point for sync, tick, owns, blast, stale, sql"},{"path":"LIFEOS/ATLAS/Store.ts","mode":"exec","note":"the store: upserts, observations, the sweep rules"},{"path":"LIFEOS/ATLAS/collectors/Cloudflare.ts","mode":"exec","note":"one of eight collectors, each owning one source of authority"},{"path":"hooks/AtlasEventCapture.hook.ts","mode":"exec","note":"writes hints only, never facts"},{"path":"~/.local/state/lifeos/atlas","mode":"read+write","note":"the database, the redacted snapshot, and the hint file, deliberately outside both git repositories"},{"path":"LIFEOS/ATLAS/InstallAtlas.ts","mode":"exec","note":"installs the fifteen-minute background service"},{"path":"LIFEOS/PULSE/modules/atlas.ts","mode":"exec","note":"reads the exported snapshot for the dashboard, never the live database"}],"how":"LIFEOS/DOCUMENTATION/Atlas/AtlasSystem.md sets out three rules that explain the whole design.\n\nFirst, observations rather than assertions. The same domain can be seen by three different collectors at once, and they all attach to one asset. The asset stays alive while any collector still sees it, and only goes stale when every one of them has stopped. One source going quiet therefore expires that source's view, never the thing itself.\n\nSecond, sweeping is gated hard. Marking observations as gone happens only after a run that succeeded, enumerated completely, and was a full run rather than a targeted one, and even then only within that collector's own observations. A rate limit or a half-read page makes the run partial, and a partial run sweeps nothing. That is what stops a flaky API from quietly deleting your map.\n\nThird, hints are latency and reconciliation is truth. The [[hook]] never writes a fact. It appends a line saying \"something touched Cloudflare\", the service wakes, and the collector goes and asks Cloudflare what is actually true. A hint that is missed or malformed costs nothing at all, because the hourly cycle heals it. On top of the [[graph]], the questions are the point: LIFEOS/ATLAS/Atlas.ts answers what a deletion would orphan, what depends on a given asset, and which serving domains nobody is monitoring. Those answers are treated as derived [[evidence]] for a [[blast radius]] check, and the tool prints a reminder to confirm against the provider before deleting anything.","sources":["LIFEOS/DOCUMENTATION/Atlas/AtlasSystem.md","hooks/AtlasEventCapture.hook.ts:L1-L50","LIFEOS/DOCUMENTATION/Services/BackgroundServices.md","LIFEOS/DOCUMENTATION/CoreComponents.md"],"alternatives":[{"name":"A hand-maintained inventory list","tradeoff":"Wins by being free and readable by anyone. Costs accuracy immediately, because a list is only correct on the day it was written, and nothing forces it to notice that a service was deleted six weeks ago."},{"name":"A real graph database with a server","tradeoff":"Wins expressive queries and a mature ecosystem, and it is what the system Atlas is modelled on actually uses. Costs a running server process, which does not fit a setup where several processes read the same store with no daemon at all."},{"name":"Query each provider dashboard when you need an answer","tradeoff":"Always current by definition, and needs no storage. Cannot answer the only questions that matter here, because the dependency between a domain in one provider and a repository in another exists nowhere except in your head."}],"why":"The questions Atlas exists to answer are all about relationships across providers, so a graph was required, and no single dashboard could ever hold it. Embedded SQLite won over a graph server because it matches a multi-process, no-daemon machine. The price is worth stating plainly. The map is local only and outside git, because even with no secret values in it a complete picture of your estate is exactly what an attacker wants. And absence is easy to get wrong: an early version called most services orphaned because the collector only knew one of the six ways a service can be reached, which is why the docs now demand complete edge coverage before any query is allowed to claim something is unused.","examples":[{"field":"distribution","text":"The wholesaler holds one graph of customers, delivery addresses, routes, vans, and the reps who own each account, rebuilt nightly from the systems that actually own each fact. When a rep leaves, the question is not \"who was on their list\" but \"which customers, which standing orders, and which route assignments now have no owner\", and one query answers it. A van sold last month stops being observed by the fleet source and shows up as stale rather than silently disappearing from the map."},{"field":"orchestra","text":"An orchestra keeps a live map of players, instruments, parts, and the works in the repertoire, drawn from the sources that own each fact rather than from a printed list. Before dropping a piece from the season, one question answers what else it would strand: the guest soloist booked only for it, the hired harp, the rehearsal slot. And a player who has not appeared on any roster for a season shows as inactive rather than being deleted by the first roster that forgot to mention them."}],"related":["pulse","security","hooks","cortex","ledger"],"without":"Without this: nobody can answer what deleting a domain would break, and services you stopped using stay on the mental list forever.","failure":"Everything the dashboard shows is dated a week ago, or a thing you deleted yesterday is still listed as live because no run has succeeded since."},{"id":"boundary","name":"System / User boundary","box":"control","status":"Code shipped. Four zones, three enforcement layers, plus a settings merge and a system overlay that keep the shared half updatable without touching the private half.","summary":"Every file in the install belongs to exactly one of four zones, so the parts anyone can share and the parts that are yours alone never end up in the same file.","purpose":"The same tree holds code meant for everyone and a life meant for one person. Without a declared line between them, the shareable half slowly absorbs real names, hostnames and credentials, and every release becomes a scrubbing exercise.","who":"lifeos","trigger":"Three moments. At [[session]] start an [[async hook]] runs `LIFEOS/TOOLS/MergeSettings.ts` to regenerate [[settings.json]] from a system file plus a user overlay. On any Write, Edit or MultiEdit, `hooks/PreToolGuard.hook.ts` routes to the system-file guard. At release time the build gates run as a last backstop.","input":"For the merge, a system settings file and an optional user overlay. For the guard, the target path plus the content about to be written. For the zone decision, the four-zone table in the boundary document.","output":"A regenerated [[settings.json]], and either an allowed write or [[exit code 2]] with a message naming which pattern the write tried to put into a [[SYSTEM zone]] file.","files":[{"path":"LIFEOS/TOOLS/MergeSettings.ts","mode":"exec","note":"deep-merges a system settings file with a user overlay; user values win, and it no-ops cleanly when the overlay is absent"},{"path":"settings.json","mode":"write","note":"a generated artifact, which is why hand edits to it are overwritten on the next merge"},{"path":"hooks/SystemFileGuard.hook.ts","mode":"exec","note":"the write-time check: blocks deny-list content landing in a SYSTEM file, and fails open on its own errors"},{"path":"hooks/lib/containment-zones.ts","mode":"read","note":"the path patterns that decide what is private, including the underscore-prefixed private skills"},{"path":"skills/LifeOS/Tools/OverlaySystem.ts","mode":"exec","note":"the update path: refreshes system-owned trees, never touches the user tree, deletes nothing"},{"path":"LIFEOS/TOOLS/LifeosConfig.ts","mode":"read","note":"the typed loader that is the sanctioned way for system code to read user values"}],"how":"`LIFEOS/DOCUMENTATION/SystemUserBoundary.md` puts every file into one of four zones. [[SYSTEM zone]] is public by construction: code, docs and templates containing zero references to any specific person, project, hostname or credential, using placeholders only. [[USER zone]] is private and may contain anything. [[INTERFACE zone]] is the contract between them, the schema shipping in SYSTEM while the values ship in USER. [[RUNTIME zone]] is ephemeral state that is never shipped and never edited by hand.\n\nSystem code is allowed to reach user data through exactly four channels: the typed loader, a path computed from a value the loader returned, an [[@-import]] declared at startup in [[CLAUDE.md]], or an HTTP call to the local [[Pulse]] server. Anything else, a hardcoded `LIFEOS/USER/` string in a module, a real voice ID in source, is a violation. On this machine the physical arrangement makes the line concrete: `LIFEOS/USER` and `LIFEOS/MEMORY` are both [[symlink]]s into a separate directory outside the install, so the private bytes live in their own repository and the [[symlink]] exists only so the harness's import resolver can find identity files at session start.\n\nEnforcement is three independent layers, each catching a different drift mode. Write time is the guard in the pre-tool dispatcher, which blocks the moment a private-looking value would land in a shared file, while the fix is still one line. Pull-request time runs a deny-list check in continuous integration. Release time runs the build gates as a backstop. Two shipped tools keep the split maintainable rather than merely declared: the settings merge, which regenerates the registration file from a system half plus a user overlay, and the system overlay tool, whose header lists the trees it will overwrite, states that the user tree and per-install state are never touched, and notes that it writes the version marker last so a half-finished update cannot present as complete.","sources":["LIFEOS/DOCUMENTATION/SystemUserBoundary.md","LIFEOS/TOOLS/MergeSettings.ts:L1-L33","skills/LifeOS/Tools/OverlaySystem.ts:L1-L60","LIFEOS/DOCUMENTATION/Hooks/HookSystem.md","LIFEOS/DOCUMENTATION/Skills/SkillSystem.md"],"alternatives":[{"name":"Scrub the tree before every release","tradeoff":"Wins zero runtime cost and no guard to maintain. Costs continuous drift: this is what LifeOS did through two major versions, and the doc records the result, that the maintainer and the community ran different artifacts and every release needed a fresh sanitisation sweep."},{"name":"Two separate repositories, synchronised by hand","tradeoff":"Wins a hard physical wall that no bug can cross. Costs a permanent copying tax, and the two copies diverge in exactly the places nobody remembers to copy."},{"name":"Keep everything private and never publish","tradeoff":"Wins total safety with no mechanism at all. Costs the point of the exercise: nobody else can run the system, and no fix from outside can come back in."}],"why":"The chosen answer is a structural one rather than a procedural one. Because the boundary is a property of where a file lives and is checked when a write happens, the question \"is the shared tree safe to publish?\" is answered continuously instead of re-answered by a sweep before each release. The success criterion is stated as a number rather than a feeling: the leak check reports zero real leaks on the live tree with no scrubbing step having run. The costs are worth naming. Contributors hit refusals for content that looks fine to them and have to learn where the value belongs. Configuration becomes a generated artifact, so editing it directly is silently undone. And the guard deliberately fails open on its own errors, meaning it is a first line rather than a wall, which is precisely why two more layers sit behind it.","examples":[{"field":"distribution","text":"A wholesaler builds a discount engine they want to reuse across three depots. The rule shapes, tier thresholds, a rounding policy, an effective-date field, go in the shared half as a schema with placeholder values. The actual numbers, this customer gets twelve percent from the first of March, live in the private half and are read through the typed loader. Someone pasting a real customer name into the shared schema as a helpful example gets refused at the moment of writing, with a message saying to use a placeholder and put the real name where customer data belongs."},{"field":"orchestra","text":"An orchestra works from one published score that every ensemble in the world can buy, while each player's own part carries their bowings, breath marks and fingerings in pencil. The two never merge. If a conductor's personal marking found its way into the printed score, every other orchestra would inherit a decision that was never theirs, which is exactly what a real hostname in a shared configuration file does."}],"related":["security","hooks","skills","ledger","cortex"],"without":"Without this: your identity, credentials and client data sit in the same tree as the code you want to share, and the only thing between them and a public push is remembering to scrub.","failure":"You find out at release time instead of write time: a leak check turns up a real hostname, path or credential inside a file that ships, which means the write-time guard was not in the path when it landed."},{"id":"bunker","name":"Bunker","box":"verification","status":"Blueprint only, private implementation. The concept document ships in the public release; the reference implementation and its `bunker` command are private infrastructure and are not in the release payload.","summary":"Bunker is the standard set of plumbing every app you ship sits inside, and the app's own spec doubles as the test suite that keeps checking it long after you stopped looking.","purpose":"Every application needs the same invisible machinery: backups, a deploy path with a way back, health checks, sign-in, security headers. Building it once per app produces several drifting copies, and skipping any of it produces a public failure.","who":"lifeos","trigger":"Three ways. Running the harness command against an [[ISA]] reads its test table and runs every [[probe]] in it. A deploy must register the app in the two always-on planes as part of the same motion. After that, a cloud health worker runs the compiled checks continuously and an hourly outside-in security scan runs from [[Arbol]].","input":"The application's own `ISA.md` or `bunker.isa.md`, specifically the table under its `## Test Strategy` heading, which carries one row per [[ISC]] with a type, a check, a threshold and the command that runs it.","output":"A pass or fail per [[probe]], a green, orange or red grade rendered on the [[Pulse]] dashboard's Bunker page, and an alert when a slow check fails.","files":[{"path":"LIFEOS/DOCUMENTATION/Bunker/BunkerSystem.md","mode":"read","note":"the concept document, which is the whole of what ships publicly"},{"path":"LIFEOS/DOCUMENTATION/ISA/ISAFormat.md","mode":"read","note":"defines the test table columns and the three verifier classes Bunker sorts on"},{"path":"the application's bunker.isa.md","mode":"read","virtual":true,"note":"lives in the app's own repository, not in this tree; it is the spec, the manifest and the test suite in one file"}],"how":"An app declares a type, and the type decides which components switch on across six planes: data, control, observability, identity, security and, for commercial apps, commerce. The app keeps everything a user sees, the design, the content, the domain rules. Bunker keeps the layer nobody sees. The doc's own phrasing is the clearest statement of the split: standardise the pipes, never the paint.\n\nThe idea that makes it more than a checklist is that the harness speaks [[ISA]]. One file is the spec, the component manifest, the executable test suite and the app's stored current state. A criterion's [[probe]] is its test case, so adding a feature means adding [[claim]]s to the spec that do not hold yet, and between builds the spec is the record of what the app is. Bunker runs exactly one of the three verifier classes the ISA format defines, the [[deterministic]] rows where a tool says no. Rows judged by a model and rows attested by a person are reported on the dashboard but never executed here.\n\nA second column splits jurisdiction in time. Fast rows, seconds long, are the only thing allowed to block: the development loop, the deploy gate, the close gate. Deep rows, soak tests and full sweeps, run on Bunker's own clock, locally on a schedule and hourly in the cloud, and a deep failure raises an alert and flips the app's grade without ever blocking a ship. Development stays quick because the blocking surface is small, and the expensive checking still happens on somebody else's time. The registration rule is the hard edge: every public deployment joins both always-on planes in the same motion as the deploy, and there is no deploy now and register later.","sources":["LIFEOS/DOCUMENTATION/Bunker/BunkerSystem.md","LIFEOS/DOCUMENTATION/CoreComponents.md","LIFEOS/DOCUMENTATION/ISA/ISAFormat.md:L424-L445","LIFEOS/DOCUMENTATION/Security/README.md"],"alternatives":[{"name":"Build the invisible layer fresh in each application","tradeoff":"Wins a perfect fit for each app and no shared abstraction to fight. Costs several drifting copies of the same machinery, where a fix made in one app never reaches the other four."},{"name":"Keep the specification and the test suite as separate artifacts","tradeoff":"Wins familiarity, because that is how nearly everyone works, and lets each be written in its natural form. Costs drift between them: the spec describes an app that no longer exists while the tests pass, and nothing forces the two back together."},{"name":"Rent the layer from a hosting platform","tradeoff":"Wins immediate coverage of deploys, backups and uptime with no code of your own. Costs the security plane specifically, since an outside-in scan of your own auth boundaries and exposed paths is not something a generic platform performs for you, and it costs portability."}],"why":"Making one file be both the spec and the test suite is the whole bet. It removes the failure mode where a written specification and a test folder describe two different applications, because a criterion and its probe are the same row. It also gives verification a home after the build ends: the [[Algorithm]] climbs toward an ideal state while you are working, and Bunker holds the app to that ideal state for as long as it lives. The tier split is what makes that affordable, since only the seconds-long checks are allowed to stand in your way. The costs are large and stated plainly. The reference implementation is private, so the public release ships the design and you build your own against it. And the registration rule means shipping is heavier by a step, which is precisely the step people skip when it is optional.","examples":[{"field":"distribution","text":"A wholesaler ships a customer ordering portal. Its spec carries a row asserting that a signed-out visitor requesting another customer's order returns a refusal, and a row asserting the nightly stock feed actually landed rows today. Both are fast checks, so both block the deploy. A slow row that replays a full day of orders against the pricing rules runs hourly instead and only raises an alert. The portal answering with a page is not the same as the portal doing its job, which is why the stock-feed row exists at all."},{"field":"power plant","text":"A generating station does not rely on the crew noticing that a pump sounds wrong. Interlocks that trip in seconds are wired into the start sequence and will refuse to let it run, while the slow work, vibration trending, oil analysis, thermal surveys, happens on a maintenance calendar and produces a work order rather than a shutdown. The commissioning document listing what each system must do is the same document the inspector tests against, which is exactly the trick of a spec that is also the test suite."}],"related":["isa","arbol","security","pulse","algorithm"],"without":"Without this: every app you ship grows its own hand-rolled backups, deploys, health checks and security headers, and the one you forgot is the one that fails in public.","failure":"An application is live and nobody can say when it was last checked or by what, because it was deployed without being registered in the health and security planes, so it is invisible to both."},{"id":"conduit","name":"Conduit","box":"context","status":"Code shipped. The capture command, the installer, the hourly read and the dashboard module all ship in the public release. It is opt-in and switched off until you install it, its scheduler is macOS-only as written, and its data directory does not exist until you run it.","summary":"A quiet recorder of where your attention actually went today, so the system can compare what you did against what you said you wanted.","purpose":"The system already knows your [[ideal state]] from [[TELOS]], but had no idea what you actually do all day, so it could not answer whether you are working on the right things. [[Conduit]] supplies the missing half: an observed record of where attention went.","who":"lifeos","trigger":"A [[launchd]] job named `com.lifeos.conduit` runs `conduit capture` every 120 seconds. A second hourly job runs the content-type read. Nothing here is triggered by a [[prompt]] or by you, which is the point: it has to run whether or not anyone is watching.","input":"Three adapters, each fault-isolated so one failing does not stop the others: which application is in front, new commits in the repositories you listed, and coding sessions read from the work event log.","output":"One [[JSONL]] line per signal in an append-only daily file, then a single [[deterministic]] daily record in both machine and human form. That record feeds [[Cortex]], the dashboard, and the observed side of the gap computation.","files":[{"path":"LIFEOS/PULSE/Conduit/conduit.ts","mode":"exec","note":"the CLI: capture, rollup, today, status, init"},{"path":"LIFEOS/PULSE/Conduit/InstallConduit.ts","mode":"exec","note":"installs and loads the scheduled job, or removes it"},{"path":"LIFEOS/PULSE/Conduit/BuildInsight.ts","mode":"exec","note":"the hourly content-type read, the only part that calls a model"},{"path":"LIFEOS/PULSE/modules/conduit.ts","mode":"exec","note":"the read-only dashboard API; holds zero data of its own"},{"path":"LIFEOS/TOOLS/UpdateLifeosState.ts","mode":"exec","note":"folds the observed signal into the state file the dashboard rings read"},{"path":"LIFEOS/USER/CONDUIT","mode":"read+write","virtual":true,"note":"config, raw events and daily records; created by conduit init and absent until then"}],"how":"Capture is cheap and dumb on purpose. Every two minutes the job wakes, asks three adapters what they see, and appends one line per signal. An event carries a timestamp, a type, the adapter that produced it, and a dimension key such as an application name or a repository. It never carries keystrokes, window titles or message content. That restriction is what makes the whole thing acceptable to run continuously.\n\nRollup is a pure function. `buildDailyRecord` takes the day's events and returns the record with no side effects and no model involved. Each focus event contributes one poll interval to that application's time, which has a pleasant property: a sleeping machine fires no polls, so a night of sleep cannot inflate anything. A small static map splits applications into creation, consumption and neutral, and you can edit it, because the classification is a proxy and everyone's proxy is different.\n\nOne thing is deliberately absent. Conduit never produces a single alignment score. The stated reason is that one number invites gaming, so what you get is the distribution plus the record and the judgement stays yours. The same discipline governs how it touches [[TELOS]]: TELOS owns the ideal state, Conduit owns the observed state, and neither writes the other's file. They meet only where the gap is computed.\n\nThe one non-deterministic part is quarantined. Answering what kind of work came in is not something a static rule can do, so `BuildInsight.ts` runs hourly, builds a bounded metadata-only summary of top applications, commit subjects and session names, and asks the cheapest model rung. It skips the call entirely on an idle hour, and a failed read never overwrites a good one. The dashboard tab reads that cached file and never calls a model when you open it.","sources":["LIFEOS/DOCUMENTATION/Conduit/ConduitSystem.md","LIFEOS/DOCUMENTATION/Memory/MemorySystem.md","LIFEOS/DOCUMENTATION/Synapse/SynapseSystem.md"],"alternatives":[{"name":"A commercial time-tracking app","tradeoff":"Wins on polish, mobile coverage and reports you do not have to build. Costs where the data lives, since it leaves your machine, and it cannot be joined to your own goals because the vendor has never heard of them."},{"name":"Screenshots or full activity capture","tradeoff":"Wins on completeness, catching browser tabs and documents that a front-window poll misses entirely. Costs a permanent record of everything you read and wrote, which is a much larger thing to protect and a much worse thing to leak."},{"name":"Just ask the person at the end of the day","tradeoff":"Wins on zero infrastructure and on capturing intent, which no sensor can see. Costs accuracy in a predictable direction, because self-reported time reliably flatters the reporter and the afternoon that disappeared is the part nobody remembers."}],"why":"Conduit is a mirror you pull rather than a watcher that pushes, and almost every design decision follows from that. Metadata only, so continuous capture is defensible. Local only, so there is nothing to leak. A pure rollup and a static classifier, so today's number can be recomputed and explained tomorrow. Per-source opt-in and a real off switch, so consent is granular. The price is admitted honestly in its own documentation: version one watches the front window, new commits and coding sessions, and has no browser adapter, so a day of research in a browser reads as almost empty. The system is built to say \"no browser adapter yet\" rather than \"you did nothing\", because a sensor that dresses up a blind spot as a verdict is worse than one that has no opinion.","examples":[{"field":"distribution","text":"A depot manager believes the morning goes on route planning. The record shows ninety minutes in the planning tool and four hours in email and the phone. Nothing accuses anybody. The distribution is simply laid out, and the useful move is obvious: the four hours are mostly order corrections, which is a data-capture problem upstream rather than a discipline problem in the depot."},{"field":"school","text":"A teacher logging what actually filled each period finds that the twelve minutes budgeted for admin is really twenty-five, every day, and it eats the end of the lesson rather than the start. That is a timetable finding, not a personal failing. The log had to be kept mechanically to be believed, because reconstructing it from memory on Friday produces the timetable you meant to run."}],"related":["telos","cortex","synapse","feed","pulse"],"without":"Without this: the system knows what you want and has no idea what you actually did, so it can only ever compare your goals against your own description of your week.","failure":"You notice it is broken when the daily record is empty on a day you know you worked, or when the dashboard tab keeps showing the same day for a week because the scheduled job stopped firing."},{"id":"context","name":"Context & configuration","box":"context","status":"Code shipped. The launcher, the constitutional rules file, the routing table and the settings merge driver all ship in the public release and run on every session start.","summary":"The machinery that decides what the AI already knows the moment you start talking to it, before you type a single word.","purpose":"A fresh [[model]] knows nothing about you, your rules, or your machine. This layer loads a fixed set of files into the [[context window]] at startup so the first [[prompt]] of a [[session]] lands on a system that is already oriented.","who":"lifeos","trigger":"You type the [[launcher]] [[alias]] `lifeos`. That runs `bun ~/.claude/LIFEOS/TOOLS/lifeos.ts`, which spawns the real [[Claude Code]] binary with `--append-system-prompt-file` pointing at the LifeOS rules file. It then reads [[CLAUDE.md]] and follows its top-level [[@-import]] lines.","input":"Four things on disk: the constitutional rules at `LIFEOS/LIFEOS_SYSTEM_PROMPT.md`, the routing table `CLAUDE.md`, the files that table imports, and [[settings.json]] for hooks, permissions and environment.","output":"A session that starts with the rules at the highest instruction layer, your identity and project files already in [[context]], and every [[hook]] registered. Nothing is retrieved on demand. It is simply there.","files":[{"path":"LIFEOS/TOOLS/lifeos.ts","mode":"exec","note":"the launcher; builds the argument list and spawns claude"},{"path":"LIFEOS/LIFEOS_SYSTEM_PROMPT.md","mode":"read","note":"constitutional rules, appended to the harness system prompt at launch"},{"path":"CLAUDE.md","mode":"read","note":"the routing table and the list of top-level imports"},{"path":"LIFEOS/USER/TELOS/PRINCIPAL_TELOS.md","mode":"read","note":"one of the six files CLAUDE.md imports at startup"},{"path":"LIFEOS/TOOLS/MergeSettings.ts","mode":"exec","note":"deep-merges the system defaults and the user overlay into the generated settings file"},{"path":"settings.json","mode":"read+write","note":"generated, then read by the harness for hooks, permissions and environment"}],"how":"Start with the launcher, because it is the part people miss. `LIFEOS/TOOLS/lifeos.ts` is a small [[bun]] [[TypeScript]] program. Its launch function checks that the file exists and then pushes `--append-system-prompt-file` with the path to `LIFEOS/LIFEOS_SYSTEM_PROMPT.md` onto the argument list before spawning `claude`. That flag matters because the [[system prompt]] layer outranks everything else. The same function deletes the API key from the child environment on purpose, so the session bills against the subscription rather than the API.\n\nNext comes the routing table. `CLAUDE.md` is deliberately thin. It says where things live and it lists six files to import at the top level. `LIFEOS/DOCUMENTATION/Config/ConfigSystem.md` explains the constraint that forces the shape: the harness does not follow an [[@-import]] found inside an already-imported file. Nesting them would look tidy and load nothing, so every identity file gets its own line in the top-level list.\n\nLast is the split between the framework and your life. The documented contract in ConfigSystem.md is a [[SYSTEM zone]] that ships publicly and a [[USER zone]] that stays private, mounted into the tree by [[symlink]], with `LIFEOS/TOOLS/MergeSettings.ts` deep-merging a system defaults file and a user [[overlay]] into the generated [[settings.json]] at session start. The user half wins on any conflict. The generated file is the one the harness actually reads, which is why hand-editing it is wasted work: the next session rebuilds it from the two sources.","sources":["CLAUDE.md","LIFEOS/DOCUMENTATION/Config/ConfigSystem.md","LIFEOS/TOOLS/lifeos.ts:L493-L570","LIFEOS/LIFEOS_SYSTEM_PROMPT.md:L1-L60"],"alternatives":[{"name":"One enormous CLAUDE.md holding everything","tradeoff":"Wins on simplicity, since there is one file and no import rules to learn. Costs [[token]] budget on every session and makes the public and private halves impossible to separate, so the framework can never be shared without shipping your life with it."},{"name":"Load context on demand through an [[MCP server]]","tradeoff":"Wins on paying only for what a task needs, and the data can live anywhere. Costs a running service on the startup path, and it is retrieval rather than context: the model has to know it should ask, which is exactly the thing a fresh session does not know."},{"name":"Bake the rules into a fine-tuned model","tradeoff":"Wins on rules that cannot be forgotten or edited away, at zero context cost. Costs the ability to change anything today, and your goals change faster than a training run. A [[dry run]] of a rule change becomes a retraining project."}],"why":"LifeOS puts the non-negotiable rules in the [[system prompt]] layer and everything else in an import list because the two need different authority. Rules that must never be overridden go where nothing outranks them. Facts about your life go in files you can edit between sessions and see in a diff. Splitting system from user by [[zone]] and merging at runtime is what lets the framework ship publicly while your version stays yours. The cost is paid on every single session: this context is loaded whether the task needs it or not, and it is the largest fixed [[token]] charge in the system. LifeOS takes that trade because a session that starts oriented beats a session that has to be told, and because a rule that loads conditionally is a rule that eventually does not load.","examples":[{"field":"distribution","text":"A wholesaler keeps one standing rule that no price, tax rate or customer name may be written as a literal in code. Put it in the constitution and every developer session starts holding it, including the one at 7pm when someone just wants the invoice screen to work. Put it in a wiki page instead and it binds only the people who happened to read the wiki that week."},{"field":"airport","text":"A ground-handling crew has a briefing board every shift starts at: today's stand allocations, the standing safety rules, who is on shift. Nobody asks for it and nobody looks it up. It is read before the first aircraft moves, which is why it works. The startup import list is that board, and the constitution is the part of it that never changes between shifts."}],"related":["telos","boundary","hooks","algorithm","security"],"without":"Without this: every session starts blank, the rules bind only when you remember to paste them, and your identity files sit on disk unread.","failure":"You notice it is broken when the assistant asks something it should already know from a startup file, or when a rule you wrote down gets violated on the first turn of a fresh session."},{"id":"cortex","name":"Cortex","box":"memory","status":"Code shipped. The per-prompt hooks, the reviewer, the writer with its safety guards and the tiered store all ship and are registered in this install.","summary":"The part that remembers. It slips a short list of facts about you into every prompt, and while you are idle it rereads the conversation and rewrites that list.","purpose":"A [[session]] that ends forgets everything it learned. [[Cortex]] is the store that keeps what each session taught and the loop that puts the relevant part back into [[context]] the moment it matters, so the next session starts smarter than the last.","who":"lifeos","trigger":"Two different triggers, one per direction. Reading fires on UserPromptSubmit: `hooks/MemoryTurnStart.hook.ts` runs on every [[prompt]] with an 8 second [[timeout]]. Writing fires at the [[Stop gate]]: `hooks/MemoryReviewFire.hook.ts` counts turns and, when three conditions all hold at once, spawns the reviewer as a background process.","input":"On the read side, your prompt text and the two [[hot layer]] files. On the write side, the recent [[transcript]] plus the current contents of those same files, because the reviewer is asked to revise a list rather than extend one.","output":"On the read side, blocks of [[additionalContext]] injected before the model sees your prompt. On the write side, typed items routed to their homes: hot-layer facts, notes in the [[knowledge archive]], and proposals queued for your approval.","files":[{"path":"hooks/MemoryTurnStart.hook.ts","mode":"exec","note":"the one UserPromptSubmit memory hook; composes three sub-hooks plus retrieval in a single process"},{"path":"hooks/LoadMemory.hook.ts","mode":"exec","note":"renders the two hot-layer files as a lifeos-memory block"},{"path":"hooks/MemoryDeltaSurface.hook.ts","mode":"exec","note":"computes the visible memory status line so the model never invents one"},{"path":"hooks/MemoryReviewFire.hook.ts","mode":"exec","note":"registered on Stop; counts turns, decides, and fires the reviewer"},{"path":"LIFEOS/TOOLS/MemoryReviewer.ts","mode":"exec","note":"reads the recent transcript, calls a cheap model, routes the typed items it returns"},{"path":"LIFEOS/TOOLS/MemoryRetriever.ts","mode":"exec","note":"BM25 search over the typed corpus; pure function, no model call"},{"path":"LIFEOS/USER/PRINCIPAL/PRINCIPAL_MEMORY.md","mode":"read+write","note":"the hot layer about you; capped at 48 entries of 256 characters"},{"path":"LIFEOS/MEMORY/KNOWLEDGE","mode":"write","note":"the curated archive of people, companies, ideas and research"}],"how":"Read first, because it happens on every single [[turn]]. `hooks/MemoryTurnStart.hook.ts` is one process doing four jobs. It injects the two hot-layer files, it emits the visible status line, and it runs [[BM25]] [[retrieval]] over the typed corpus using your actual prompt as the query, taking the top five hits above a score of 0.20. Below that threshold it injects nothing at all, header included, so a trivial prompt costs no [[token]]. The hot layer is gated separately: it goes in on the first prompt of a session, whenever the files changed, or after twenty turns without an injection, because injecting the same block on every prompt duplicated it dozens of times per session.\n\nWrite is the other half, and it is why Cortex counts as both a read box and a write box. `hooks/MemoryReviewFire.hook.ts` runs at Stop and gates on three conditions joined by AND: at least eight turns in this session, at least thirty minutes since the last review anywhere, and at least two minutes idle. Only then does `LIFEOS/TOOLS/MemoryReviewer.ts` spawn. It reads the recent transcript, calls a cheap model, and gets back typed items. A new prompt before the timer expires cancels the whole thing.\n\nThe write mode is the interesting design choice. The reviewer is not asked to append a fact. It is shown the current list and asked for the full desired next state, which the writer applies as a replace. So forgetting is omission: a stale fact is dropped by leaving it out, and a contradicted one is superseded. That is what makes a capped list survivable, since the system can always drop something to make room. It is also dangerous, because a replace has whole-file blast radius, so two guards run inside the lock. One blocks a result that is near-empty or drops more than half the entries with no additions. The other catches slow erosion, where each write is ten percent smaller than the last and every individual write looks fine. Every write also snapshots the previous file into a ring buffer first, so a single bad revision is reversible.\n\nOne permission rule sits under all of it. `LIFEOS/TOOLS/MutationTier.ts` is a code-only allowlist that is default-deny. Tier A is overwritten automatically. Tier B is appended with an audit row. Tier C can only be proposed for your approval. Tier D, which includes hooks, settings, skills and the rules file, is untouchable by the memory system entirely.","sources":["LIFEOS/DOCUMENTATION/Memory/MemorySystem.md","hooks/MemoryTurnStart.hook.ts","hooks/LoadMemory.hook.ts","hooks/MemoryDeltaSurface.hook.ts:L1-L60","skills/Cortex/SKILL.md:L1-L55"],"alternatives":[{"name":"Append-only notes that never forget","tradeoff":"Wins on never losing anything, and the history is auditable. Costs relevance and context budget: the file grows without bound, contradictions pile up next to each other, and eventually the true fact and the fact it replaced are both in the prompt."},{"name":"A vector database with embedding search","tradeoff":"Wins on finding things you asked for in different words than you stored them. Costs a service to run, an index to keep in step with the files, and explainability, since you cannot read a diff of why a fact surfaced. Cortex explicitly declares no index and searches the canonical files directly."},{"name":"The harness built-in automatic memory","tradeoff":"Wins on zero setup and no code to maintain. Costs control over what is remembered, where it lives and who may write it. LifeOS disables it in the shipped settings so there is one store rather than two that disagree."}],"why":"Cortex chose a small capped list of plain files over a growing archive because the read path runs on every turn and has to stay cheap and legible. Facts you can read in a text editor are facts you can correct. The revise-the-whole-list model is what makes a cap workable instead of a wall you hit, and it is why forgetting is a first-class operation rather than an accident. The costs are honest and documented. A replace can destroy, so two guards and a snapshot ring exist purely to survive one bad revision. Every read is a [[fail-open]] path, meaning any error writes to [[stderr]] and exits zero rather than blocking your prompt, which also means a dead hook looks exactly like a quiet week. That is why a heartbeat file and a health check exist to catch silence that should have been noise.","examples":[{"field":"distribution","text":"Over a few weeks the system learns that this wholesaler counts a case as twelve bottles, that the Tbilisi depot closes at 4pm so same-day cutoffs are 2pm, and that one customer group is invoiced monthly rather than per delivery. None of that is in the code. It sits in the hot layer, so a request for a delivery report on a Friday afternoon already knows what a case is and which orders cannot make today."},{"field":"orchestra","text":"A rehearsal assistant that remembers the second oboe is on leave until March, that the hall's reverb makes the brass sit two clicks under, and that the conductor takes the third movement faster than the marking. Next week it does not have to be told again. When the oboe comes back, the right move is not to add a new note. It is to drop the old one, which is exactly what a revise-the-list write does."}],"related":["synapse","conduit","learning","hooks","algorithm"],"without":"Without this: every session starts from zero, and the same corrections get typed again next week.","failure":"You notice it is broken when the system asks you something you explained last week, or when a fact you corrected keeps coming back in later sessions."},{"id":"doctor","name":"Doctor & freshness","box":"verification","status":"Code shipped. The prober, the freshness library, the cache writer, and the dashboard page all ship and run offline by default. One honest gap: the freshness documentation still describes a grade line on the [[statusline]], and the shipped statusline script records that this line was removed in May 2026, so the grades now surface through the dashboard rather than the terminal.","summary":"Two checkers that ask whether the tools the system assumes it has still work, and whether the files describing your life have been read by a human recently enough to trust.","purpose":"Both halves attack the same failure. A capability that is assumed but never checked breaks silently, and a file about your life that nobody has reviewed in months looks identical to one reviewed yesterday, so the system acts with confidence on ground that has moved.","who":"lifeos","trigger":"You run the [[Doctor]] yourself, or the install [[skill]] routes you to it when you ask what is broken. The dashboard also shells it with a thirty-second cache. The freshness half has three writers instead: any timestamp bump rewrites the cache, the dashboard rewrites it when its own cache flips, and a SessionStart [[hook]] rewrites it to catch a file that simply aged past its window overnight.","input":"For the Doctor: the presence and response of each external tool, plus core wiring like [[hook]] interpreter resolution. For freshness: the [[frontmatter]] of the constitutional files, specifically the last-reviewed timestamp, and the per-file threshold.","output":"An advisory capability manifest listing each capability in one of four states, with a copy-paste fix command for anything broken. A letter grade from A to F per file plus an overall grade, and a ranked list of what is most overdue.","files":[{"path":"LIFEOS/TOOLS/Doctor.ts","mode":"exec","note":"the prober and the manifest writer"},{"path":"LIFEOS/MEMORY/STATE/capabilities.json","mode":"write","note":"the manifest, carrying a salted integrity hash"},{"path":"LIFEOS/MEMORY/STATE/doctor-heartbeat.json","mode":"write","note":"when the checker last actually ran"},{"path":"LIFEOS/TOOLS/TelosFreshness.ts","mode":"exec","note":"the one freshness library, readers and writers both"},{"path":"LIFEOS/TOOLS/FreshnessCache.ts","mode":"exec","note":"writes the tiny mirror the render path reads"},{"path":"LIFEOS/USER/CACHE/freshness.json","mode":"write","note":"the mirror: private, atomically written, capped under 4KB"},{"path":"LIFEOS/PULSE/modules/doctor.ts","mode":"exec","note":"read-only health surface; holds no truth of its own"},{"path":"LIFEOS/LIFEOS_StatusLine.sh","mode":"exec","note":"the terminal render path, which must never make a network call"}],"how":"The header of LIFEOS/TOOLS/Doctor.ts states the design contract, and the interesting parts are all restraints. The manifest is an advisory cache with a time to live, never truth, so anything doctrine actually depends on re-verifies live rather than trusting the file. There are four states and the fourth is the good idea: alongside live, broken, and stale sits declined, which is permanently silent. Opting out of a capability is a legitimate way to run the system, not a defect to be nagged about. There are no scores and no percentages, only a diagnostic register. And the default run is never fatal: it exits zero, every [[probe]] is bounded by a timeout, and network probes only fire when you ask for them and only for capabilities you actually configured.\n\nThe freshness half turns on one distinction, set out in LIFEOS/DOCUMENTATION/Freshness/FreshnessSystem.md. Two timestamps live in the [[frontmatter]] of every constitutional file. One answers when the bytes last changed. The other answers when a human last vouched for the content. Only the second drives the grade. So a migration that reformats a file bumps the first and the grade correctly stays at F, and a file nobody has read in six months cannot show an A just because a generator touched it.\n\nThresholds are per file and reflect review cadence rather than change cadence: the operational current-state section is a week, the project registry a month, the assistant's own identity six months. The grade is the ratio of review age to that threshold, mapped onto A through F, and the whole set averages into one letter. Because the terminal render path runs every second and must never block, LIFEOS/TOOLS/FreshnessCache.ts writes a tiny file that the shell reads directly, and the documentation is explicit that a missing cache degrades to a dash rather than hanging.","sources":["LIFEOS/DOCUMENTATION/Freshness/FreshnessSystem.md","LIFEOS/TOOLS/Doctor.ts:L1-L45","skills/LifeOS/SKILL.md:L30-L45","LIFEOS/LIFEOS_StatusLine.sh:L1586-L1594","LIFEOS/DOCUMENTATION/Pulse/PulseSystem.md"],"alternatives":[{"name":"Check the capability at the moment you need it","tradeoff":"Always accurate, since nothing is cached and nothing can be stale. Costs you every discovery at the worst time, because you learn the browser tool is broken halfway through the job that needed it rather than the day it broke."},{"name":"A single health score out of a hundred","tradeoff":"Wins glanceability, and one number is easy to put on a dashboard. Costs the only thing you can act on, because a score of 82 does not tell you which capability is down or what command fixes it, and it makes a deliberate opt-out look like damage."},{"name":"Grade the file by when it last changed","tradeoff":"Trivial to compute, since the file system already knows. Measures the wrong thing entirely: an automatic generator rewriting a file every night would show a permanent A on content no human has looked at in a year."}],"why":"Both halves are built around the same conclusion: the dangerous state is confident and wrong, not missing. That is why the Doctor keeps a diagnostic register instead of a score, why declined is a first-class silent state, and why the manifest carries a tamper hash while still being treated as untrusted by anything that matters. It is why freshness splits the two timestamps, since collapsing them would turn the grade into noise within a week. The cost is a permanent low-level nag surface, plus a real trap the docs name outright: bump the review timestamp from a generator once, and the whole signal quietly becomes a lie.","examples":[{"field":"distribution","text":"Two different checks in the same depot. The morning walk-around confirms the tools work: the forklift charges, the label printer prints, the handheld scanner reads a test barcode, and a van deliberately off the road is marked as such so it never shows as a fault again. Separately, every customer's credit limit and delivery window carries the date a human last confirmed it, because a limit set two years ago looks exactly like one confirmed last week until the file says otherwise."},{"field":"farm","text":"A farmer checks the equipment on a schedule and records which machines are simply retired, so they stop showing up as broken. Soil tests carry their own clock: a field tested this spring is trusted, a field last tested four years ago is not, and the pla
